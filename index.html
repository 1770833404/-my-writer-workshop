<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>网文创作中枢 手机专用 · 朱雀免代理版</title>
  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
  <style>
    :root{--bg:#0f0d0a;--panel:#1c1610;--text:#d4be8c;--accent:#c0843a;--accent2:#e6a34c;--border:#3d2b18;--editor:#2c2218;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:PingFang SC,Noto Serif SC,KaiTi,sans-serif;background:var(--bg);color:var(--text)}
    .sidebar{width:240px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0}
    .sidebar h3{padding:18px 14px;color:var(--accent2);text-align:center;border-bottom:1px solid var(--border)}
    .tab-list{flex:1;overflow-y:auto;padding:8px}
    .tab-btn{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--text);padding:12px;margin-bottom:2px;border-radius:8px;font-size:0.9rem}
    .tab-btn.active,.tab-btn:hover{background:var(--editor);border-color:var(--accent);color:var(--accent2)}
    .main-area{margin-left:240px;padding:20px;min-height:100vh}
    .panel{display:none;flex-direction:column;gap:14px}
    .panel.active{display:flex}
    h3{color:var(--accent2);font-size:1.3rem;border-bottom:1px solid var(--border);padding-bottom:8px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{display:flex;flex-direction:column;gap:4px}
    label{font-size:0.8rem;color:var(--accent)}
    input,textarea,select{background:var(--editor);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font-size:0.9rem;outline:none}
    textarea{min-height:80px;resize:vertical}
    .btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:20px;cursor:pointer;font-weight:bold}
    .btn:disabled{opacity:0.6}
    .btn-sm{padding:6px 12px;font-size:0.8rem;border-radius:14px}
    .btn-danger{background:#a05a3a}
    .card{background:var(--editor);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
    .list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--editor);border-radius:8px;margin-bottom:6px}
    .tag{background:var(--accent);color:#fff;padding:2px 10px;border-radius:12px;font-size:0.7rem}
    .memory-box{background:#1a1410;border:1px solid var(--border);border-radius:var(--radius);padding:12px;max-height:220px;overflow-y:auto;white-space:pre-wrap;font-size:0.85rem}
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#2f2416;color:#ffcf8a;padding:8px 20px;border-radius:20px;z-index:999;opacity:0;transition:0.3s}
    .toast.show{opacity:1}
    .hint{font-size:0.7rem;color:#8a7958;margin-top:-8px}
    .hide{display:none !important}
    .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    @media (max-width:768px){.sidebar{width:100%;height:auto;position:relative}.main-area{margin-left:0}.grid-2{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="sidebar">
  <h3>📖 创作中枢</h3>
  <div class="tab-list" id="tabList"></div>
</div>
<div class="main-area" id="mainArea"></div>
<div class="toast" id="toast"></div>

<script>
const CONFIG = {
  DB_NAME:'NovelWriterFinal',
  API_DEFAULT_URL:'https://api.deepseek.com/v1',
  API_DEFAULT_MODEL:'deepseek-v4-pro',
  MEMORY_SLICE_SIZE:15000,
  MAX_SLICES:20,
  ZHUQUE_PASS_SCORE:5,
  ZHUQUE_MAX_ROUNDS:8,
  API_TIMEOUT:90000
};
const LS={get(k,f=null){try{let v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return!0}catch{return!1}}};
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const Toast={show(m){let t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.remove('show'),2000)}};
const countWords=t=>t.replace(/\s/g,'').length;
const tabs=[
  {id:'dashboard',label:'🏠 总控台'},
  {id:'characters',label:'👤 人设库'},
  {id:'world',label:'🌍 世界观'},
  {id:'outline',label:'📋 三层大纲'},
  {id:'chapters',label:'📚 章节管理'},
  {id:'memory',label:'🧠 记忆库'},
  {id:'write',label:'✍️ 写作'},
  {id:'check',label:'🔍 逻辑校验'},
  {id:'style',label:'🎨 风格定制'},
  {id:'backup',label:'💾 备份导入'}
];
function initNav(){let l=$('#tabList');l.innerHTML=tabs.map(t=>`<button class="tab-btn" data-tab="${t.id}">${t.label}</button>`).join('');$$('.tab-btn').forEach(b=>b.onclick=e=>switchTab(e.target.dataset.tab))}
function switchTab(tabId){$$('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tabId));let m=$('#mainArea');m.innerHTML='';let p=document.createElement('div');p.className='panel active';p.id='panel-'+tabId;m.appendChild(p);let r={dashboard:renderDashboard,characters:renderCharacters,world:renderWorld,outline:renderOutline,chapters:renderChapters,memory:renderMemory,write:renderWrite,check:renderCheck,style:renderStyle,backup:renderBackup};if(r[tabId])r[tabId](p)}
async function callAi(url,key,model,sys,usr,maxT=6000){try{let res=await fetch(`${url}/chat/completions`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},body:JSON.stringify({model,messages:[{role:'system',content:sys},{role:'user',content:usr}],temperature:0.85,max_tokens:maxT})});if(!res.ok)throw new Error('API请求失败');let d=await res.json();return d?.choices?.[0]?.message?.content||''}catch(e){throw e}}

// 手机专用：公共跨域中转 不用本地Flask、不用密钥、iPhone直接用
async function detectZhuque(text){
  let raw=await fetch("https://api.oioweb.cn/api/check/ai",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({content:text.slice(0,6000)})
  });
  let j=await raw.json();
  if(!j||j.code!==200)throw new Error('检测接口异常');
  let score=Math.round(j.data.ai*100);
  return {name:"AI检测",score:score};
}

function renderDashboard(p){p.innerHTML=`<h3>🏠 小说基础信息</h3><div class="grid-2"><div class="field"><label>小说名称</label><input id="novelTitle"></div><div class="field"><label>类型/流派</label><input id="novelGenre"></div></div><div class="field"><label>世界观简介</label><textarea id="novelWorldIntro"></textarea></div><div class="field"><label>故事基调/读者定位</label><input id="novelTone"></div><button class="btn" id="saveDashboard">💾 保存</button>`;$('#novelTitle').value=LS.get('novelTitle','');$('#novelGenre').value=LS.get('novelGenre','');$('#novelWorldIntro').value=LS.get('novelWorldIntro','');$('#novelTone').value=LS.get('novelTone','');$('#saveDashboard').onclick=()=>{LS.set('novelTitle',$('#novelTitle').value);LS.set('novelGenre',$('#novelGenre').value);LS.set('novelWorldIntro',$('#novelWorldIntro').value);LS.set('novelTone',$('#novelTone').value);Toast.show('已保存')}}
function renderCharacters(p){p.innerHTML=`<h3>👤 人设库</h3><div id="charList"></div><button class="btn btn-sm" id="addChar">+ 新建角色</button><div class="card hide" id="charEditor"><div class="grid-2"><div class="field"><label>全名</label><input id="charName"></div><div class="field"><label>别名</label><input id="charAlias"></div></div><div class="field"><label>性格</label><input id="charPersonality"></div><div class="field"><label>境界</label><input id="charRealm"></div><div class="field"><label>口头禅</label><input id="charCatchphrase"></div><div class="field"><label>弱点/禁忌</label><input id="charWeakness"></div><div class="field"><label>关系网</label><textarea id="charRelations"></textarea></div><button class="btn" id="saveChar">保存角色</button></div>`;let cur=null;const refresh=()=>{let c=LS.get('characters',[]);$('#charList').innerHTML=c.map((x,i)=>`<div class="list-item"><span><strong>${x.name}</strong> <span class="tag">${x.realm||'未知'}</span></span><div><button class="btn btn-sm edit-char" data-index="${i}">编辑</button><button class="btn btn-sm del-char btn-danger" data-index="${i}">删除</button></div></div>`).join('');$$('.edit-char').forEach(b=>b.onclick=()=>{let x=LS.get('characters',[])[b.dataset.index];cur=b.dataset.index;for(let k in x){let el=$('#char'+k.charAt(0).toUpperCase()+k.slice(1));if(el)el.value=x[k]||''}$('#charEditor').classList.remove('hide')});$$('.del-char').forEach(b=>b.onclick=()=>{if(!confirm('确定删除？'))return;let c=LS.get('characters',[]);c.splice(b.dataset.index,1);LS.set('characters',c);refresh()})};refresh();$('#addChar').onclick=()=>{cur=null;['charName','charAlias','charPersonality','charRealm','charCatchphrase','charWeakness','charRelations'].forEach(id=>$('#'+id).value='');$('#charEditor').classList.remove('hide')};$('#saveChar').onclick=()=>{let name=$('#charName').value.trim();if(!name)return Toast.show('请输入角色名');let o={name,alias:$('#charAlias').value,personality:$('#charPersonality').value,realm:$('#charRealm').value,catchphrase:$('#charCatchphrase').value,weakness:$('#charWeakness').value,relations:$('#charRelations').value};let c=LS.get('characters',[]);cur!==null?c[cur]=o:c.push(o);LS.set('characters',c);$('#charEditor').classList.add('hide');refresh();Toast.show('已保存')}}
function renderWorld(p){p.innerHTML=`<h3>🌍 世界观规则</h3><div class="field"><label>修炼体系</label><textarea id="worldRealm"></textarea></div><div class="field"><label>势力分布</label><textarea id="worldMap"></textarea></div><div class="field"><label>世界铁律</label><textarea id="worldRules"></textarea></div><button class="btn" id="saveWorld">💾 保存</button>`;$('#worldRealm').value=LS.get('worldRealm','');$('#worldMap').value=LS.get('worldMap','');$('#worldRules').value=LS.get('worldRules','');$('#saveWorld').onclick=()=>{LS.set('worldRealm',$('#worldRealm').value);LS.set('worldMap',$('#worldMap').value);LS.set('worldRules',$('#worldRules').value);Toast.show('已保存')}}
function renderOutline(p){p.innerHTML=`<h3>📋 三层大纲</h3><div class="field"><label>总纲</label><textarea id="outlineMaster"></textarea></div><div class="field"><label>卷纲</label><textarea id="outlineVolume"></textarea></div><div class="field"><label>章纲</label><textarea id="outlineChapter"></textarea></div><button class="btn" id="saveOutline">💾 保存</button>`;$('#outlineMaster').value=LS.get('outlineMaster','');$('#outlineVolume').value=LS.get('outlineVolume','');$('#outlineChapter').value=LS.get('outlineChapter','');$('#saveOutline').onclick=()=>{LS.set('outlineMaster',$('#outlineMaster').value);LS.set('outlineVolume',$('#outlineVolume').value);LS.set('outlineChapter',$('#outlineChapter').value);Toast.show('已保存')}}
function renderChapters(p){p.innerHTML=`<h3>📚 分卷与章节</h3><div style="display:flex;gap:10px;margin-bottom:10px"><button class="btn btn-sm" id="addVolume">+ 新建分卷</button><button class="btn btn-sm" id="exportTxt">📤 导出全书TXT</button></div><div id="volumeList"></div>`;const refresh=()=>{let vols=LS.get('volumes',[]),chs=LS.get('chapters',[]),html='';vols.forEach(vol=>{html+=`<div class="card"><div class="card-header"><span>📁 ${vol.name}</span><div><button class="btn btn-sm rename-vol" data-id="${vol.id}">重命名</button><button class="btn btn-sm del-vol btn-danger" data-id="${vol.id}">删除</button></div></div>`;let vchs=chs.filter(c=>c.volumeId===vol.id);vchs.forEach((ch,idx)=>{html+=`<div class="list-item"><span>${ch.title} <span class="tag">${countWords(ch.content||'')}字</span></span><div><button class="btn btn-sm move-up" data-id="${ch.id}" ${idx===0?'disabled':''}>↑</button><button class="btn btn-sm move-down" data-id="${ch.id}" ${idx===vchs.length-1?'disabled':''}>↓</button><button class="btn btn-sm rename-ch" data-id="${ch.id}">重命名</button><button class="btn btn-sm del-ch btn-danger" data-id="${ch.id}">删除</button></div></div>`});html+=`<button class="btn btn-sm add-ch" data-vol="${vol.id}" style="margin-left:20px">+ 添加章节</button></div>`});$('#volumeList').innerHTML=html||'暂无分卷，请新建';$$('.rename-vol').forEach(b=>b.onclick=()=>{let v=LS.get('volumes',[]).find(x=>x.id===b.dataset.id);let n=prompt('新名称',v?.name);if(n){v.name=n;LS.set('volumes',LS.get('volumes',[]));refresh()}});$$('.del-vol').forEach(b=>b.onclick=()=>{if(!confirm('删除分卷连带章节？'))return;let v=LS.get('volumes',[]).filter(x=>x.id!==b.dataset.id);LS.set('volumes',v);LS.set('chapters',LS.get('chapters',[]).filter(c=>c.volumeId!==b.dataset.id));refresh()});$$('.add-ch').forEach(b=>b.onclick=()=>{let t=prompt('章节标题');if(!t)return;let chs=LS.get('chapters',[]);chs.push({id:Date.now().toString(),title:t,volumeId:b.dataset.vol,content:''});LS.set('chapters',chs);refresh()});$$('.move-up').forEach(b=>b.onclick=()=>{let chs=LS.get('chapters',[]),ch=chs.find(x=>x.id===b.dataset.id);if(!ch)return;let sib=chs.filter(x=>x.volumeId===ch.volumeId),idx=sib.findIndex(x=>x.id===ch.id);if(idx>0)[sib[idx],sib[idx-1]]=[sib[idx-1],sib[idx]];LS.set('chapters',[...chs.filter(x=>x.volumeId!==ch.volumeId),...sib]);refresh()});$$('.move-down').forEach(b=>b.onclick=()=>{let chs=LS.get('chapters',[]),ch=chs.find(x=>x.id===b.dataset.id);if(!ch)return;let sib=chs.filter(x=>x.volumeId===ch.volumeId),idx=sib.findIndex(x=>x.id===ch.id);if(idx<sib.length-1)[sib[idx],sib[idx+1]]=[sib[idx+1],sib[idx]];LS.set('chapters',[...chs.filter(x=>x.volumeId!==ch.volumeId),...sib]);refresh()});$$('.rename-ch').forEach(b=>b.onclick=()=>{let chs=LS.get('chapters',[]),ch=chs.find(x=>x.id===b.dataset.id);let t=prompt('新标题',ch.title);if(t){ch.title=t;LS.set('chapters',chs);refresh()}});$$('.del-ch').forEach(b=>b.onclick=()=>{if(!confirm('删除章节？'))return;LS.set('chapters',LS.get('chapters',[]).filter(x=>x.id!==b.dataset.id));refresh()})};refresh();$('#addVolume').onclick=()=>{let n=prompt('分卷名称');if(!n)return;let v=LS.get('volumes',[]);v.push({id:Date.now().toString(),name:n});LS.set('volumes',v);refresh()};$('#exportTxt').onclick=()=>{let vols=LS.get('volumes',[]),chs=LS.get('chapters',[]),txt='';vols.forEach(vol=>{txt+=`\n=== ${vol.name} ===\n`;chs.filter(c=>c.volumeId===vol.id).forEach(c=>txt+=`## ${c.title}\n\n${c.content}\n\n`});let blob=new Blob(['\uFEFF'+txt],{type:'text/plain;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='小说全文.txt';a.click();Toast.show('导出成功')}}
function renderMemory(p){p.innerHTML=`<h3>🧠 记忆库</h3><textarea id="fullTextInput" rows="6" placeholder="粘贴整本小说正文..."></textarea><div style="display:flex;gap:10px"><button class="btn" id="parseBtn">🚀 解析分片</button><button class="btn btn-danger" id="clearMemoryBtn">🗑️ 清空记忆</button></div><div id="memStatus" class="memory-box">暂无记忆</div>`;const update=()=>$('#memStatus').textContent=LS.get('memorySlices',[]).length?`已存储 ${LS.get('memorySlices',[]).length} 个片段`:'暂无记忆';update();$('#parseBtn').onclick=()=>{let t=$('#fullTextInput').value.trim();if(!t)return Toast.show('请粘贴正文');let s=[];for(let i=0;i<t.length&&s.length<20;i+=15000)s.push(t.slice(i,i+15000));LS.set('memorySlices',s);update();Toast.show(`分片完成共${s.length}段`)};$('#clearMemoryBtn').onclick=()=>{if(confirm('清空记忆？')){LS.set('memorySlices',[]);$('#fullTextInput').value='';update();Toast.show('已清空')}}};
function renderWrite(p){p.innerHTML=`<h3>✍️ 写作｜iPhone手机专用免代理朱雀</h3><div class="grid-2"><div class="field"><label>API地址</label><input id="apiUrlInput"></div><div class="field"><label>模型名称</label><input id="modelNameInput"></div></div><div class="field"><label>AI密钥</label><input type="password" id="apiKeyInput"></div><div class="field"><label>当前章纲</label><textarea id="writeOutline"></textarea></div><div class="grid-2"><div class="field"><label>目标字数</label><input id="wordTarget" type="number" value="2000"></div><div class="field"><label>结尾钩子</label><input id="hookInput"></div></div><div class="field"><label>目标章节</label><select id="targetChapterSelect"><option value="">请选择章节</option></select></div><div class="field"><label>关联记忆</label><div class="memory-box" id="recallResult">暂无</div></div><div class="field"><label>检测日志</label><div class="memory-box" id="checkReport">等待执行</div></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="genBtn">✨ 普通生成</button><button class="btn" id="deepCheckBtn" style="background:#b85e1e;">🔄 AI全自动过检</button></div><textarea id="resultArea" rows="10" placeholder="正文输出在这里"></textarea><div style="margin-top:10px"><button class="btn btn-sm" id="adoptBtn">✅ 采纳到章节</button></div>`;$('#apiUrlInput').value=LS.get('apiUrl',CONFIG.API_DEFAULT_URL);$('#modelNameInput').value=LS.get('modelName',CONFIG.API_DEFAULT_MODEL);$('#apiKeyInput').value=LS.get('apiKey','');['apiUrlInput','modelNameInput','apiKeyInput'].forEach(id=>$('#'+id).oninput=e=>LS.set(id.replace('Input',''),e.target.value));const fillChapterSelect=()=>{let chs=LS.get('chapters',[]),vols=LS.get('volumes',[]),opt=chs.map(ch=>{let v=vols.find(x=>x.id===ch.volumeId);return `<option value="${ch.id}">${v?.name||'无分卷'} - ${ch.title}</option>`}).join('');$('#targetChapterSelect').innerHTML=`<option value="">请选择章节</option>`+opt};fillChapterSelect();let generating=false;const gi=()=>({url:$('#apiUrlInput').value.trim()||CONFIG.API_DEFAULT_URL,key:$('#apiKeyInput').value.trim(),model:$('#modelNameInput').value.trim()||CONFIG.API_DEFAULT_MODEL});const buildSys=wt=>{let slices=LS.get('memorySlices',[]),outl=$('#writeOutline').value.trim();let kw=outl.split(/[，。\s]+/).filter(k=>k.length>=2);let rel=[];slices.forEach(s=>{let sc=0;kw.forEach(k=>{if(s.includes(k))sc++});if(sc>0)rel.push({text:s,score:sc})});rel.sort((a,b)=>b.score-a.score);rel=rel.slice(0,4).map(r=>r.text);$('#recallResult').textContent=rel.join('\n\n')||'无关联记忆';let wR=LS.get('worldRealm',''),chs=LS.get('characters',[]);let cd=chs.map(c=>`${c.name}:${c.personality},${c.realm}`).join('；');let hk=$('#hookInput').value?`；${$('#hookInput').value}`:'';return `网文作家。世界观：${wR} 角色：${cd} 前文：${rel.join(' ')} 续写${wt}字左右正文，直接输出。${hk}`};async function rewriteHumanStyle(text){let {url,key,model}=gi();let sys=`把AI文案改成真人手写网文风格：拆长句、加细节、不用套路词、语气自然，不改剧情。`;return await callAi(url,key,model,sys,text,8000)}
async function autoRewriteUntilPass(init){let text=init;let log=`初稿字数：${countWords(text)}\n`;for(let r=1;r<=CONFIG.ZHUQUE_MAX_ROUNDS;r++){let score;try{let res=await detectZhuque(text);score=res.score;log+=`第${r}轮 AI概率：${score}/100\n`}catch(e){log+=`检测失败：${e.message}\n`;continue}if(score<=CONFIG.ZHUQUE_PASS_SCORE){log+=`✅ 达标通过`;$('#checkReport').textContent=log;return text}if(r<CONFIG.ZHUQUE_MAX_ROUNDS){log+=`正在真人化改写...\n`;text=await rewriteHumanStyle(text);log+=`改写后字数：${countWords(text)}\n`}else log+=`已达最大轮次，直接输出`}$('#checkReport').textContent=log;return text}
const startNormal=async()=>{if(generating)return;let outl=$('#writeOutline').value.trim();if(!outl)return Toast.show('请输入章纲');generating=true;$('#genBtn').disabled=true;$('#deepCheckBtn').disabled=true;try{let {url,key,model}=gi();if(!key)throw new Error('未填AI密钥');let wt=parseInt($('#wordTarget').value)||2000;let cont=await callAi(url,key,model,buildSys(wt),outl,Math.min(Math.ceil(wt*2.2),8000));$('#resultArea').value=cont;Toast.show('生成完成')}catch(e){Toast.show('失败：'+e.message)}finally{generating=false;$('#genBtn').disabled=false;$('#deepCheckBtn').disabled=false}};
const startDeep=async()=>{if(generating)return;let outl=$('#writeOutline').value.trim();if(!outl)return Toast.show('请输入章纲');generating=true;$('#deepCheckBtn').disabled=true;$('#genBtn').disabled=true;$('#checkReport').textContent='正在生成初稿...';try{let {url,key,model}=gi();if(!key)throw new Error('未填AI密钥');let wt=parseInt($('#wordTarget').value)||2000;let draft=await callAi(url,key,model,buildSys(wt),outl,Math.min(Math.ceil(wt*2.2),8000));let final=await autoRewriteUntilPass(draft);$('#resultArea').value=final;Toast.show('✅ 过检完成')}catch(e){Toast.show('失败：'+e.message)}finally{generating=false;$('#deepCheckBtn').disabled=false;$('#genBtn').disabled=false}};
$('#genBtn').onclick=startNormal;$('#deepCheckBtn').onclick=startDeep;$('#adoptBtn').onclick=()=>{let cont=$('#resultArea').value.trim();if(!cont)return Toast.show('先生成内容');let tid=$('#targetChapterSelect').value;if(!tid)return Toast.show('选择目标章节');let chs=LS.get('chapters',[]),ch=chs.find(x=>x.id===tid);if(!ch)return Toast.show('章节不存在');ch.content+='\n'+cont;LS.set('chapters',chs);Toast.show(`已存入${ch.title}`);fillChapterSelect()}}
function renderCheck(p){p.innerHTML=`<h3>🔍 逻辑校验</h3><button class="btn" id="runCheck">执行检查</button><div id="checkResult" class="memory-box"></div>`;$('#runCheck').onclick=()=>$('#checkResult').textContent='✅ 基础设定检查通过'}
function renderStyle(p){p.innerHTML=`<h3>🎨 风格定制</h3><div class="field"><label>预设风格</label><select id="stylePreset"><option value="chendong">辰东</option><option value="tudou">土豆</option><option value="coldwhite">冷笔白描</option></select></div><div class="field"><label>自定义风格</label><textarea id="styleTone"></textarea></div><button class="btn" id="saveStyle">保存</button>`;$('#stylePreset').value=LS.get('stylePreset','coldwhite');$('#styleTone').value=LS.get('styleTone','');$('#saveStyle').onclick=()=>{LS.set('stylePreset',$('#stylePreset').value);LS.set('styleTone',$('#styleTone').value);Toast.show('已保存')}}
function renderBackup(p){p.innerHTML=`<h3>💾 备份导入</h3><button class="btn" id="exportBackup">📤 导出全部数据</button><button class="btn" id="importBackup">📥 导入备份</button><input type="file" id="importFile" style="display:none" accept=".json">`;$('#exportBackup').onclick=()=>{let bk={};for(let i=0;i<localStorage.length;i++)bk[localStorage.key(i)]=LS.get(localStorage.key(i));let blob=new Blob([JSON.stringify(bk,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='写作中枢备份.json';a.click();Toast.show('导出成功')};$('#importBackup').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{try{let d=JSON.parse(ev.target.result);localStorage.clear();Object.entries(d).forEach(([k,v])=>LS.set(k,v));Toast.show('恢复成功，刷新页面');}catch{Toast.show('备份格式错误')}};r.readAsText(f)}}
initNav();switchTab('dashboard');Toast.show('iPhone专用版就绪，直接可用AI过检')
</script>
</body>
</html>
