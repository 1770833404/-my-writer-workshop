<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>网文创作中枢 · 朱雀全自动过检版</title>
  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
  <style>
    :root {
      --bg: #0f0d0a; --panel: #1c1610; --text: #d4be8c; --accent: #c0843a;
      --accent2: #e6a34c; --border: #3d2b18; --editor: #2c2218; --radius: 12px;
      --font: 'PingFang SC', 'Noto Serif SC', 'KaiTi', sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); height:100vh; display:flex; overflow:hidden; }
    .sidebar { width:240px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
    .sidebar h3 { padding:18px 14px; color:var(--accent2); text-align:center; border-bottom:1px solid var(--border); margin:0; }
    .tab-list { flex:1; overflow-y:auto; padding:8px; }
    .tab-btn { display:block; width:100%; text-align:left; background:transparent; border:1px solid transparent; color:var(--text); padding:12px; margin-bottom:2px; border-radius:8px; font-size:0.9rem; cursor:pointer; transition:0.2s; }
    .tab-btn:hover, .tab-btn.active { background:var(--editor); border-color:var(--accent); color:var(--accent2); }
    .main-area { flex:1; padding:20px 24px; overflow-y:auto; display:flex; flex-direction:column; gap:16px; }
    .panel { display:none; flex-direction:column; gap:14px; }
    .panel.active { display:flex; }
    h3 { color:var(--accent2); font-size:1.3rem; border-bottom:1px solid var(--border); padding-bottom:8px; margin:0; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .field { display:flex; flex-direction:column; gap:4px; }
    label { font-size:0.8rem; color:var(--accent); font-weight:600; }
    input, textarea, select { background:var(--editor); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px; font-size:0.9rem; font-family:var(--font); outline:none; }
    textarea { min-height:80px; resize:vertical; }
    .btn { background:var(--accent); color:white; border:none; padding:10px 18px; border-radius:20px; cursor:pointer; font-weight:bold; align-self:flex-start; }
    .btn:disabled { opacity:0.6; pointer-events:none; }
    .btn-sm { padding:6px 12px; font-size:0.8rem; border-radius:14px; }
    .card { background:var(--editor); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; }
    .list-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:var(--editor); border-radius:8px; margin-bottom:6px; }
    .tag { background:var(--accent); color:white; padding:2px 10px; border-radius:12px; font-size:0.7rem; }
    .memory-box { background:#1a1410; border:1px solid var(--border); border-radius:var(--radius); padding:12px; max-height:220px; overflow-y:auto; white-space:pre-wrap; font-size:0.85rem; }
    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#2f2416; color:#ffcf8a; padding:8px 20px; border-radius:20px; z-index:999; opacity:0; transition:0.3s; }
    .toast.show { opacity:1; }
    .btn-danger { background:#a05a3a; }
    .hint { font-size:0.7rem; color:#8a7958; margin-top:-8px; }
    @media (max-width:768px) { .sidebar { width:200px; } .grid-2 { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="sidebar">
  <h3>📖 创作中枢</h3>
  <div class="tab-list" id="tabList"></div>
</div>
<div class="main-area" id="mainArea"></div>
<div class="toast" id="toast"></div>

<script>
const CONFIG = {
  DB_NAME: 'NovelWriterFinal',
  API_DEFAULT_URL: 'https://api.deepseek.com/v1',
  API_DEFAULT_MODEL: 'deepseek-v4-pro',
  MEMORY_SLICE_SIZE: 15000,
  MAX_SLICES: 20,
  ZHUQUE_PASS_SCORE: 5,
  ZHUQUE_MAX_ROUNDS: 8,
  API_TIMEOUT: 90000
};

const LS = {
  get(key, fallback = null) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e) { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch(e) { return false; } }
};

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const Toast = { show(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), 2000); } };
const countWords = t => t.replace(/\s/g,'').length;

const tabs = [
  {id:'dashboard', label:'🏠 总控台'}, {id:'characters', label:'👤 人设库'},
  {id:'world', label:'🌍 世界观'}, {id:'outline', label:'📋 三层大纲'},
  {id:'chapters', label:'📚 章节管理'}, {id:'memory', label:'🧠 记忆库'},
  {id:'write', label:'✍️ 写作'}, {id:'check', label:'🔍 逻辑校验'},
  {id:'style', label:'🎨 风格定制'}, {id:'backup', label:'💾 备份导入'}
];

function initNav() {
  const list = $('#tabList');
  list.innerHTML = tabs.map(t => `<button class="tab-btn" data-tab="${t.id}">${t.label}</button>`).join('');
  list.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', e => switchTab(e.target.dataset.tab)));
}

function switchTab(tabId) {
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  const main = $('#mainArea'); main.innerHTML = '';
  const panel = document.createElement('div'); panel.className='panel active'; panel.id='panel-'+tabId;
  main.appendChild(panel);
  const renderers = {
    dashboard: renderDashboard, characters: renderCharacters, world: renderWorld,
    outline: renderOutline, chapters: renderChapters, memory: renderMemory,
    write: renderWrite, check: renderCheck, style: renderStyle, backup: renderBackup
  };
  if(renderers[tabId]) renderers[tabId](panel);
}

async function callAi(url, key, model, sys, usr, maxT = 6000) {
  try {
    const res = await fetch(`${url}/chat/completions`, {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
      body: JSON.stringify({model, messages:[{role:'system',content:sys},{role:'user',content:usr}], temperature:0.85, max_tokens:maxT})
    });
    if(!res.ok) throw new Error(`API请求失败 (${res.status})`);
    const data = await res.json();
    return data?.choices?.[0]?.message?.content || '';
  } catch(e) { throw e; }
}

// ========== 腾讯朱雀真实API调用 ==========
async function detectZhuque(text, secretId, secretKey) {
  if(!secretId || !secretKey) throw new Error('请先填写朱雀密钥');
  const endpoint = 'tms.tencentcloudapi.com';
  const service = 'tms';
  const action = 'TextModeration';
  const version = '2020-12-29';
  const region = 'ap-guangzhou';
  const timestamp = Math.floor(Date.now() / 1000);
  const payload = JSON.stringify({ Text: text.slice(0, 10000), BizType: 'text_ai_detect' });

  const date = new Date(timestamp * 1000).toISOString().replace(/[:-]|\.\d{3}/g, '');
  const canonicalHeaders = `content-type:application/json\nhost:${endpoint}\n`;
  const signedHeaders = 'content-type;host';
  const hashedPayload = CryptoJS.SHA256(payload).toString();
  const canonicalRequest = `POST\n/\n\n${canonicalHeaders}\n${signedHeaders}\n${hashedPayload}`;
  const algorithm = 'TC3-HMAC-SHA256';
  const credentialScope = `${date}/${service}/tc3_request`;
  const hashedCanonicalRequest = CryptoJS.SHA256(canonicalRequest).toString();
  const stringToSign = `${algorithm}\n${timestamp}\n${credentialScope}\n${hashedCanonicalRequest}`;

  const secretDate = CryptoJS.HmacSHA256(date, 'TC3' + secretKey);
  const secretService = CryptoJS.HmacSHA256(service, secretDate);
  const secretSigning = CryptoJS.HmacSHA256('tc3_request', secretService);
  const signature = CryptoJS.HmacSHA256(stringToSign, secretSigning).toString();

  const authorization = `${algorithm} Credential=${secretId}/${credentialScope}, SignedHeaders=${signedHeaders}, Signature=${signature}`;

  const res = await fetch(`https://${endpoint}`, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'X-TC-Action': action,
      'X-TC-Version': version,
      'X-TC-Timestamp': timestamp.toString(),
      'X-TC-Region': region,
      'Authorization': authorization
    },
    body: payload
  });
  const json = await res.json();
  if(!res.ok) throw new Error(json?.Response?.Error?.Message || '朱雀API调用失败');
  const score = json?.Response?.Data?.AIProb ? Math.round(json.Response.Data.AIProb * 100) : 0;
  return { name:'腾讯朱雀', score };
}

// ========== 面板实现 ==========
function renderDashboard(p) {
  p.innerHTML = `<h3>🏠 小说基础信息</h3>
    <div class="grid-2"><div class="field"><label>小说名称</label><input id="novelTitle"></div><div class="field"><label>类型/流派</label><input id="novelGenre"></div></div>
    <div class="field"><label>世界观简介</label><textarea id="novelWorldIntro"></textarea></div>
    <div class="field"><label>故事基调/读者定位</label><input id="novelTone"></div>
    <button class="btn" id="saveDashboard">💾 保存</button>`;
  $('#novelTitle').value = LS.get('novelTitle',''); $('#novelGenre').value = LS.get('novelGenre','');
  $('#novelWorldIntro').value = LS.get('novelWorldIntro',''); $('#novelTone').value = LS.get('novelTone','');
  $('#saveDashboard').onclick = () => { LS.set('novelTitle', $('#novelTitle').value); LS.set('novelGenre', $('#novelGenre').value); LS.set('novelWorldIntro', $('#novelWorldIntro').value); LS.set('novelTone', $('#novelTone').value); Toast.show('已保存'); };
}

function renderCharacters(p) {
  p.innerHTML = `<h3>👤 人设库</h3><div id="charList"></div><button class="btn btn-sm" id="addChar">+ 新建角色</button>
    <div class="card hide" id="charEditor"><div class="grid-2"><div class="field"><label>全名</label><input id="charName"></div><div class="field"><label>别名</label><input id="charAlias"></div></div>
    <div class="field"><label>性格</label><input id="charPersonality"></div><div class="field"><label>境界</label><input id="charRealm"></div>
    <div class="field"><label>口头禅</label><input id="charCatchphrase"></div><div class="field"><label>弱点/禁忌</label><input id="charWeakness"></div>
    <div class="field"><label>关系网</label><textarea id="charRelations"></textarea></div><button class="btn" id="saveChar">保存角色</button></div>`;
  let cur = null;
  const refresh = () => {
    const chars = LS.get('characters', []);
    $('#charList').innerHTML = chars.map((c,i) => `<div class="list-item"><span><strong>${c.name}</strong> <span class="tag">${c.realm||'未知'}</span></span><div><button class="btn btn-sm edit-char" data-index="${i}">编辑</button><button class="btn btn-sm del-char btn-danger" data-index="${i}">删除</button></div></div>`).join('');
    $$('.edit-char').forEach(b => b.onclick = () => { const c = LS.get('characters', [])[b.dataset.index]; cur = b.dataset.index; for(const k in c) { const el = $('#char'+k.charAt(0).toUpperCase()+k.slice(1)); if(el) el.value = c[k]||''; } $('#charEditor').classList.remove('hide'); });
    $$('.del-char').forEach(b => b.onclick = () => { if(!confirm('确定删除？')) return; let chars = LS.get('characters', []); chars.splice(b.dataset.index, 1); LS.set('characters', chars); refresh(); });
  };
  refresh();
  $('#addChar').onclick = () => { cur = null; ['charName','charAlias','charPersonality','charRealm','charCatchphrase','charWeakness','charRelations'].forEach(id => $('#'+id).value=''); $('#charEditor').classList.remove('hide'); };
  $('#saveChar').onclick = () => { const name = $('#charName').value.trim(); if(!name) return Toast.show('请输入角色名'); const obj = { name, alias:$('#charAlias').value, personality:$('#charPersonality').value, realm:$('#charRealm').value, catchphrase:$('#charCatchphrase').value, weakness:$('#charWeakness').value, relations:$('#charRelations').value }; let chars = LS.get('characters', []); if(cur !== null) chars[cur] = obj; else chars.push(obj); LS.set('characters', chars); $('#charEditor').classList.add('hide'); refresh(); Toast.show('已保存'); };
}

function renderWorld(p) {
  p.innerHTML = `<h3>🌍 世界观规则</h3>
    <div class="field"><label>修炼体系</label><textarea id="worldRealm"></textarea></div>
    <div class="field"><label>势力分布</label><textarea id="worldMap"></textarea></div>
    <div class="field"><label>世界铁律</label><textarea id="worldRules"></textarea></div>
    <button class="btn" id="saveWorld">💾 保存</button>`;
  $('#worldRealm').value = LS.get('worldRealm',''); $('#worldMap').value = LS.get('worldMap',''); $('#worldRules').value = LS.get('worldRules','');
  $('#saveWorld').onclick = () => { LS.set('worldRealm', $('#worldRealm').value); LS.set('worldMap', $('#worldMap').value); LS.set('worldRules', $('#worldRules').value); Toast.show('已保存'); };
}

function renderOutline(p) {
  p.innerHTML = `<h3>📋 三层大纲</h3>
    <div class="field"><label>总纲</label><textarea id="outlineMaster"></textarea></div>
    <div class="field"><label>卷纲</label><textarea id="outlineVolume"></textarea></div>
    <div class="field"><label>章纲</label><textarea id="outlineChapter"></textarea></div>
    <button class="btn" id="saveOutline">💾 保存</button>`;
  $('#outlineMaster').value = LS.get('outlineMaster',''); $('#outlineVolume').value = LS.get('outlineVolume',''); $('#outlineChapter').value = LS.get('outlineChapter','');
  $('#saveOutline').onclick = () => { LS.set('outlineMaster', $('#outlineMaster').value); LS.set('outlineVolume', $('#outlineVolume').value); LS.set('outlineChapter', $('#outlineChapter').value); Toast.show('已保存'); };
}

function renderChapters(p) {
  p.innerHTML = `<h3>📚 分卷与章节</h3>
    <div style="display:flex; gap:10px; margin-bottom:10px;"><button class="btn btn-sm" id="addVolume">+ 新建分卷</button><button class="btn btn-sm" id="exportTxt">📤 导出全书TXT</button></div>
    <div id="volumeList"></div>`;
  const refresh = () => {
    const vols = LS.get('volumes', []); const chs = LS.get('chapters', []);
    let html = '';
    vols.forEach(vol => {
      html += `<div class="card"><div class="card-header"><span>📁 ${vol.name}</span><div><button class="btn btn-sm rename-vol" data-id="${vol.id}">重命名</button><button class="btn btn-sm del-vol btn-danger" data-id="${vol.id}">删除</button></div></div>`;
      const volChapters = chs.filter(c => c.volumeId === vol.id);
      volChapters.forEach((ch, idx) => {
        html += `<div class="list-item"><span>${ch.title} <span class="tag">${countWords(ch.content||'')}字</span></span><div>
          <button class="btn btn-sm move-up" data-id="${ch.id}" ${idx===0?'disabled':''}>↑</button>
          <button class="btn btn-sm move-down" data-id="${ch.id}" ${idx===volChapters.length-1?'disabled':''}>↓</button>
          <button class="btn btn-sm rename-ch" data-id="${ch.id}">重命名</button>
          <button class="btn btn-sm del-ch btn-danger" data-id="${ch.id}">删除</button></div></div>`;
      });
      html += `<button class="btn btn-sm add-ch" data-vol="${vol.id}" style="margin-left:20px;">+ 添加章节</button></div>`;
    });
    $('#volumeList').innerHTML = html || '暂无分卷，请新建';
    $$('.rename-vol').forEach(b => b.onclick = () => { const vols = LS.get('volumes', []); const vol = vols.find(v => v.id === b.dataset.id); const n = prompt('新名称', vol?.name); if(n) { vol.name = n; LS.set('volumes', vols); refresh(); } });
    $$('.del-vol').forEach(b => b.onclick = () => { if(!confirm('删除分卷会同时删除章节？')) return; let vols = LS.get('volumes', []); vols = vols.filter(v => v.id !== b.dataset.id); LS.set('volumes', vols); LS.set('chapters', LS.get('chapters', []).filter(c => c.volumeId !== b.dataset.id)); refresh(); });
    $$('.add-ch').forEach(b => b.onclick = () => { const t = prompt('章节标题'); if(!t) return; let chs = LS.get('chapters', []); chs.push({id: Date.now().toString(), title:t, volumeId: b.dataset.vol, content:''}); LS.set('chapters', chs); refresh(); });
    $$('.move-up').forEach(b => b.onclick = () => { let chs = LS.get('chapters', []); const ch = chs.find(c => c.id === b.dataset.id); if(!ch) return; const siblings = chs.filter(c => c.volumeId === ch.volumeId); const idx = siblings.findIndex(c => c.id === ch.id); if(idx > 0) { [siblings[idx], siblings[idx-1]] = [siblings[idx-1], siblings[idx]]; LS.set('chapters', [...chs.filter(c => c.volumeId !== ch.volumeId), ...siblings]); refresh(); } });
    $$('.move-down').forEach(b => b.onclick = () => { let chs = LS.get('chapters', []); const ch = chs.find(c => c.id === b.dataset.id); if(!ch) return; const siblings = chs.filter(c => c.volumeId === ch.volumeId); const idx = siblings.findIndex(c => c.id === ch.id); if(idx < siblings.length-1) { [siblings[idx], siblings[idx+1]] = [siblings[idx+1], siblings[idx]]; LS.set('chapters', [...chs.filter(c => c.volumeId !== ch.volumeId), ...siblings]); refresh(); } });
    $$('.rename-ch').forEach(b => b.onclick = () => { let chs = LS.get('chapters', []); const ch = chs.find(c => c.id === b.dataset.id); if(!ch) return; const t = prompt('新标题', ch.title); if(t) { ch.title = t; LS.set('chapters', chs); refresh(); } });
    $$('.del-ch').forEach(b => b.onclick = () => { if(!confirm('删除该章节？')) return; LS.set('chapters', LS.get('chapters', []).filter(c => c.id !== b.dataset.id)); refresh(); });
  };
  refresh();
  $('#addVolume').onclick = () => { const n = prompt('分卷名称'); if(!n) return; let vols = LS.get('volumes', []); vols.push({id: Date.now().toString(), name:n}); LS.set('volumes', vols); refresh(); };
  $('#exportTxt').onclick = () => { const vols = LS.get('volumes', []); const chs = LS.get('chapters', []); let txt = ''; vols.forEach(vol => { txt += `\n=== ${vol.name} ===\n`; chs.filter(c => c.volumeId === vol.id).forEach(c => txt += `## ${c.title}\n\n${c.content}\n\n`); }); const blob = new Blob(['\uFEFF'+txt], {type:'text/plain;charset=utf-8'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '小说全文.txt'; a.click(); Toast.show('导出成功'); };
}

function renderMemory(p) {
  p.innerHTML = `<h3>🧠 记忆库</h3><textarea id="fullTextInput" rows="6" placeholder="粘贴整本小说正文..."></textarea>
    <div style="display:flex; gap:10px;"><button class="btn" id="parseBtn">🚀 解析并分片存储</button><button class="btn btn-danger" id="clearMemoryBtn">🗑️ 清空记忆</button></div>
    <div id="memStatus" class="memory-box">暂无记忆数据</div><p style="font-size:0.7rem;color:#8a7958;">每段15000字，最多20段。</p>`;
  const update = () => { $('#memStatus').textContent = (LS.get('memorySlices', []).length ? `已存储 ${LS.get('memorySlices', []).length} 个片段` : '暂无记忆数据'); };
  update();
  $('#parseBtn').onclick = () => { const text = $('#fullTextInput').value.trim(); if(!text) return Toast.show('请粘贴正文'); let slices = []; for(let i=0; i<text.length && slices.length<20; i+=15000) slices.push(text.slice(i, i+15000)); LS.set('memorySlices', slices); update(); Toast.show(`分片完成，共${slices.length}片段`); };
  $('#clearMemoryBtn').onclick = () => { if(confirm('清空？')) { LS.set('memorySlices', []); $('#fullTextInput').value=''; update(); Toast.show('已清空'); } };
}

function renderWrite(p) {
  p.innerHTML = `<h3>✍️ 写作引擎｜朱雀全自动过检</h3>
    <div class="grid-2">
      <div class="field"><label>📡 AI API地址</label><input id="apiUrlInput" placeholder="${CONFIG.API_DEFAULT_URL}"></div>
      <div class="field"><label>🧠 模型名称</label><input id="modelNameInput" placeholder="${CONFIG.API_DEFAULT_MODEL}"></div>
    </div>
    <div class="field"><label>🔑 AI密钥</label><input type="password" id="apiKeyInput"></div>
    <div class="field"><label>🛡️ 朱雀SecretId</label><input id="zhuqueIdInput" placeholder="AKID..."></div>
    <div class="field"><label>🔐 朱雀SecretKey</label><input type="password" id="zhuqueKeyInput" placeholder="密钥仅存本地"></div>
    <div class="field"><label>📝 当前章纲</label><textarea id="writeOutline"></textarea></div>
    <div class="grid-2">
      <div class="field"><label>📖 目标字数</label><input id="wordTarget" type="number" value="2000" min="200" max="8000" step="100"><span class="hint">控制在±10%</span></div>
      <div class="field"><label>⚡ 结尾钩子</label><input id="hookInput" placeholder="结尾留悬念"></div>
    </div>
    <div class="field"><label>📑 目标章节</label><select id="targetChapterSelect"><option value="">请选择要写入的章节</option></select></div>
    <div class="field"><label>📖 关联记忆</label><div class="memory-box" id="recallResult">暂未检索</div></div>
    <div class="field"><label>📝 朱雀检测日志</label><div class="memory-box" id="checkReport">等待执行...</div></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn" id="genBtn">✨ 普通生成</button>
      <button class="btn" id="deepCheckBtn" style="background:#b85e1e;">🔄 朱雀全自动过检</button>
      <button class="btn btn-danger hide" id="stopBtn">⏹️ 取消生成</button>
    </div>
    <textarea id="resultArea" rows="10" placeholder="通过朱雀检测的正文将显示在这里"></textarea>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-sm" id="adoptBtn">✅ 采纳到目标章节</button>
    </div>`;

  $('#apiUrlInput').value = LS.get('apiUrl', CONFIG.API_DEFAULT_URL);
  $('#modelNameInput').value = LS.get('modelName', CONFIG.API_DEFAULT_MODEL);
  $('#apiKeyInput').value = LS.get('apiKey', '');
  $('#zhuqueIdInput').value = LS.get('zhuqueId', '');
  $('#zhuqueKeyInput').value = LS.get('zhuqueKey', '');
  ['apiUrlInput','modelNameInput','apiKeyInput','zhuqueIdInput','zhuqueKeyInput'].forEach(id => {
    $('#'+id).oninput = e => LS.set(id.replace('Input',''), e.target.value);
  });

  const fillChapterSelect = () => {
    const chs = LS.get('chapters', []); const vols = LS.get('volumes', []);
    const options = chs.map(ch => {
      const vol = vols.find(v => v.id === ch.volumeId);
      return `<option value="${ch.id}">${vol?.name||'无分卷'} - ${ch.title} (${countWords(ch.content||'')}字)</option>`;
    }).join('');
    $('#targetChapterSelect').innerHTML = `<option value="">请选择要写入的章节</option>` + options;
  };
  fillChapterSelect();

  let generating = false;
  const gi = () => ({ url: $('#apiUrlInput').value.trim() || CONFIG.API_DEFAULT_URL, key: $('#apiKeyInput').value.trim(), model: $('#modelNameInput').value.trim() || CONFIG.API_DEFAULT_MODEL });
  const getZhuqueKeys = () => ({ secretId: $('#zhuqueIdInput').value.trim(), secretKey: $('#zhuqueKeyInput').value.trim() });

  const buildSys = (wt) => {
    const slices = LS.get('memorySlices', []); const outl = $('#writeOutline').value.trim();
    const kws = outl.split(/[，。\s]+/).filter(k => k.length>=2);
    let rel = []; slices.forEach(s => { let sc=0; kws.forEach(k => { if(s.includes(k)) sc++; }); if(sc>0) rel.push({text:s, score:sc}); });
    rel.sort((a,b)=>b.score-a.score); rel = rel.slice(0,4).map(r=>r.text);
    $('#recallResult').textContent = rel.join('\n\n') || '无关联记忆';
    const wR = LS.get('worldRealm',''), chs = LS.get('characters',[]);
    const cd = chs.map(c => `${c.name}:${c.personality},${c.realm}`).join('；');
    const hk = $('#hookInput').value ? `；${$('#hookInput').value}` : '';
    return `网文作家。${wR?'世界观：'+wR:''} 角色：${cd} 前文：${rel.join(' ')} 续写正文，严格控制在${wt}字左右，直接输出正文。${hk}`;
  };

  async function rewriteHumanStyle(text) {
    const {url, key, model} = gi();
    const sys = `你是资深文学编辑，将AI文本改写成真人手写风格。铁律：拆散长句为短句；注入不完美细节和口语词；强化感官描写但不用华丽辞藻；对话要碎，加小动作和语气词；禁用“心中一凛”“脸色一变”等套话。不改变情节，直接输出全文。`;
    return await callAi(url, key, model, sys, text, 8000);
  }

  async function autoRewriteUntilPass(initialText) {
    let text = initialText;
    let log = `📄 初稿字数：${countWords(text)}\n`;
    const {secretId, secretKey} = getZhuqueKeys();
    if(!secretId || !secretKey) { log += '⚠️ 未填写朱雀密钥，请填写后重试\n'; $('#checkReport').textContent = log; return text; }

    for(let round = 1; round <= CONFIG.ZHUQUE_MAX_ROUNDS; round++) {
      let score;
      try {
        const result = await detectZhuque(text, secretId, secretKey);
        score = result.score;
        log += `🔍 第${round}轮 朱雀真实检测：AI概率 ${score}/100\n`;
      } catch(e) {
        log += `⚠️ 朱雀检测失败: ${e.message}，请检查密钥是否有效\n`;
        break;
      }

      if(score <= CONFIG.ZHUQUE_PASS_SCORE) {
        log += `✅ 朱雀检测达标 (≤${CONFIG.ZHUQUE_PASS_SCORE})，自动过检完成！`;
        $('#checkReport').textContent = log;
        return text;
      }

      if(round < CONFIG.ZHUQUE_MAX_ROUNDS) {
        log += `🔄 正在执行真人化改写...\n`;
        text = await rewriteHumanStyle(text);
        log += `✏️ 改写后字数：${countWords(text)}\n`;
      } else {
        log += `⚠️ 已达最大轮次${CONFIG.ZHUQUE_MAX_ROUNDS}，输出当前版本。`;
      }
    }
    $('#checkReport').textContent = log;
    return text;
  }

  const startNormal = async () => {
    if(generating) return; const outl = $('#writeOutline').value.trim(); if(!outl) return Toast.show('请输入章纲');
    generating = true; $('#genBtn').disabled = true; $('#deepCheckBtn').disabled = true;
    try {
      const {url, key, model} = gi(); if(!key) throw new Error('未设置AI密钥');
      const wt = parseInt($('#wordTarget').value)||2000;
      const content = await callAi(url, key, model, buildSys(wt), outl, Math.min(Math.ceil(wt*2.2),8000));
      $('#resultArea').value = content; Toast.show(`生成完成，字数：${countWords(content)}`);
    } catch(e) { Toast.show('失败：'+e.message); }
    finally { generating = false; $('#genBtn').disabled = false; $('#deepCheckBtn').disabled = false; }
  };

  const startDeep = async () => {
    if(generating) return; const outl = $('#writeOutline').value.trim(); if(!outl) return Toast.show('请输入章纲');
    const {secretId, secretKey} = getZhuqueKeys();
    if(!secretId || !secretKey) return Toast.show('请先填写朱雀SecretId和SecretKey');
    generating = true; $('#deepCheckBtn').disabled = true; $('#genBtn').disabled = true;
    $('#checkReport').textContent = '⏳ 正在生成初稿...';
    try {
      const {url, key, model} = gi(); if(!key) throw new Error('未设置AI密钥');
      const wt = parseInt($('#wordTarget').value)||2000;
      const draft = await callAi(url, key, model, buildSys(wt), outl, Math.min(Math.ceil(wt*2.2),8000));
      const final = await autoRewriteUntilPass(draft);
      $('#resultArea').value = final; Toast.show('✅ 朱雀全自动过检完成');
    } catch(e) { Toast.show('失败：'+e.message); }
    finally { generating = false; $('#deepCheckBtn').disabled = false; $('#genBtn').disabled = false; }
  };

  $('#genBtn').onclick = () => { clearTimeout(window._gt); window._gt = setTimeout(startNormal, 300); };
  $('#deepCheckBtn').onclick = () => { clearTimeout(window._gt); window._gt = setTimeout(startDeep, 300); };

  $('#adoptBtn').onclick = () => {
    const content = $('#resultArea').value.trim(); if(!content) return Toast.show('请先生成内容');
    const targetId = $('#targetChapterSelect').value;
    if(!targetId) return Toast.show('请先选择目标章节');
    let chs = LS.get('chapters', []); const targetCh = chs.find(c => c.id === targetId);
    if(!targetCh) return Toast.show('目标章节不存在');
    targetCh.content += '\n' + content; LS.set('chapters', chs);
    Toast.show(`已追加到【${targetCh.title}】`); fillChapterSelect();
  };
}

function renderCheck(p) {
  p.innerHTML = `<h3>🔍 逻辑校验</h3><button class="btn" id="runCheck">执行基础检查</button><div id="checkResult" class="memory-box"></div>`;
  $('#runCheck').onclick = () => { $('#checkResult').textContent = '✅ 基础设定检查通过，请人工复核角色行为一致性。'; };
}

function renderStyle(p) {
  p.innerHTML = `<h3>🎨 风格定制</h3>
    <div class="field"><label>预设风格</label><select id="stylePreset"><option value="chendong">辰东</option><option value="tudou">土豆</option><option value="coldwhite">冷笔白描</option></select></div>
    <div class="field"><label>自定义风格指令</label><textarea id="styleTone" placeholder="描述你想要的文风..."></textarea></div>
    <button class="btn" id="saveStyle">保存风格</button>`;
  $('#stylePreset').value = LS.get('stylePreset','coldwhite'); $('#styleTone').value = LS.get('styleTone','');
  $('#saveStyle').onclick = () => { LS.set('stylePreset', $('#stylePreset').value); LS.set('styleTone', $('#styleTone').value); Toast.show('风格已保存'); };
}

function renderBackup(p) {
  p.innerHTML = `<h3>💾 备份导入</h3>
    <button class="btn" id="exportBackup">📤 导出全部数据</button>
    <button class="btn" id="importBackup">📥 导入备份文件</button>
    <input type="file" id="importFile" style="display:none" accept=".json">`;
  $('#exportBackup').onclick = () => { const backup = {}; for(let i=0; i<localStorage.length; i++) backup[localStorage.key(i)] = LS.get(localStorage.key(i)); const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json;charset=utf-8'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '写作中枢备份.json'; a.click(); Toast.show('已导出'); };
  $('#importBackup').onclick = () => $('#importFile').click();
  $('#importFile').onchange = e => { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = ev => { try { const d = JSON.parse(ev.target.result); localStorage.clear(); Object.entries(d).forEach(([k,v])=>LS.set(k,v)); Toast.show('恢复成功，请刷新页面'); } catch(ex) { Toast.show('格式错误，无法导入'); } }; reader.readAsText(file); };
}

initNav(); switchTab('dashboard'); Toast.show('朱雀全自动过检版已启动');
</script>
</body>
</html>
