<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>网文创作中枢 · 朱雀全自动过检｜冷笔白描版</title>
  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
  <style>
    :root {
      --bg: #0f0d0a; --panel: #1c1610; --text: #d4be8c; --accent: #c0843a;
      --accent2: #e6a34c; --border: #3d2b18; --editor: #2c2218; --radius: 12px;
      --font: 'PingFang SC', 'Noto Serif SC', 'KaiTi', sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); height:100vh; display:flex; overflow:hidden; }
    .sidebar { width:240px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
    .sidebar h3 { padding:18px 14px; color:var(--accent2); text-align:center; border-bottom:1px solid var(--border); margin:0; }
    .tab-list { flex:1; overflow-y:auto; padding:8px; }
    .tab-btn { display:block; width:100%; text-align:left; background:transparent; border:1px solid transparent; color:var(--text); padding:12px; margin-bottom:2px; border-radius:8px; font-size:0.9rem; cursor:pointer; transition:0.2s; }
    .tab-btn:hover, .tab-btn.active { background:var(--editor); border-color:var(--accent); color:var(--accent2); }
    .main-area { flex:1; padding:20px 24px; overflow-y:auto; display:flex; flex-direction:column; gap:16px; }
    .panel { display:none; flex-direction:column; gap:14px; }
    .panel.active { display:flex; }
    h3 { color:var(--accent2); font-size:1.3rem; border-bottom:1px solid var(--border); padding-bottom:8px; margin:0; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .field { display:flex; flex-direction:column; gap:4px; }
    label { font-size:0.8rem; color:var(--accent); font-weight:600; }
    input, textarea, select { background:var(--editor); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px; font-size:0.9rem; font-family:var(--font); outline:none; }
    textarea { min-height:80px; resize:vertical; }
    .btn { background:var(--accent); color:white; border:none; padding:10px 18px; border-radius:20px; cursor:pointer; font-weight:bold; align-self:flex-start; }
    .btn:disabled { opacity:0.6; pointer-events:none; }
    .btn-sm { padding:6px 12px; font-size:0.8rem; border-radius:14px; }
    .card { background:var(--editor); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; }
    .list-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:var(--editor); border-radius:8px; margin-bottom:6px; }
    .tag { background:var(--accent); color:white; padding:2px 10px; border-radius:12px; font-size:0.7rem; }
    .memory-box { background:#1a1410; border:1px solid var(--border); border-radius:var(--radius); padding:12px; max-height:220px; overflow-y:auto; white-space:pre-wrap; font-size:0.85rem; }
    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#2f2416; color:#ffcf8a; padding:8px 20px; border-radius:20px; z-index:999; opacity:0; transition:0.3s; }
    .toast.show { opacity:1; }
    .btn-danger { background:#a05a3a; }
    .hint { font-size:0.7rem; color:#8a7958; margin-top:-8px; }
    .hide { display:none !important; }
    @media (max-width:768px) { .sidebar { width:200px; } .grid-2 { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="sidebar">
  <h3>📖 创作中枢</h3>
  <div class="tab-list" id="tabList"></div>
</div>
<div class="main-area" id="mainArea"></div>
<div class="toast" id="toast"></div>

<script>
const CONFIG = {
  DB_NAME: 'NovelWriterFinal',
  API_DEFAULT_URL: 'https://api.deepseek.com/v1',
  API_DEFAULT_MODEL: 'deepseek-v4-pro',
  MEMORY_SLICE_SIZE: 15000,
  MAX_SLICES: 30,
  ZHUQUE_PASS_SCORE: 5,
  ZHUQUE_MAX_ROUNDS: 10,
  API_TIMEOUT: 120000
};

// IndexedDB 替代LocalStorage 解决长篇小说溢出崩溃
const IndexDB = {
  db: null,
  async init() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(CONFIG.DB_NAME, 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains('novelData')) db.createObjectStore('novelData', {keyPath:'key'});
      };
      req.onsuccess = e => { this.db = e.target.result; res(); };
      req.onerror = rej;
    });
  },
  async get(key) {
    return new Promise(res => {
      const tx = this.db.transaction('novelData','readonly');
      const r = tx.store.get(key);
      r.onsuccess = () => res(r.result?.value ?? null);
    });
  },
  async set(key, value) {
    return new Promise(res => {
      const tx = this.db.transaction('novelData','readwrite');
      tx.store.put({key, value});
      tx.oncomplete = res;
    });
  }
};

// 兼容降级本地存储
const LS = {
  async get(key, fallback = null) {
    try {
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    } catch(e) { return fallback; }
  },
  async set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch(e) { return false; }
  }
};

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const Toast = { show(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), 2500); } };
const countWords = t => t.replace(/\s|\n/g,'').length;

// 冷笔白描句式清洗规则
function cleanAiSentence(text) {
  return text
    .replace(/心中一凛|脸色骤变|瞳孔骤缩|浑身一震|倒吸一口凉气|面露凝重|神色复杂/g,'')
    .replace(/刹那间|顷刻间|一瞬间|陡然|骤然/g,'')
    .replace(/无尽|浩瀚|磅礴|滔天|璀璨/g,'')
    .replace(/\s+/g,' ')
    .replace(/\n{3,}/g,'\n\n');
}

const tabs = [
  {id:'dashboard', label:'🏠 总控台'}, {id:'characters', label:'👤 人设库'},
  {id:'world', label:'🌍 世界观'}, {id:'outline', label:'📋 三层大纲'},
  {id:'chapters', label:'📚 章节管理'}, {id:'memory', label:'🧠 记忆库'},
  {id:'rewrite', label:'🔁 同文风仿写'}, {id:'write', label:'✍️ 写作'},
  {id:'check', label:'🔍 逻辑校验'}, {id:'style', label:'🎨 风格定制'},
  {id:'backup', label:'💾 备份导入'}
];

function initNav() {
  const list = $('#tabList');
  list.innerHTML = tabs.map(t => `<button class="tab-btn" data-tab="${t.id}">${t.label}</button>`).join('');
  list.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', e => switchTab(e.target.dataset.tab)));
}

async function switchTab(tabId) {
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  const main = $('#mainArea'); main.innerHTML = '';
  const panel = document.createElement('div'); panel.className='panel active'; panel.id='panel-'+tabId;
  main.appendChild(panel);
  const renderers = {
    dashboard: renderDashboard, characters: renderCharacters, world: renderWorld,
    outline: renderOutline, chapters: renderChapters, memory: renderMemory,
    rewrite: renderRewrite, write: renderWrite, check: renderCheck, style: renderStyle, backup: renderBackup
  };
  if(renderers[tabId]) await renderers[tabId](panel);
}

async function callAi(url, key, model, sys, usr, maxT = 8000) {
  try {
    const res = await fetch(`${url}/chat/completions`, {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
      body: JSON.stringify({model, messages:[{role:'system',content:sys},{role:'user',content:usr}], temperature:0.72, max_tokens:maxT})
    });
    if(!res.ok) throw new Error(`API请求失败 (${res.status})`);
    const data = await res.json();
    let txt = data?.choices?.[0]?.message?.content || '';
    return cleanAiSentence(txt);
  } catch(e) { throw e; }
}

async function detectZhuque(text, secretId, secretKey) {
  if(!secretId || !secretKey) throw new Error('请先填写朱雀密钥');
  const endpoint = 'tms.tencentcloudapi.com';
  const service = 'tms';
  const action = 'TextModeration';
  const version = '2020-12-29';
  const region = 'ap-guangzhou';
  const timestamp = Math.floor(Date.now() / 1000);
  const payload = JSON.stringify({ Text: text.slice(0, 10000), BizType: 'aigc_text_detect_100003415389' });

  const date = new Date(timestamp * 1000).toISOString().replace(/[:-]|\.\d{3}/g, '');
  const canonicalHeaders = `content-type:application/json\nhost:${endpoint}\n`;
  const signedHeaders = 'content-type;host';
  const hashedPayload = CryptoJS.SHA256(payload).toString();
  const canonicalRequest = `POST\n/\n\n${canonicalHeaders}\n${signedHeaders}\n${hashedPayload}`;
  const algorithm = 'TC3-HMAC-SHA256';
  const credentialScope = `${date}/${service}/tc3_request`;
  const hashedCanonicalRequest = CryptoJS.SHA256(canonicalRequest).toString();
  const stringToSign = `${algorithm}\n${timestamp}\n${credentialScope}\n${hashedCanonicalRequest}`;

  const secretDate = CryptoJS.HmacSHA256(date, 'TC3' + secretKey);
  const secretService = CryptoJS.HmacSHA256(service, secretDate);
  const secretSigning = CryptoJS.HmacSHA256('tc3_request', secretService);
  const signature = CryptoJS.HmacSHA256(stringToSign, secretSigning).toString();

  const authorization = `${algorithm} Credential=${secretId}/${credentialScope}, SignedHeaders=${signedHeaders}, Signature=${signature}`;

  const res = await fetch(`https://${endpoint}`, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'X-TC-Action': action,
      'X-TC-Version': version,
      'X-TC-Timestamp': timestamp.toString(),
      'X-TC-Region': region,
      'Authorization': authorization
    },
    body: payload
  });
  const json = await res.json();
  if(!res.ok) throw new Error(json?.Response?.Error?.Message || '朱雀API调用失败');
  const score = json?.Response?.Data?.AIProb ? Math.round(json.Response.Data.AIProb * 100) : 0;
  return { name:'腾讯朱雀', score };
}

async function renderDashboard(p) {
  p.innerHTML = `<h3>🏠 小说基础信息</h3>
    <div class="grid-2"><div class="field"><label>小说名称</label><input id="novelTitle"></div><div class="field"><label>类型/流派</label><input id="novelGenre"></div></div>
    <div class="field"><label>世界观简介</label><textarea id="novelWorldIntro"></textarea></div>
    <div class="field"><label>故事基调/读者定位</label><input id="novelTone"></div>
    <button class="btn" id="saveDashboard">💾 保存</button>`;
  $('#novelTitle').value = await LS.get('novelTitle','');
  $('#novelGenre').value = await LS.get('novelGenre','');
  $('#novelWorldIntro').value = await LS.get('novelWorldIntro','');
  $('#novelTone').value = await LS.get('novelTone','');
  $('#saveDashboard').onclick = async () => {
    await LS.set('novelTitle', $('#novelTitle').value);
    await LS.set('novelGenre', $('#novelGenre').value);
    await LS.set('novelWorldIntro', $('#novelWorldIntro').value);
    await LS.set('novelTone', $('#novelTone').value);
    Toast.show('已保存');
  };
}

async function renderCharacters(p) {
  p.innerHTML = `<h3>👤 人设库</h3><div id="charList"></div><button class="btn btn-sm" id="addChar">+ 新建角色</button>
    <div class="card" id="charEditor"><div class="grid-2"><div class="field"><label>全名</label><input id="charName"></div><div class="field"><label>别名</label><input id="charAlias"></div></div>
    <div class="field"><label>性格</label><input id="charPersonality"></div><div class="field"><label>境界</label><input id="charRealm"></div>
    <div class="field"><label>口头禅</label><input id="charCatchphrase"></div><div class="field"><label>弱点/禁忌</label><input id="charWeakness"></div>
    <div class="field"><label>关系网</label><textarea id="charRelations"></textarea></div><button class="btn" id="saveChar">保存角色</button></div>`;
  $('#charEditor').classList.add('hide');
  let cur = null;
  const refresh = async () => {
    const chars = await LS.get('characters', []);
    $('#charList').innerHTML = chars.map((c,i) => `<div class="list-item"><span><strong>${c.name}</strong> <span class="tag">${c.realm||'未知'}</span></span><div><button class="btn btn-sm edit-char" data-index="${i}">编辑</button><button class="btn btn-sm del-char btn-danger" data-index="${i}">删除</button></div></div>`).join('');
    $$('.edit-char').forEach(b => b.onclick = async () => {
      const c = (await LS.get('characters', []))[b.dataset.index];
      cur = b.dataset.index;
      for(const k in c) {
        const el = $('#char'+k.charAt(0).toUpperCase()+k.slice(1));
        if(el) el.value = c[k]||'';
      }
      $('#charEditor').classList.remove('hide');
    });
    $$('.del-char').forEach(b => b.onclick = async () => {
      if(!confirm('确定删除？')) return;
      let chars = await LS.get('characters', []);
      chars.splice(b.dataset.index, 1);
      await LS.set('characters', chars);
      refresh();
    });
  };
  await refresh();
  $('#addChar').onclick = () => {
    cur = null;
    ['charName','charAlias','charPersonality','charRealm','charCatchphrase','charWeakness','charRelations'].forEach(id => $('#'+id).value='');
    $('#charEditor').classList.remove('hide');
  };
  $('#saveChar').onclick = async () => {
    const name = $('#charName').value.trim();
    if(!name) return Toast.show('请输入角色名');
    const obj = { name, alias:$('#charAlias').value, personality:$('#charPersonality').value, realm:$('#charRealm').value, catchphrase:$('#charCatchphrase').value, weakness:$('#charWeakness').value, relations:$('#charRelations').value };
    let chars = await LS.get('characters', []);
    if(cur !== null) chars[cur] = obj;
    else chars.push(obj);
    await LS.set('characters', chars);
    $('#charEditor').classList.add('hide');
    refresh();
    Toast.show('已保存');
  };
}

async function renderChapters(p) {
  p.innerHTML = `<h3>📚 分卷与章节</h3>
    <div style="display:flex; gap:10px; margin-bottom:10px;"><button class="btn btn-sm" id="addVolume">+ 新建分卷</button><button class="btn btn-sm" id="exportTxt">📤 导出全书TXT</button></div>
    <div id="volumeList"></div>`;
  const refresh = async () => {
    const vols = await LS.get('volumes', []);
    const chs = await LS.get('chapters', []);
    let html = '';
    vols.forEach(vol => {
      html += `<div class="card"><div class="card-header" style="display:flex;justify-content:space-between;"><span>📁 ${vol.name}</span><div><button class="btn btn-sm rename-vol" data-id="${vol.id}">重命名</button><button class="btn btn-sm del-vol btn-danger" data-id="${vol.id}">删除</button></div></div>`;
      const volChapters = chs.filter(c => c.volumeId === vol.id);
      volChapters.forEach((ch, idx) => {
        html += `<div class="list-item"><span>${ch.title} <span class="tag">${countWords(ch.content||'')}字</span></span><div>
          <button class="btn btn-sm move-up" data-id="${ch.id}" ${idx===0?'disabled':''}>↑</button>
          <button class="btn btn-sm move-down" data-id="${ch.id}" ${idx===volChapters.length-1?'disabled':''}>↓</button>
          <button class="btn btn-sm edit-ch" data-id="${ch.id}">编辑内容</button>
          <button class="btn btn-sm rename-ch" data-id="${ch.id}">重命名</button>
          <button class="btn btn-sm del-ch btn-danger" data-id="${ch.id}">删除</button></div></div>`;
      });
      html += `<button class="btn btn-sm add-ch" data-vol="${vol.id}" style="margin-left:20px;margin-top:8px;">+ 添加章节</button></div>`;
    });
    $('#volumeList').innerHTML = html || '暂无分卷，请新建';

    $$('.rename-vol').forEach(b => b.onclick = async () => {
      const vols = await LS.get('volumes', []);
      const vol = vols.find(v => v.id === b.dataset.id);
      const n = prompt('新名称', vol?.name);
      if(n) { vol.name = n; await LS.set('volumes', vols); refresh(); }
    });
    $$('.del-vol').forEach(b => b.onclick = async () => {
      if(!confirm('删除分卷会清空下属所有章节，确认？')) return;
      let vols = await LS.get('volumes', []);
      vols = vols.filter(v => v.id !== b.dataset.id);
      await LS.set('volumes', vols);
      await LS.set('chapters', (await LS.get('chapters', [])).filter(c => c.volumeId !== b.dataset.id));
      refresh();
    });
    $$('.add-ch').forEach(b => b.onclick = async () => {
      const t = prompt('章节标题');
      if(!t) return;
      let chs = await LS.get('chapters', []);
      chs.push({id: Date.now().toString(), title:t, volumeId: b.dataset.vol, content:''});
      await LS.set('chapters', chs);
      refresh();
    });
    $$('.edit-ch').forEach(b => b.onclick = async () => {
      let chs = await LS.get('chapters', []);
      const ch = chs.find(c => c.id === b.dataset.id);
      const newTxt = prompt('编辑章节正文', ch.content);
      if(newTxt !== null) { ch.content = newTxt; await LS.set('chapters', chs); refresh(); }
    });
    $$('.move-up').forEach(b => b.onclick = async () => {
      let chs = await LS.get('chapters', []);
      const ch = chs.find(c => c.id === b.dataset.id);
      if(!ch) return;
      const siblings = chs.filter(c => c.volumeId === ch.volumeId);
      const idx = siblings.findIndex(c => c.id === ch.id);
      if(idx > 0) {
        [siblings[idx], siblings[idx-1]] = [siblings[idx-1], siblings[idx]];
        await LS.set('chapters', [...chs.filter(c => c.volumeId !== ch.volumeId), ...siblings]);
        refresh();
      }
    });
    $$('.move-down').forEach(b => b.onclick = async () => {
      let chs = await LS.get('chapters', []);
      const ch = chs.find(c => c.id === b.dataset.id);
      if(!ch) return;
      const siblings = chs.filter(c => c.volumeId === ch.volumeId);
      const idx = siblings.findIndex(c => c.id === ch.id);
      if(idx < siblings.length-1) {
        [siblings[idx], siblings[idx+1]] = [siblings[idx+1], siblings[idx]];
        await LS.set('chapters', [...chs.filter(c => c.volumeId !== ch.volumeId), ...siblings]);
        refresh();
      }
    });
    $$('.rename-ch').forEach(b => b.onclick = async () => {
      let chs = await LS.get('chapters', []);
      const ch = chs.find(c => c.id === b.dataset.id);
      if(!ch) return;
      const t = prompt('新标题', ch.title);
      if(t) { ch.title = t; await LS.set('chapters', chs); refresh(); }
    });
    $$('.del-ch').forEach(b => b.onclick = async () => {
      if(!confirm('删除该章节？')) return;
      await LS.set('chapters', (await LS.get('chapters', [])).filter(c => c.id !== b.dataset.id));
      refresh();
    });
  };
  await refresh();
  $('#addVolume').onclick = async () => {
    const n = prompt('分卷名称');
    if(!n) return;
    let vols = await LS.get('volumes', []);
    vols.push({id: Date.now().toString(), name:n});
    await LS.set('volumes', vols);
    refresh();
  };
  $('#exportTxt').onclick = async () => {
    const vols = await LS.get('volumes', []);
    const chs = await LS.get('chapters', []);
    let txt = '';
    vols.forEach(vol => {
      txt += `\n=== ${vol.name} ===\n`;
      chs.filter(c => c.volumeId === vol.id).forEach(c => txt += `## ${c.title}\n\n${c.content}\n\n`);
    });
    const blob = new Blob(['\uFEFF'+txt], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '小说全文.txt';
    a.click();
    Toast.show('导出成功');
  };
}

async function renderMemory(p) {
  p.innerHTML = `<h3>🧠 前文关联记忆库</h3><textarea id="fullTextInput" rows="6" placeholder="粘贴整本小说正文..."></textarea>
    <div style="display:flex; gap:10px;"><button class="btn" id="parseBtn">🚀 解析并分片存储</button><button class="btn btn-danger" id="clearMemoryBtn">🗑️ 清空记忆</button></div>
    <div id="memStatus" class="memory-box">暂无记忆数据</div><p style="font-size:0.7rem;color:#8a7958;">每段15000字，最多30段，自动匹配前文伏笔</p>`;
  const update = async () => {
    const len = (await LS.get('memorySlices', [])).length;
    $('#memStatus').textContent = len ? `已存储 ${len} 个前文片段` : '暂无记忆数据';
  };
  await update();
  $('#parseBtn').onclick = async () => {
    const text = $('#fullTextInput').value.trim();
    if(!text) return Toast.show('请粘贴正文');
    let slices = [];
    for(let i=0; i<text.length && slices.length<CONFIG.MAX_SLICES; i+=CONFIG.MEMORY_SLICE_SIZE) {
      slices.push(text.slice(i, i+CONFIG.MEMORY_SLICE_SIZE));
    }
    await LS.set('memorySlices', slices);
    update();
    Toast.show(`分片完成，共${slices.length}片段`);
  };
  $('#clearMemoryBtn').onclick = async () => {
    if(confirm('清空所有前文记忆？')) {
      await LS.set('memorySlices', []);
      $('#fullTextInput').value='';
      update();
      Toast.show('已清空');
    }
  };
}

// 新增：同文风仿写重写面板
async function renderRewrite(p) {
  p.innerHTML = `<h3>🔁 同文风复刻重写｜换剧情不换语气</h3>
    <div class="field">
      <label>📑 粘贴你自己的章节原文（用来学语气）</label>
      <textarea id="styleSourceText" rows="8" placeholder="把你写的一章完整粘贴进来，AI自动学你的句式、冷笔白描、叙事节奏"></textarea>
    </div>
    <div class="grid-2">
      <div class="field">
        <label>题材保留/更换方向</label>
        <input id="newTheme" placeholder="例如：古风仙侠→江湖秘境、保留修仙只换地图">

      <div class="field">
        <label>目标字数</label>
        <input id="rewriteWordNum" type="number" value="2000" min="500" max="8000">
      </div>
    </div>
    <div class="field">
      <label>核心要求</label>
      <textarea id="rewriteRequire" placeholder="比如：保留主角性格、全部换事件、不用原有人物、冷笔白描不改文风"></textarea>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn" id="startRewriteBtn">✨ 开始同文风全新重写</button>
      <button class="btn btn-danger" id="clearRewriteInput">🗑️ 清空输入</button>
    </div>
    <div class="field" style="margin-top:16px;">
      <label>📝 生成结果（同语气·全新剧情）</label>
      <textarea id="rewriteResult" rows="14" placeholder="等待生成..."></textarea>
    </div>
    <div style="display:flex; gap:10px; margin-top:8px;">
      <button class="btn btn-sm" id="saveRewriteToChapter">✅ 存入章节管理</button>
      <button class="btn btn-sm" id="copyRewriteResult">📋 复制全文</button>
    </div>`;

  const getApiInfo = async () => ({
    url: await LS.get('apiUrl', CONFIG.API_DEFAULT_URL),
    key: await LS.get('apiKey', ''),
    model: await LS.get('modelName', CONFIG.API_DEFAULT_MODEL)
  });

  $('#clearRewriteInput').onclick = () => {
    $('#styleSourceText').value = '';
    $('#newTheme').value = '';
    $('#rewriteRequire').value = '';
    $('#rewriteResult').value = '';
    Toast.show('已清空');
  };

  $('#copyRewriteResult').onclick = async () => {
    const txt = $('#rewriteResult').value.trim();
    if(!txt) return Toast.show('暂无内容可复制');
    await navigator.clipboard.writeText(txt);
    Toast.show('已复制到剪贴板');
  };

  $('#startRewriteBtn').onclick = async () => {
    const source = $('#styleSourceText').value.trim();
    const theme = $('#newTheme').value.trim();
    const require = $('#rewriteRequire').value.trim();
    const wordNum = parseInt($('#rewriteWordNum').value) || 2000;

    if(!source) return Toast.show('请先粘贴你的原文章节');
    const {url, key, model} = await getApiInfo();
    if(!key) return Toast.show('请先在写作页填写AI密钥');

    $('#startRewriteBtn').disabled = true;
    $('#rewriteResult').value = '⏳ 正在学习你的文风、全新重构剧情，请稍候...';

    try {
      const sysPrompt = `你现在要严格模仿下面这篇网文作者的**专属语气、句式节奏、冷笔白描风格、叙事习惯、短句方式、不用情绪形容词的写法**。
只学文风语气，**绝对不要抄袭原有剧情、人物、世界观、事件**。
需要全新构建：新世界观、新场景、新人物、新冲突、新情节脉络。
保持和参考原文一模一样的文笔味道、句子长短、叙事留白感。

参考作者原文文风样本：
${source}

用户额外要求：
1. 题材走向：${theme || '保留原题材风格，更换地图与事件'}
2. 额外规则：${require || '全程冷笔白描，陈述句，无华丽修饰，无AI套话'}
3. 目标字数：${wordNum}字左右
4. 硬性规则：剧情完全换新、设定完全换新、只复刻文笔语气，不许照搬任何原有桥段
直接输出全新章节正文，不要解释、不要开场白、不要分点。`;

      const res = await callAi(url, key, model, sysPrompt, '请按要求创作同文风全新章节', Math.ceil(wordNum * 2));
      $('#rewriteResult').value = cleanAiSentence(res);
      Toast.show('✅ 同文风全新重写完成，语气高度复刻');
    } catch (e) {
      $('#rewriteResult').value = '';
      Toast.show('生成失败：' + e.message);
    } finally {
      $('#startRewriteBtn').disabled = false;
    }
  };

  $('#saveRewriteToChapter').onclick = async () => {
    const content = $('#rewriteResult').value.trim();
    if(!content) return Toast.show('没有可保存的内容');
    const title = prompt('请输入章节标题', '同文风仿写新章节');
    if(!title) return;

    const vols = await LS.get('volumes', []);
    if(vols.length === 0) {
      await LS.set('volumes', [{id: Date.now().toString(), name:'仿写作品集'}]);
    }
    const newVols = await LS.get('volumes', []);
    const firstVolId = newVols[0].id;

    let chs = await LS.get('chapters', []);
    chs.push({
      id: Date.now().toString(),
      title: title,
      volumeId: firstVolId,
      content: content
    });
    await LS.set('chapters', chs);
    Toast.show('已保存到章节管理，可去分卷查看');
  };
}

async function renderWrite(p) {
  p.innerHTML = `<h3>✍️ 写作引擎｜朱雀全自动过检 · 冷笔白描专属</h3>
    <div class="grid-2">
      <div class="field"><label>📡 AI API地址</label><input id="apiUrlInput" placeholder="${CONFIG.API_DEFAULT_URL}"></div>
      <div class="field"><label>🧠 模型名称</label><input id="modelNameInput" placeholder="${CONFIG.API_DEFAULT_MODEL}"></div>
    </div>
    <div class="field"><label>🔑 AI密钥</label><input type="password" id="apiKeyInput"></div>
    <div class="field"><label>🛡️ 朱雀SecretId</label><input id="zhuqueIdInput" placeholder="AKID..."></div>
    <div class="field"><label>🔐 朱雀SecretKey</label><input type="password" id="zhuqueKeyInput" placeholder="密钥仅本地保存"></div>
    <div class="field"><label>📝 当前章纲</label><textarea id="writeOutline" placeholder="严格按照剧情节点，不要多余修饰"></textarea></div>
    <div class="grid-2">
      <div class="field"><label>📖 目标字数</label><input id="wordTarget" type="number" value="2200" min="200" max="10000" step="100"><span class="hint">误差±10%</span></div>
      <div class="field"><label>⚡ 结尾钩子</label><input id="hookInput" placeholder="章节收尾悬念，不写套话"></div>
    </div>
    <div class="field"><label>📑 目标章节</label><select id="targetChapterSelect"><option value="">请选择要写入的章节</option></select></div>
    <div class="field"><label>📖 前文关联记忆</label><div class="memory-box" id="recallResult">暂未检索前文</div></div>
    <div class="field"><label>📝 朱雀AI检测日志</label><div class="memory-box" id="checkReport">等待执行检测...</div></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn" id="genBtn">✨ 普通章节生成</button>
      <button class="btn" id="deepCheckBtn" style="background:#b85e1e;">🔄 朱雀全自动循环过检</button>
      <button class="btn btn-danger hide" id="stopBtn">⏹️ 终止生成</button>
    </div>
    <textarea id="resultArea" rows="12" placeholder="朱雀合规正文｜冷笔白描短句叙事，无AI套路"></textarea>
    <div style="display:flex; gap:10px; margin-top:8px;">
      <button class="btn btn-sm" id="adoptBtn">✅ 追加写入目标章节</button>
      <button class="btn btn-sm" id="clearResult">🗑️ 清空结果</button>
    </div>`;

  $('#apiUrlInput').value = await LS.get('apiUrl', CONFIG.API_DEFAULT_URL);
  $('#modelNameInput').value = await LS.get('modelName', CONFIG.API_DEFAULT_MODEL);
  $('#apiKeyInput').value = await LS.get('apiKey', '');
  $('#zhuqueIdInput').value = await LS.get('zhuqueId', '');
  $('#zhuqueKeyInput').value = await LS.get('zhuqueKey', '');

  ['apiUrlInput','modelNameInput','apiKeyInput','zhuqueIdInput','zhuqueKeyInput'].forEach(id => {
    $('#'+id).oninput = async e => await LS.set(id.replace('Input',''), e.target.value);
  });

  const fillChapterSelect = async () => {
    const chs = await LS.get('chapters', []);
    const vols = await LS.get('volumes', []);
    const options = chs.map(ch => {
      const vol = vols.find(v => v.id === ch.volumeId);
      return `<option value="${ch.id}">${vol?.name||'无分卷'} - ${ch.title} (${countWords(ch.content||'')}字)</option>`;
    }).join('');
    $('#targetChapterSelect').innerHTML = `<option value="">请选择要写入的章节</option>` + options;
  };
  await fillChapterSelect();

  let generating = false;
  const gi = async () => ({
    url: $('#apiUrlInput').value.trim() || CONFIG.API_DEFAULT_URL,
    key: $('#apiKeyInput').value.trim(),
    model: $('#modelNameInput').value.trim() || CONFIG.API_DEFAULT_MODEL
  });
  const getZhuqueKeys = () => ({
    secretId: $('#zhuqueIdInput').value.trim(),
    secretKey: $('#zhuqueKeyInput').value.trim()
  });

  // 冷笔白描专属Prompt
  const buildSys = async (wt) => {
    const slices = await LS.get('memorySlices', []);
    const outl = $('#writeOutline').value.trim();
    const style = await LS.get('stylePreset','coldwhite');
    const customStyle = await LS.get('styleTone','');

    const kws = outl.split(/[，。\s]+/).filter(k => k.length>=2);
    let rel = [];
    slices.forEach(s => { let sc=0; kws.forEach(k => { if(s.includes(k)) sc++; }); if(sc>0) rel.push({text:s, score:sc}); });
    rel.sort((a,b)=>b.score-a.score);
    rel = rel.slice(0,5).map(r=>r.text);
    $('#recallResult').textContent = rel.join('\n\n') || '无匹配前文伏笔';

    const wR = await LS.get('worldRealm','');
    const chs = await LS.get('characters',[]);
    const cd = chs.map(c => `${c.name}：性格${c.personality}，境界${c.realm}，弱点${c.weakness}`).join('；');
    const hk = $('#hookInput').value ? `，结尾埋下悬念：${$('#hookInput').value}` : '';

    let stylePrompt = '';
    if(style==='coldwhite') stylePrompt='严格冷笔白描，陈述句叙事，不用情绪形容词，短句为主，不用网文套话，半文半白，平铺直叙，去掉所有华丽修辞，只写动作场景对话';
    if(style==='chendong') stylePrompt='辰东风格，宏大叙事，伏笔深远，节奏沉稳';
    if(style==='tudou') stylePrompt='土豆爽文节奏，冲突密集，打脸干脆';
    if(customStyle) stylePrompt += customStyle;

    return `你是专业长篇修仙网文作者，遵循世界观设定，贴合人物人设续写章节。${wR?'世界观规则：'+wR:''}
人物设定：${cd}
前文剧情：${rel.join('\n')}
写作要求：${stylePrompt}
严格控制字数${wt}字左右，只输出正文，不解释、不备注、不分点${hk}`;
  };

  async function rewriteHumanStyle(text) {
    const {url, key, model} = await gi();
    const sys = `真人网文润色，冷笔白描优化。拆分超长句，语句自然口语化，删除AI模板句式，去掉套路成语，增加细节留白，对话简短自然，动作写实，不煽情、不夸张，保留原有剧情不变，直接输出全文`;
    return await callAi(url, key, model, sys, text, 9000);
  }

  async function autoRewriteUntilPass(initialText) {
    let text = initialText;
    let log = `📄 初稿字数：${countWords(text)}\n`;
    const {secretId, secretKey} = getZhuqueKeys();
    if(!secretId || !secretKey) {
      log += '⚠️ 未填写朱雀密钥，无法AI检测\n';
      $('#checkReport').textContent = log;
      return text;
    }

    for(let round = 1; round <= CONFIG.ZHUQUE_MAX_ROUNDS; round++) {
      let score;
      try {
        const result = await detectZhuque(text, secretId, secretKey);
        score = result.score;
        log += `🔍 第${round}轮朱雀检测：AI相似度 ${score}/100\n`;
      } catch(e) {
        log += `⚠️ 检测异常: ${e.message}\n`;
        continue;
      }

      if(score <= CONFIG.ZHUQUE_PASS_SCORE) {
        log += `✅ 检测达标！朱雀低AI概率，成功过检`;
        $('#checkReport').textContent = log;
        return text;
      }

      if(round < CONFIG.ZHUQUE_MAX_ROUNDS) {
        log += `🔄 自动真人化改写冷笔文风...\n`;
        text = await rewriteHumanStyle(text);
        log += `✏️ 改写后字数：${countWords(text)}\n`;
      } else {
        log += `⚠️ 达到最大改写轮次，输出最终版本`;
      }
    }
    $('#checkReport').textContent = log;
    return text;
  }

  const startNormal = async () => {
    if(generating) return;
    const outl = $('#writeOutline').value.trim();
    if(!outl) return Toast.show('请输入章纲');
    generating = true;
    $('#genBtn').disabled = true;
    $('#deepCheckBtn').disabled = true;
    try {
      const {url, key, model} = await gi();
      if(!key) throw new Error('请填写DeepSeek API密钥');
      const wt = parseInt($('#wordTarget').value)||2200;
      const content = await callAi(url, key, model, await buildSys(wt), outl, Math.min(Math.ceil(wt*2.3),9000));
      $('#resultArea').value = content;
      Toast.show(`生成完成，当前字数：${countWords(content)}`);
    } catch(e) { Toast.show('生成失败：'+e.message); }
    finally {
      generating = false;
      $('#genBtn').disabled = false;
      $('#deepCheckBtn').disabled = false;
    }
  };

  const startDeep = async () => {
    if(generating) return;
    const outl = $('#writeOutline').value.trim();
    if(!outl) return Toast.show('请输入章纲');
    const {secretId, secretKey} = getZhuqueKeys();
    if(!secretId || !secretKey) return Toast.show('请填写朱雀腾讯云密钥');
    generating = true;
    $('#deepCheckBtn').disabled = true;
    $('#genBtn').disabled = true;
    $('#checkReport').textContent = '⏳ 正在生成章节初稿，请稍候...';
    try {
      const {url, key, model} = await gi();
      if(!key) throw new Error('请填写AI接口密钥');
      const wt = parseInt($('#wordTarget').value)||2200;
      const draft = await callAi(url, key, model, await buildSys(wt), outl, Math.min(Math.ceil(wt*2.3),9000));
      const final = await autoRewriteUntilPass(draft);
      $('#resultArea').value = final;
      Toast.show('🎉 朱雀全自动过检完成，可直接发布');
    } catch(e) { Toast.show('过检失败：'+e.message); }
    finally {
      generating = false;
      $('#deepCheckBtn').disabled = false;
      $('#genBtn').disabled = false;
    }
  };

  $('#genBtn').onclick = () => setTimeout(startNormal, 200);
  $('#deepCheckBtn').onclick = () => setTimeout(startDeep, 200);
  $('#clearResult').onclick = () => $('#resultArea').value = '';

  $('#adoptBtn').onclick = async () => {
    const content = $('#resultArea').value.trim();
    if(!content) return Toast.show('请先生成章节内容');
    const targetId = $('#targetChapterSelect').value;
    if(!targetId) return Toast.show('请选择要写入的章节');
    let chs = await LS.get('chapters', []);
    const targetCh = chs.find(c => c.id === targetId);
    if(!targetCh) return Toast.show('章节不存在');
    targetCh.content += '\n\n' + content;
    await LS.set('chapters', chs);
    Toast.show(`已成功追加到【${targetCh.title}】`);
    await fillChapterSelect();
  };
}

async function renderBackup(p) {
  p.innerHTML = `<h3>💾 全书数据备份与恢复</h3>
    <button class="btn" id="exportBackup">📤 导出JSON完整备份</button>
    <button class="btn" id="importBackup">📥 导入备份恢复全书</button>
    <input type="file" id="importFile" style="display:none" accept=".json">`;
  $('#exportBackup').onclick = async () => {
    const backup = {};
    for(let i=0; i<localStorage.length; i++) {
      const k = localStorage.key(i);
      backup[k] = await LS.get(k);
    }
    const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '网文创作中枢_完整版备份.json';
    a.click();
    Toast.show('全书所有设定+章节已导出');
  };
  $('#
