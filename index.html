<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苹果手机专用｜DeepSeek小说生成器 300万字记忆</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#12141d;color:#e5e7eb;padding:15px;font-family:-apple-system,BlinkMacSystemFont,"微软雅黑",sans-serif;}
        .wrap{max-width:1300px;margin:0 auto;}
        h1{text-align:center;color:#60a5fa;margin-bottom:20px;font-size:22px;}
        .card{background:#1f2937;border-radius:10px;padding:16px;margin-bottom:15px;}
        textarea{width:100%;height:140px;background:#111827;border:1px solid #374151;color:#f3f4f6;padding:12px;border-radius:8px;resize:none;margin:8px 0;font-size:16px;line-height:1.7;}
        .btn{padding:10px 16px;border:none;border-radius:8px;cursor:pointer;margin:4px;background:#2563eb;color:#fff;font-size:15px;}
        .btn:hover{background:#1d4ed8;}
        .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;align-items:center;}
        select,input{padding:9px;background:#111827;color:#fff;border:1px solid #374151;border-radius:8px;font-size:15px;}
        #res{min-height:300px;white-space:pre-wrap;line-height:1.8;padding:15px;background:#111827;border-radius:8px;margin-top:10px;font-size:16px;}
        .tip{color:#9ca3af;font-size:14px;margin:6px 0;}
        .progress{color:#60a5fa;margin-top:10px;}
    </style>
</head>
<body>
<div class="wrap">
    <h1>DeepSeek 自动写小说｜苹果专用</h1>

    <div class="card">
        <div class="tip">✅ 已适配苹果Safari｜原生DeepSeek对接｜300万字记忆</div>
        <div class="row">
            <input type="text" id="apiKey" placeholder="填入 DeepSeek API Key" style="flex:2;">
            <input type="text" id="apiUrl" value="https://api.deepseek.com/v1/chat/completions" style="flex:2.5;" readonly>
            <!-- 苹果手机专用 DeepSeek 模型 -->
            <select id="modelSel">
                <option value="deepseek-chat" selected>deepseek-chat 写小说首选</option>
                <option value="deepseek-reasoner">deepseek-reasoner 剧情大纲</option>
            </select>
        </div>
        <textarea id="userInput" placeholder="粘贴开篇剧情、人设、续写要求..."></textarea>
        <div class="row">
            <select id="styleSel">
                <option value="玄幻爽文" selected>玄幻爽文</option>
                <option value="仙侠古风">仙侠古风</option>
                <option value="cold">冷笔白描</option>
                <option value="city">都市玄幻</option>
            </select>
            <input type="number" id="wordNum" value="1500" placeholder="生成字数">
            <button class="btn" onclick="genNovel()">生成章节</button>
            <button class="btn" onclick="saveMemory()">保存记忆</button>
            <button class="btn" onclick="clearMemory()">清空记忆</button>
        </div>
        <div class="progress" id="progress"></div>
    </div>

    <div class="card">
        <h3>生成内容</h3>
        <div id="res"></div>
    </div>
</div>

<script>
const MAX_MEMORY_WORDS = 3000000;
let novelMemory = localStorage.getItem('novel300wMem') || '';

const stylePrompts = {
    '玄幻爽文':'你是顶级网文爽文作者，节奏快、冲突足、逆袭感强，结尾留钩子，不写废话。',
    '仙侠古风':'文笔古风凝练，意境悠远，用词雅致，符合修仙世界观。',
    'cold':'冷笔白描写法，禁用情绪形容词，只用客观陈述句，不抒情、不心理描写。',
    'city':'都市玄幻风格，现代都市与修行暗流结合，剧情自然不违和。'
};

// 苹果Safari兼容 + 纯DeepSeek官方对接
async function genNovel(){
    let input = document.getElementById('userInput').value.trim();
    let style = document.getElementById('styleSel').value;
    let wordNum = parseInt(document.getElementById('wordNum').value) || 1500;
    let apiKey = document.getElementById('apiKey').value.trim();
    let apiUrl = document.getElementById('apiUrl').value.trim();
    let model = document.getElementById('modelSel').value;
    let resDom = document.getElementById('res');
    let progressDom = document.getElementById('progress');

    if(!input || !apiKey){
        resDom.innerText = '请填写 DeepSeek Key 和续写剧情';
        return;
    }

    resDom.innerText = '';
    progressDom.innerText = '生成中...';

    let prompt = buildFullPrompt(input,style,wordNum);

    try{
        let res = await fetch(apiUrl,{
            method:'POST',
            headers:{
                'Content-Type':'application/json',
                'Authorization':'Bearer '+apiKey
            },
            body:JSON.stringify({
                model:model,
                messages:[{role:'user',content:prompt}],
                max_tokens:Math.ceil(wordNum*2),
                temperature:0.7
            })
        });

        let data = await res.json();
        let txt = data.choices[0].message.content;

        novelMemory += '\n\n'+txt;
        if(novelMemory.length>MAX_MEMORY_WORDS) novelMemory = novelMemory.slice(-MAX_MEMORY_WORDS);
        localStorage.setItem('novel300wMem',novelMemory);

        resDom.innerText = txt;
        progressDom.innerText = '✅ 完成，已存入300万字记忆';
    }catch(e){
        progressDom.innerText = '❌ 请求失败';
        resDom.innerText = '错误：'+e.message+'\n苹果手机请用Safari打开，不要用微信内置浏览器。';
    }
}

function buildFullPrompt(user,style,word){
    let rule = stylePrompts[style];
    let mem = novelMemory.length>40000 
        ? novelMemory.slice(0,12000)+'\n...中间省略...\n'+novelMemory.slice(-25000)
        : novelMemory;

    return `你续写长篇网文，严格遵守：
1.承接前文人设、剧情、世界观，不崩人设不跑偏
2.不重复句子、不模板凑字
3.字数约${word}字，结尾留下章钩子
4.文风要求：${rule}

已有剧情记忆：
${mem}

当前续写：
${user}

只输出小说正文，不要解释。`;
}

function saveMemory(){
    localStorage.setItem('novel300wMem',novelMemory);
    alert('✅ 300万字记忆已保存');
}
function clearMemory(){
    if(confirm('确定清空全部记忆？不可恢复！')){
        novelMemory='';localStorage.removeItem('novel300wMem');
        document.getElementById('res').innerText='';
    }
}
</script>
</body>
</html>
