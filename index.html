<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>网文创作中枢·进阶完整版</title>
  <style>
    :root {
      --bg: #0f0d0a; --panel: #1c1610; --text: #d4be8c; --accent: #c0843a;
      --accent2: #e6a34c; --border: #3d2b18; --editor: #2c2218; --radius: 12px;
      --font: 'PingFang SC', 'Noto Serif SC', 'KaiTi', sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); height:100vh; display:flex; overflow:hidden; }
    .sidebar { width:260px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
    .sidebar h2 { padding:18px 14px 12px; color:var(--accent2); font-size:1.2rem; letter-spacing:0.1em; border-bottom:1px solid var(--border); }
    .tab-list { flex:1; overflow-y:auto; padding:8px; }
    .tab-btn { display:block; width:100%; text-align:left; background:transparent; border:1px solid transparent; color:var(--text); padding:12px 16px; margin-bottom:2px; border-radius:8px; font-size:0.95rem; cursor:pointer; transition:0.2s; font-family:var(--font); }
    .tab-btn:hover, .tab-btn.active { background:var(--editor); border-color:var(--accent); color:var(--accent2); }
    .main-area { flex:1; padding:20px 24px; overflow-y:auto; display:flex; flex-direction:column; gap:16px; }
    .panel { display:none; flex-direction:column; gap:14px; }
    .panel.active { display:flex; }
    h3 { color:var(--accent2); font-size:1.3rem; border-bottom:1px solid var(--border); padding-bottom:8px; letter-spacing:0.05em; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .field { display:flex; flex-direction:column; gap:4px; }
    label { font-size:0.8rem; color:var(--accent); font-weight:600; }
    input, textarea, select { background:var(--editor); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px 12px; font-size:0.9rem; font-family:var(--font); outline:none; }
    textarea { min-height:80px; resize:vertical; }
    .btn { background:var(--accent); color:white; border:none; padding:10px 18px; border-radius:20px; font-size:0.9rem; cursor:pointer; font-weight:bold; align-self:flex-start; }
    .btn-sm { padding:6px 12px; font-size:0.8rem; border-radius:14px; }
    .card { background:var(--editor); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; }
    .card-header { display:flex; justify-content:space-between; align-items:center; color:var(--accent2); font-weight:bold; margin-bottom:8px; }
    .tag { background:var(--accent); color:white; padding:2px 10px; border-radius:12px; font-size:0.7rem; }
    .memory-box { background:#1a1410; border:1px solid var(--border); border-radius:var(--radius); padding:12px; font-size:0.85rem; max-height:180px; overflow-y:auto; white-space:pre-wrap; }
    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#2f2416; color:#ffcf8a; padding:8px 20px; border-radius:20px; font-size:0.85rem; z-index:200; opacity:0; transition:0.3s; pointer-events:none; }
    .toast.show { opacity:1; }
    @media (max-width:768px) { .sidebar { width:200px; } .grid-2 { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>📖 创作中枢</h2>
  <div class="tab-list">
    <button class="tab-btn active" data-tab="tab-dashboard">🏠 总控台</button>
    <button class="tab-btn" data-tab="tab-characters">👤 人设库</button>
    <button class="tab-btn" data-tab="tab-world">🌍 世界观</button>
    <button class="tab-btn" data-tab="tab-outline">📋 三层大纲</button>
    <button class="tab-btn" data-tab="tab-write">✍️ 写作(核心)</button>
    <button class="tab-btn" data-tab="tab-memory">🧠 记忆系统</button>
    <button class="tab-btn" data-tab="tab-style">🎨 风格定制</button>
  </div>
</div>

<div class="main-area" id="mainArea">
  <!-- 1. 总控台 -->
  <div class="panel active" id="tab-dashboard">
    <h3>🏠 小说基础信息</h3>
    <div class="grid-2">
      <div class="field"><label>小说名称</label><input id="novelTitle" placeholder="未命名"></div>
      <div class="field"><label>类型/流派</label><input id="novelGenre" placeholder="玄幻、仙侠、悬疑..."></div>
    </div>
    <div class="field"><label>世界观简介</label><textarea id="novelWorldIntro" placeholder="一句话描述你的世界..."></textarea></div>
    <div class="grid-2">
      <div class="field"><label>总卷数计划</label><input id="novelVolumes" type="number" value="5"></div>
      <div class="field"><label>总章数预估</label><input id="novelChapters" type="number" value="300"></div>
    </div>
    <div class="field"><label>故事基调 / 读者定位</label><input id="novelTone" placeholder="热血爽文、暗黑压抑、轻松幽默..."></div>
    <button class="btn" id="saveDashboard">💾 保存基础设定</button>
  </div>

  <!-- 2. 人设库 -->
  <div class="panel" id="tab-characters">
    <h3>👤 人物人设数据库</h3>
    <div id="charList"></div>
    <button class="btn btn-sm" id="addCharBtn">+ 新建角色</button>
    <div class="card" id="charEditor" style="display:none;">
      <div class="grid-2">
        <div class="field"><label>全名</label><input id="charName"></div>
        <div class="field"><label>别名/称号</label><input id="charAlias"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>性别</label><input id="charGender"></div>
        <div class="field"><label>年龄</label><input id="charAge"></div>
      </div>
      <div class="field"><label>外貌特征</label><input id="charAppearance"></div>
      <div class="field"><label>性格</label><input id="charPersonality" placeholder="冷漠、热血、腹黑..."></div>
      <div class="field"><label>修为/境界</label><input id="charRealm"></div>
      <div class="field"><label>功法/技能</label><input id="charSkills"></div>
      <div class="field"><label>口头禅</label><input id="charCatchphrase"></div>
      <div class="field"><label>弱点/禁忌</label><input id="charWeakness"></div>
      <div class="field"><label>关系网 (师徒/仇敌/恋人)</label><textarea id="charRelations"></textarea></div>
      <div class="field"><label>人设锁定规则</label><textarea id="charLockRule" placeholder="禁止AI写的：例如不能软弱、不能背叛..."></textarea></div>
      <button class="btn" id="saveCharBtn">保存角色</button>
    </div>
  </div>

  <!-- 3. 世界观 -->
  <div class="panel" id="tab-world">
    <h3>🌍 世界观规则引擎</h3>
    <div class="field"><label>修炼体系 / 境界划分</label><textarea id="worldRealm" placeholder="炼气→筑基→金丹→元婴→化神..."></textarea></div>
    <div class="field"><label>地域地图 / 势力分布</label><textarea id="worldMap"></textarea></div>
    <div class="field"><label>世界铁律 (不可打破的规则)</label><textarea id="worldRules" placeholder="例如：不可复活死者、仙凡有别..."></textarea></div>
    <div class="field"><label>历史时间线 / 重大事件</label><textarea id="worldTimeline"></textarea></div>
    <button class="btn" id="saveWorldBtn">💾 保存世界观</button>
  </div>

  <!-- 4. 三层大纲 -->
  <div class="panel" id="tab-outline">
    <h3>📋 三层大纲系统</h3>
    <div class="field"><label>总纲 (全书主线 + 结局)</label><textarea id="outlineMaster" placeholder="主角从退婚开始，最终成为..."></textarea></div>
    <div class="field"><label>卷纲 (当前卷剧情走向)</label><textarea id="outlineVolume" placeholder="第一卷：少年崛起于微末..."></textarea></div>
    <div class="field"><label>章纲 (当前章节精准剧情节点)</label><textarea id="outlineChapter" placeholder="第1章：祠堂退婚，戒指觉醒..."></textarea></div>
    <button class="btn" id="saveOutlineBtn">💾 保存大纲</button>
  </div>

  <!-- 5. 写作核心 -->
  <div class="panel" id="tab-write">
    <h3>✍️ 智能写作引擎 (进阶完整版)</h3>
    <div class="grid-2">
      <div class="field"><label>📡 API 地址</label><input id="apiUrl" value="https://api.deepseek.com/v1"></div>
      <div class="field"><label>🔑 API 密钥</label><input type="password" id="apiKey" placeholder="sk-..."></div>
    </div>
    <div class="field"><label>🧠 模型名称</label><input id="modelName" value="deepseek-v4-pro"></div>
    <div class="field"><label>当前写作章纲</label><textarea id="writeOutline" placeholder="自动读取章纲..."></textarea></div>
    <div class="grid-2">
      <div class="field"><label>目标字数</label><input id="writeWordTarget" type="number" value="2000"></div>
      <div class="field"><label>冲突/钩子指令</label><input id="writeHook" placeholder="结尾留悬念"></div>
    </div>
    <div class="field"><label>📋 前情摘要与伏笔 (自动注入)</label><div class="memory-box" id="writeMemory">暂无前情数据</div></div>
    <div class="field"><label>🕳️ 未填伏笔提醒</label><div class="memory-box" id="foreshadowBox">暂无</div></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn" id="startWriteBtn">✨ 生成正文</button>
      <button class="btn btn-sm" id="summaryBtn">📋 生成摘要与伏笔</button>
      <button class="btn btn-sm" id="checkBtn">🔍 AI 一致性检查</button>
      <button class="btn btn-sm" id="batchBtn">⚡ 连续生成</button>
    </div>
    <div class="field"><label>生成结果</label><textarea id="writeResult" rows="14" placeholder="AI生成的内容将显示在这里..."></textarea></div>
    <button class="btn btn-sm" id="acceptWriteBtn">✅ 采纳并存入记忆库</button>
  </div>

  <!-- 6. 记忆系统 -->
  <div class="panel" id="tab-memory">
    <h3>🧠 长篇章记忆与伏笔池</h3>
    <div class="field"><label>近5章摘要 (自动累积)</label><textarea id="memoryRecent" rows="6"></textarea></div>
    <div class="field"><label>伏笔池 (自动提取与管理)</label><textarea id="memoryForeshadowing" rows="4" placeholder="1. 戒指残魂身份&#10;2. 二叔背叛动机..."></textarea></div>
    <button class="btn" id="saveMemoryBtn">💾 手动保存记忆库</button>
    <button class="btn btn-sm" id="clearMemoryBtn">清空记忆</button>
  </div>

  <!-- 7. 风格定制 -->
  <div class="panel" id="tab-style">
    <h3>🎨 风格定制 & 仿写系统</h3>
    <div class="field"><label>内置大神风格</label>
      <select id="stylePreset">
        <option value="chendong">辰东 · 九龙拉棺</option>
        <option value="tudou">天蚕土豆 · 斗破</option>
        <option value="ergen">耳根 · 仙逆</option>
        <option value="guimi">诡秘之主 · 克苏鲁</option>
        <option value="shuangwen">都市爽文</option>
        <option value="custom">自定义</option>
      </select>
    </div>
    <div class="field"><label>自定义语气</label><input id="styleTone" placeholder="冷峻、热血、压抑、幽默..."></div>
    <div class="field"><label>句式节奏控制</label><input id="styleRhythm" placeholder="多用短句、章节末留悬念..."></div>
    <button class="btn" id="saveStyleBtn">💾 保存风格设定</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  (() => {
    const $ = s => document.querySelector(s);
    const toast = $('#toast');
    let currentCharId = null;

    // ---------- 工具函数 ----------
    function showToast(msg) {
      toast.textContent = msg; toast.classList.add('show');
      clearTimeout(window._t); window._t = setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function loadData(key, fallback='') { try { return localStorage.getItem(key) || fallback; } catch(e) { return fallback; } }
    function saveData(key, value) { try { localStorage.setItem(key, value); } catch(e) { showToast('存储空间不足！'); } }

    // 初始化加载所有数据
    ['novelTitle','novelGenre','novelWorldIntro','novelVolumes','novelChapters','novelTone',
     'worldRealm','worldMap','worldRules','worldTimeline','outlineMaster','outlineVolume','outlineChapter',
     'memoryRecent','memoryForeshadowing','stylePreset','styleTone','styleRhythm','apiUrl','apiKey','modelName'].forEach(id => {
      const el = $('#'+id); if(el) el.value = loadData(id, el.value || '');
    });

    // 人设库管理
    function loadCharacters() { try { return JSON.parse(localStorage.getItem('characters') || '[]'); } catch(e) { return []; } }
    function saveCharacters(chars) { saveData('characters', JSON.stringify(chars)); }

    // Tab 切换 & 自动读取章纲
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        const target = $('#' + btn.dataset.tab);
        if(target) target.classList.add('active');
        if(btn.dataset.tab === 'tab-write') {
          $('#writeOutline').value = loadData('outlineChapter', '');
          updateMemoryDisplay();
        }
      });
    });

    // ---------- 各面板保存按钮 ----------
    $('#saveDashboard').addEventListener('click', () => {
      ['novelTitle','novelGenre','novelWorldIntro','novelVolumes','novelChapters','novelTone'].forEach(id => saveData(id, $('#'+id).value));
      showToast('基础设定已保存');
    });
    $('#saveWorldBtn').addEventListener('click', () => {
      ['worldRealm','worldMap','worldRules','worldTimeline'].forEach(id => saveData(id, $('#'+id).value));
      showToast('世界观已保存');
    });
    $('#saveOutlineBtn').addEventListener('click', () => {
      ['outlineMaster','outlineVolume','outlineChapter'].forEach(id => saveData(id, $('#'+id).value));
      showToast('大纲已保存');
    });
    $('#saveStyleBtn').addEventListener('click', () => {
      ['stylePreset','styleTone','styleRhythm'].forEach(id => saveData(id, $('#'+id).value));
      showToast('风格设定已保存');
    });
    $('#saveMemoryBtn').addEventListener('click', () => {
      ['memoryRecent','memoryForeshadowing'].forEach(id => saveData(id, $('#'+id).value));
      updateMemoryDisplay();
      showToast('记忆库已手动保存');
    });
    $('#clearMemoryBtn').addEventListener('click', () => {
      if(confirm('确定清空所有记忆与伏笔？')) {
        saveData('memoryRecent', ''); saveData('memoryForeshadowing', '');
        updateMemoryDisplay(); showToast('记忆已清空');
      }
    });
    ['apiUrl','apiKey','modelName'].forEach(id => {
      const el = $('#'+id); if(el) el.addEventListener('input', () => saveData(id, el.value));
    });

    // ---------- 人设卡管理 ----------
    function renderCharList() {
      const chars = loadCharacters();
      $('#charList').innerHTML = chars.map((c, i) => `
        <div class="card"><div class="card-header"><span>${c.name || '未命名'} <span class="tag">${c.realm || '未知境界'}</span></span>
        <div><button class="btn btn-sm edit-char" data-index="${i}">编辑</button>
        <button class="btn btn-sm del-char" data-index="${i}">删除</button></div></div>
        <div style="font-size:0.8rem;">${c.personality || ''} | ${c.catchphrase || ''}</div></div>
      `).join('');
      document.querySelectorAll('.edit-char').forEach(btn => btn.addEventListener('click', (e) => {
        const ch = loadCharacters()[parseInt(e.target.dataset.index)];
        currentCharId = parseInt(e.target.dataset.index);
        ['charName','charAlias','charGender','charAge','charAppearance','charPersonality','charRealm','charSkills','charCatchphrase','charWeakness','charRelations','charLockRule'].forEach(id => {
          const el = $('#'+id); if(el) el.value = ch[id.replace('char','').toLowerCase()] || '';
        });
        $('#charEditor').style.display = 'block';
      }));
      document.querySelectorAll('.del-char').forEach(btn => btn.addEventListener('click', (e) => {
        if(!confirm('删除此角色？')) return;
        const chars = loadCharacters();
        chars.splice(parseInt(e.target.dataset.index), 1);
        saveCharacters(chars); renderCharList();
      }));
    }
    $('#addCharBtn').addEventListener('click', () => {
      currentCharId = null;
      ['charName','charAlias','charGender','charAge','charAppearance','charPersonality','charRealm','charSkills','charCatchphrase','charWeakness','charRelations','charLockRule'].forEach(id => { const el = $('#'+id); if(el) el.value = ''; });
      $('#charEditor').style.display = 'block';
    });
    $('#saveCharBtn').addEventListener('click', () => {
      const char = {
        name: $('#charName').value, alias: $('#charAlias').value, gender: $('#charGender').value, age: $('#charAge').value,
        appearance: $('#charAppearance').value, personality: $('#charPersonality').value, realm: $('#charRealm').value,
        skills: $('#charSkills').value, catchphrase: $('#charCatchphrase').value, weakness: $('#charWeakness').value,
        relations: $('#charRelations').value, lockrule: $('#charLockRule').value
      };
      const chars = loadCharacters();
      if(currentCharId !== null) chars[currentCharId] = char; else chars.push(char);
      saveCharacters(chars); renderCharList();
      $('#charEditor').style.display = 'none'; showToast('角色已保存');
    });
    renderCharList();

    // ---------- 记忆与伏笔显示 ----------
    function updateMemoryDisplay() {
      const recent = loadData('memoryRecent', '暂无前情数据');
      $('#writeMemory').textContent = recent;
      const fores = loadData('memoryForeshadowing', '暂无');
      $('#foreshadowBox').textContent = fores;
    }

    // ---------- 通用 AI 调用 ----------
    async function callAI(systemMsg, userMsg, maxTokens=3000) {
      const apiUrl = $('#apiUrl').value.trim();
      const apiKey = $('#apiKey').value.trim();
      const model = $('#modelName').value.trim();
      if(!apiUrl || !apiKey || !model) throw new Error('请先填写 API 信息');
      const res = await fetch(`${apiUrl.replace(/\/$/,'')}/chat/completions`, {
        method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiKey}`},
        body: JSON.stringify({model, messages:[{role:'system',content:systemMsg},{role:'user',content:userMsg}], temperature:0.85, max_tokens:maxTokens})
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error?.message || '请求失败');
      return data.choices[0].message.content.trim();
    }

    // ---------- 构建提示词 (含结构化人设) ----------
    function buildSystemPrompt() {
      const world = loadData('worldRealm','') + '\n' + loadData('worldRules','') + '\n' + loadData('worldTimeline','');
      const charsList = loadCharacters();
      let charsText = '';
      if(charsList.length > 0) {
        charsText = charsList.map(c => {
          let rule = `- ${c.name}(${c.alias || ''})：${c.realm || ''}，${c.personality || ''}，口头禅：${c.catchphrase || ''}`;
          if(c.lockrule) rule += `。人设锁死规则：${c.lockrule}`;
          if(c.relations) rule += `。关系：${c.relations}`;
          return rule;
        }).join('\n');
      }
      const style = loadData('stylePreset','chendong');
      const tone = loadData('styleTone','');
      const memory = $('#writeMemory').textContent;
      const fores = $('#foreshadowBox').textContent;
      const hook = $('#writeHook').value;
      const wordTarget = $('#writeWordTarget').value;

      let sys = `你是一位专业网文作家。\n【写作风格】${style}。${tone ? '语气：'+tone : ''}\n`;
      if(world.trim()) sys += `\n【世界观与铁律】\n${world}\n`;
      if(charsText) sys += `\n【角色人设（请严格遵守，禁止OOC）】\n${charsText}\n`;
      if(memory && memory !== '暂无前情数据') sys += `\n【前情回顾】${memory}\n`;
      if(fores && fores !== '暂无') sys += `\n【未填伏笔提醒】${fores}\n（请在合适时机回收这些伏笔）\n`;
      sys += `\n【写作指令】请根据章纲续写约${wordTarget}字正文，直接输出故事，不用解释说明。`;
      if(hook) sys += ` 结尾要求：${hook}。`;
      sys += `\n【防AI味铁律】禁止使用“恐怖如斯”“倒吸一口凉气”等水文词汇；多用对话和动作；保持文字张力，杜绝平淡流水账。`;
      return sys;
    }

    // ---------- 生成正文 ----------
    $('#startWriteBtn').addEventListener('click', async () => {
      const btn = $('#startWriteBtn');
      btn.textContent = '⏳ 生成中...';
      try {
        const outline = $('#writeOutline').value.trim();
        const systemMsg = buildSystemPrompt();
        const content = await callAI(systemMsg, outline || '请根据前情和章纲续写', 6000);
        $('#writeResult').value = content;
        showToast('✅ 正文已生成');
      } catch(e) { showToast('生成失败：'+e.message); }
      finally { btn.textContent = '✨ 生成正文'; }
    });

    // ---------- 生成摘要与伏笔 ----------
    $('#summaryBtn').addEventListener('click', async () => {
      const content = $('#writeResult').value.trim();
      if(!content) return showToast('请先生成一段正文');
      const btn = $('#summaryBtn');
      btn.textContent = '⏳ 分析中...';
      try {
        const sys = '请将以下章节内容提炼为JSON格式：{"summary":"一句话剧情摘要","character_updates":"角色状态变化","new_foreshadowings":["新伏笔1","新伏笔2"]}';
        const res = await callAI(sys, content.substring(0, 3000), 500);
        let json = {summary:res, character_updates:'', new_foreshadowings:[]};
        try { json = JSON.parse(res); } catch(e) {}
        const recent = loadData('memoryRecent','');
        const newSummary = `[第${loadData('chapterCount','1')}章] ${json.summary || ''}`;
        saveData('memoryRecent', recent + '\n' + newSummary);
        const oldFores = loadData('memoryForeshadowing','');
        let foresList = oldFores.split('\n').filter(f=>f.trim());
        if(json.new_foreshadowings?.length) json.new_foreshadowings.forEach(f => foresList.push(f));
        saveData('memoryForeshadowing', foresList.join('\n'));
        updateMemoryDisplay();
        showToast('摘要已生成，记忆与伏笔已更新');
      } catch(e) { showToast('摘要生成失败：'+e.message); }
      finally { btn.textContent = '📋 生成摘要与伏笔'; }
    });

    // ---------- AI 一致性检查 ----------
    $('#checkBtn').addEventListener('click', async () => {
      const content = $('#writeResult').value.trim();
      if(!content) return showToast('请先生成正文');
      const btn = $('#checkBtn');
      btn.textContent = '⏳ 检查中...';
      try {
        const world = loadData('worldRealm','') + loadData('worldRules','');
        const chars = loadCharacters().map(c=>`${c.name}:${c.personality},${c.realm},${c.lockrule}`).join(';');
        const memory = $('#writeMemory').textContent;
        const sys = `请检查此章节是否存在角色OOC、世界观矛盾、逻辑漏洞或水话。若有问题请指出，若无回复“✅ 未发现问题”。\n【角色】${chars}\n【世界观】${world}\n【前情】${memory}`;
        const result = await callAI(sys, content.substring(0, 2500), 500);
        alert('AI 一致性检查结果：\n\n' + result);
        showToast('检查完成');
      } catch(e) { showToast('检查失败：'+e.message); }
      finally { btn.textContent = '🔍 AI 检查'; }
    });

    // ---------- 采纳并存入记忆 ----------
    $('#acceptWriteBtn').addEventListener('click', () => {
      const content = $('#writeResult').value.trim();
      if(!content) return showToast('请先生成正文');
      const recent = loadData('memoryRecent','');
      saveData('memoryRecent', recent + '\n' + content.substring(0, 200) + '...');
      let count = parseInt(loadData('chapterCount','1'));
      saveData('chapterCount', count+1);
      updateMemoryDisplay();
      showToast('已存入记忆库');
    });

    // ---------- 连续生成（稳定版） ----------
    $('#batchBtn').addEventListener('click', async () => {
      const chapters = prompt('连续生成几章？', '3');
      if(!chapters) return;
      const num = parseInt(chapters);
      if(isNaN(num) || num<1) return;
      for(let i=0; i<num; i++) {
        showToast(`正在生成第 ${i+1}/${num} 章...`);
        await $('#startWriteBtn').click(); // 触发一次生成
        // 等待AI生成完毕（轮询+超时）
        let timeout = 60;
        while(timeout-- > 0 && $('#startWriteBtn').textContent !== '✨ 生成正文') {
          await new Promise(resolve => setTimeout(resolve, 1000));
        }
        if($('#startWriteBtn').textContent === '✨ 生成正文') {
          // 自动采纳
          $('#acceptWriteBtn').click();
        } else {
          showToast('生成超时，已停止连续生成');
          break;
        }
      }
      showToast(`连续生成 ${num} 章完成`);
    });

    // 初始化
    updateMemoryDisplay();
    showToast('创作中枢已启动，请配置 API 密钥并开始创作');
  })();
</script>
</body>
</html>
