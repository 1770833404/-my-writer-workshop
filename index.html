<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>极致全洗｜人物世界观结局全改｜200万字记忆</title>
  <style>
    :root{--bg:#111;--card:#1b1b1b;--txt:#eee;--blue:#3A8AFE;--red:#d93025;--green:#34A853;--border:#333;--r:8px;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--txt);font-family:微软雅黑;padding:15px;line-height:1.7;}
    .title{text-align:center;color:var(--blue);font-size:22px;margin-bottom:12px;}
    .tab{display:flex;gap:8px;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:12px;overflow:auto;white-space:nowrap;}
    .tab-btn{padding:7px 16px;background:transparent;border:1px solid var(--border);color:var(--txt);border-radius:var(--r);cursor:pointer;}
    .tab-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
    .panel{display:none;flex-direction:column;gap:10px;}
    .panel.active{display:flex;}
    label{font-size:14px;color:#ccc;}
    textarea,input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:var(--r);padding:10px;font-size:14px;outline:none;resize:vertical;}
    textarea{height:240px;}
    .btn{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
    button{padding:9px 20px;border:none;border-radius:var(--r);cursor:pointer;font-size:14px;}
    .b1{background:var(--blue);color:#fff;}
    .b2{background:var(--red);color:#fff;}
    .b3{background:var(--green);color:#fff;}
    button:disabled{opacity:0.5;}
    .tip{font-size:12px;color:#888;}
    .box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px;white-space:pre-wrap;min-height:180px;}
    .mem-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px;max-height:160px;overflow:auto;font-size:13px;}
    .toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#2a2a2a;color:#fff;padding:7px 18px;border-radius:20px;opacity:0;transition:.3s;z-index:99;}
    .toast.show{opacity:1;}
  </style>
</head>
<body>
<h2 class="title">极致连根全洗｜人物·世界观·结局·剧情全换新</h2>
<div class="tab">
  <button class="tab-btn active" data-tab="go">一键全洗</button>
  <button class="tab-btn" data-tab="mem">200万字记忆库</button>
  <button class="tab-btn" data-tab="api">接口配置</button>
</div>

<div class="panel active" id="go">
<label>粘贴原文（排版分段标点以此原样复刻）</label>
<textarea id="src"></textarea>
<div class="btn">
<button class="b1" id="run">极致彻底全洗稿</button>
<button class="b2" onclick="clr()">清空</button>
<button class="b3" onclick="cpy()">复制成品</button>
</div>
<p class="tip">人物姓名、势力世界观、剧情脉络、结局走向全部重写，仅保留故事氛围，排版1:1跟原文一模一样</p>
<label>全新原创成品（格式不变）</label>
<div class="box" id="res"></div>
</div>

<div class="panel" id="mem">
<label>粘贴整本新书全文，构建200万字连贯记忆</label>
<textarea id="book"></textarea>
<div class="btn">
<button class="b1" id="build">构建超长记忆</button>
<button class="b2" id="delmem">清空记忆</button>
</div>
<label>记忆状态</label>
<div class="mem-box" id="minfo">暂无存储</div>
</div>

<div class="panel" id="api">
<label>DeepSeek API Key</label>
<input type="text" id="key">
<label>模型</label>
<input type="text" id="model" value="deepseek-v4-pro">
<button class="b1" id="save">保存配置</button>
</div>

<div class="toast" id="ts"></div>

<script>
const API = "https://api.deepseek.com/v1/chat/completions";
const SLICE = 20000;
const MAX = 100;

const db={
get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},
set(k,v){localStorage.setItem(k,JSON.stringify(v))}
};

function t(msg){
let t=document.getElementById("ts");
t.innerText=msg;t.classList.add("show");
setTimeout(()=>t.classList.remove("show"),2200);
}

//标签切换
document.querySelectorAll(".tab-btn").forEach(b=>{
b.onclick=()=>{
document.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));
document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
document.getElementById(b.dataset.tab).classList.add("active");
}
});

//严格复刻原文排版 只保换行结构，不保剧情骨架
function formatSame(ori,out){
out=out.replace(/——|—/g,"").replace(/。+/g,"。");
let ol=ori.split(/\r\n|\r|\n/);
let nl=out.split(/\r\n|\r|\n/).filter(s=>s.trim());
let p=0,arr=[];
for(let l of ol){
if(!l.trim())arr.push("");
else{arr.push(nl[p]||"");p++;}
}
return arr.join("\n");
}

//记忆更新
function upMem(){
let a=db.get("mem")||[];
let tot=a.reduce((s,v)=>s+v.length,0);
document.getElementById("minfo").innerText=`分段：${a.length}\n总字数：${tot}\n上限200万字`;
}

//构建记忆
document.getElementById("build").onclick=()=>{
let txt=document.getElementById("book").value.trim();
if(!txt)return t("请粘贴全书");
let s=[];
for(let i=0;i<txt.length&&s.length<MAX;i+=SLICE)s.push(txt.slice(i,i+SLICE));
db.set("mem",s);upMem();t("200万字记忆构建完成");
};

document.getElementById("delmem").onclick=()=>{
db.set("mem",[]);document.getElementById("book").value="";upMem();t("记忆已清空");
};

document.getElementById("save").onclick=()=>{
let k=document.getElementById("key").value.trim();
let m=document.getElementById("model").value.trim();
if(!k)return t("请填密钥");
db.set("akey",k);db.set("md",m);t("配置保存成功");
};

function clr(){document.getElementById("src").value="";document.getElementById("res").innerText="";}
async function cpy(){
let t=document.getElementById("res").innerText.trim();
if(!t)return t("无内容");
await navigator.clipboard.writeText(t);t("已复制 格式与原文一致");
}

//核心【强制拆骨架+重构叙事】超强力提示词
document.getElementById("run").onclick=async function(){
let key=db.get("akey");
let mod=db.get("md")||"deepseek-v4-pro";
let ori=document.getElementById("src").value.trim();
if(!key||!ori)return t("请填密钥+粘贴原文");

let mem=(db.get("mem")||[]).join("\n\n");
this.disabled=true;this.innerText="全维度改写中...";
document.getElementById("res").innerText="正在彻底拆解剧情骨架、重构人物世界观、打乱事件顺序...";

let sys=`
你现在执行【极致拆骨架全洗重塑】，严格遵守以下铁律：
1.彻底拆解原文叙事骨架，**打乱事件顺序，改用插叙/倒叙重新编排**，不能跟着原文流程走。
2.人物姓名、身份、性格、势力门派全部换新，绝不沿用原文任何角色设定。
3.修炼体系、世界观规则、地域版图完全重做，替换成全新玄幻架构。
4.剧情起因、经过、冲突、转折、结局全部重写，**因果脉络彻底换掉**。
5.只保留原文文风语感、句子节奏，不保留任何剧情细节、设定、脉络。
6.结合上下文记忆库，保证新书整体人设、战力、设定前后统一连贯。
7.严格对齐原文的换行、分段、空行结构，排版1:1复刻。
8.禁止破折号、多余解释、多余旁白，只输出纯净小说正文。
9.必须做到：**意思氛围相似，剧情骨架、人物、世界观完全不是同一套**。
`;

let user=`
前文上下文连贯记忆库：${mem}

严格按上面铁律，彻底拆骨架、换人物、换世界观、重编剧情顺序，重写以下内容：
${ori}
`;

try{
let r=await fetch(API,{
method:"POST",
headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
body:JSON.stringify({
model:mod,
messages:[{role:"system",content:sys},{role:"user",content:user}],
temperature:0.99,
top_p:0.95,
max_tokens:8000
})
});
let j=await r.json();
if(!j.choices||!j.choices[0]){
document.getElementById("res").innerText="接口返回异常，请检查Key或模型";
return;
}
let txt=j.choices[0].message.content.trim();
document.getElementById("res").innerText=formatSame(ori,txt);
t("全维度拆骨架洗稿完成，已全新原创重构");
}catch(e){
document.getElementById("res").innerText="出错："+e.message;
}finally{
this.disabled=false;this.innerText="极致彻底全洗稿";
}
};
upMem();
</script>
</body>
</html>
