<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>双原创小说同文风创作工具（自动分段版）</title>
  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --text: #e0e0e0;
      --accent: #4285F4;
      --border: #333333;
      --editor: #2a2a2a;
      --radius: 8px;
      --font: 'Microsoft YaHei', sans-serif;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px;
      line-height: 1.6;
    }
    .container {
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .title {
      text-align: center;
      color: var(--accent);
      font-size: 20px;
      margin-bottom: 8px;
    }
    .tab-bar {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .tab-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
      flex-shrink: 0;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .panel {
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .panel.active {
      display: flex;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 13px;
      color: var(--accent);
      font-weight: 500;
    }
    textarea, input {
      background: var(--editor);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 10px;
      font-size: 14px;
      resize: vertical;
      font-family: var(--font);
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .action-btn {
      padding: 10px 18px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    .action-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .danger-btn {
      background: #d93025;
    }
    .success-btn {
      background: #34A853;
    }
    .memory-box {
      background: var(--editor);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      max-height: 250px;
      overflow-y: auto;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .hint {
      font-size: 11px;
      color: #999;
      margin-top: -6px;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #2a2a2a;
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      z-index: 999;
      opacity: 0;
      transition: 0.3s;
    }
    .toast.show {
      opacity: 1;
    }
    .book-manager {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .book-card {
      flex: 1;
      min-width: 280px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
    }
    .book-card h4 {
      color: var(--accent);
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .chapter-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: var(--editor);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>
<div class="container">
  <h2 class="title">双原创小说同文风创作工具（自动分段版）</h2>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="write">文风复刻创作</button>
    <button class="tab-btn" data-tab="api">AI接口配置</button>
    <button class="tab-btn" data-tab="memory">全文记忆管理</button>
    <button class="tab-btn" data-tab="book">双书章节管理</button>
  </div>

  <!-- 文风复刻创作面板 -->
  <div class="panel active" id="write">
    <div class="field">
      <label>📝 粘贴你的原创章节原文（学习文风）</label>
      <textarea id="sourceText" rows="8" placeholder="请粘贴你已写好的小说章节，工具将学习你的叙事语气、句式、文笔风格，不抄袭任何情节"></textarea>
    </div>
    <div class="field">
      <label>🌍 全新原创设定（与原文完全无关）</label>
      <textarea id="newSetting" rows="3" placeholder="请填写：全新世界观、核心设定、人物名字、故事背景，确保和原文无任何关联"></textarea>
    </div>
    <div class="field">
      <label>📖 新章节剧情要求（全新情节）</label>
      <textarea id="newPlot" rows="3" placeholder="详细描述新章节要写的剧情，完全独立于原文，无相似桥段"></textarea>
    </div>
    <div class="btn-group">
      <button class="action-btn" id="startWrite">开始同文风原创写作</button>
      <button class="action-btn danger-btn" id="clearInput">清空输入</button>
    </div>
    <div class="field">
      <label>✍️ 全新原创章节（自动分段，手机友好）</label>
      <textarea id="resultText" rows="12" placeholder="生成的全新章节，自动按网文节奏分段，文风与你一致，情节设定完全原创，可直接发布另一平台"></textarea>
    </div>
    <div class="btn-group">
      <button class="action-btn success-btn" id="saveToBook">保存至新书章节</button>
      <button class="action-btn" id="copyResult">复制全文</button>
    </div>
  </div>

  <!-- AI接口配置面板 -->
  <div class="panel" id="api">
    <div class="field">
      <label>🔑 DeepSeek API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-... 开头的密钥，仅保存在本地">
    </div>
    <div class="field">
      <label>🧠 模型名称（推荐deepseek-v4-pro）</label>
      <input id="modelNameInput" value="deepseek-v4-pro" placeholder="deepseek-v4-pro / deepseek-v4-flash">
    </div>
    <div class="btn-group">
      <button class="action-btn" id="saveApiConfig">保存配置</button>
    </div>
    <p class="hint">配置后才能正常生成章节，密钥仅保存在你设备本地，不会上传</p>
  </div>

  <!-- 全文记忆管理面板 -->
  <div class="panel" id="memory">
    <div class="field">
      <label>📚 粘贴新书全文（构建200万字记忆库）</label>
      <textarea id="fullBookText" rows="6" placeholder="粘贴新书所有已写内容，工具自动分片存储，支持200万字超长文本记忆"></textarea>
    </div>
    <div class="btn-group">
      <button class="action-btn" id="buildMemory">构建全文记忆</button>
      <button class="action-btn danger-btn" id="clearMemory">清空记忆库</button>
    </div>
    <div class="field">
      <label>🧠 记忆库状态</label>
      <div class="memory-box" id="memoryStatus">暂无记忆数据，支持单本200万字上下文关联记忆</div>
    </div>
    <p class="hint">自动匹配前文伏笔、人设、设定，保证新书上下文逻辑连贯，无前后矛盾</p>
  </div>

  <!-- 双书章节管理面板 -->
  <div class="panel" id="book">
    <div class="book-manager">
      <!-- 原书管理 -->
      <div class="book-card">
        <h4>原书（主发平台）</h4>
        <div id="originalBookChapters">
          <p class="hint">可手动添加原书章节，统一管理</p>
        </div>
        <button class="action-btn" style="margin-top:10px;width:100%" id="addOriginalChapter">添加原书章节</button>
      </div>
      <!-- 新书管理 -->
      <div class="book-card">
        <h4>新书（第二平台）</h4>
        <div id="newBookChapters">
          <p class="hint">自动保存同文风原创章节，独立管理</p>
        </div>
        <button class="action-btn success-btn" style="margin-top:10px;width:100%" id="exportNewBook">导出新书全文</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// 配置项
const CONFIG = {
  API_URL: 'https://api.deepseek.com/v1',
  MEMORY_SLICE_SIZE: 20000,
  MAX_MEMORY_SIZE: 100,
  BOOK_KEYS: {
    ORIGINAL: 'original_book',
    NEW: 'new_book',
    MEMORY: 'book_memory',
    API_KEY: 'api_key',
    MODEL_NAME: 'model_name'
  }
};

// 本地存储工具
const Storage = {
  get(key, fallback = null) {
    try {
      const data = localStorage.getItem(key);
      return data ? JSON.parse(data) : fallback;
    } catch (e) {
      return fallback;
    }
  },
  set(key, data) {
    localStorage.setItem(key, JSON.stringify(data));
  },
  clear(key) {
    localStorage.removeItem(key);
  }
};

// 提示工具
const Toast = {
  show(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }
};

// 标签切换
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

// ===================== 专属你的排版规则 =====================
// 一句一段、空行分隔、清破折号、清多余句号、不强行拆分
function processNovelText(text) {
  // 清除所有长短破折号
  text = text.replace(/——|—/g, "");
  // 多个句号合并成一个
  text = text.replace(/。+/g, "。");
  // 统一换行符
  text = text.replace(/\r\n|\r/g, "\n");
  // 按 。！？” 结尾自动分句换行
  text = text.replace(/([。！？…”])/g, "$1\n");
  // 去首尾空格、过滤空行
  let arr = text.split("\n").map(s => s.trim()).filter(s => s);
  // 每句之间空一行，完全匹配你要的格式
  return arr.join("\n\n");
}
// ============================================================

// 构建同文风创作指令
function buildWritePrompt() {
  const source = document.getElementById('sourceText').value.trim();
  const newSetting = document.getElementById('newSetting').value.trim();
  const newPlot = document.getElementById('newPlot').value.trim();
  const memory = Storage.get(CONFIG.BOOK_KEYS.MEMORY, []).join('\n\n');

  if (!source || !newSetting || !newPlot) {
    Toast.show('请填写完整信息！');
    return null;
  }

  return `
严格模仿参考文本的文笔、句式、短句节奏、叙事口吻、用词习惯。
硬性规则：
1、禁止使用破折号，禁止多余解释性旁白，禁止多余心理强行解说。
2、只用正常叙事、对话、动作描写，文风冷峻干净。
3、句式长短完全跟着参考文走，一句一事，不堆砌长句。
4、只输出小说正文，不要标题、不要注释、不要多余废话。
5、全新人物全新剧情全新世界观，绝不抄袭参考文情节。
6、生成完毕后我会自动排版，你只管按风格正常写。

全新设定：${newSetting}
本章剧情：${newPlot}
前文上下文：${memory}

参考文风样本：
${source}
`;
}

// 调用DeepSeek接口
async function callDeepSeek(sysPrompt, userPrompt, maxTokens = 6000) {
  const apiKey = Storage.get(CONFIG.BOOK_KEYS.API_KEY);
  const modelName = Storage.get(CONFIG.BOOK_KEYS.MODEL_NAME, 'deepseek-v4-pro');
  
  if (!apiKey) {
    throw new Error('请先在「AI接口配置」面板填写API Key');
  }

  const response = await fetch(`${CONFIG.API_URL}/chat/completions`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`
    },
    body: JSON.stringify({
      model: modelName,
      messages: [
        { role: 'system', content: sysPrompt },
        { role: 'user', content: userPrompt }
      ],
      temperature: 0.7,
      max_tokens: maxTokens
    })
  });

  if (!response.ok) {
    const err = await response.json();
    throw new Error(`API请求失败: ${err.error?.message || response.status}`);
  }

  const data = await response.json();
  return data.choices[0].message.content;
}

// 开始同文风创作
document.getElementById('startWrite').addEventListener('click', async () => {
  const prompt = buildWritePrompt();
  if (!prompt) return;

  const btn = document.getElementById('startWrite');
  btn.disabled = true;
  btn.textContent = '创作中...';
  document.getElementById('resultText').value = '正在以你的文风创作，自动按你专属格式分段，请稍候...';

  try {
    const rawResult = await callDeepSeek(prompt, '请按要求创作同文风全新章节', 6000);
    const formattedResult = processNovelText(rawResult);
    document.getElementById('resultText').value = formattedResult;
    Toast.show('创作完成，已自动排成你的专属格式');
  } catch (e) {
    document.getElementById('resultText').value = '';
    Toast.show('生成失败: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '开始同文风原创写作';
  }
});

// 清空输入
document.getElementById('clearInput').addEventListener('click', () => {
  document.getElementById('sourceText').value = '';
  document.getElementById('newSetting').value = '';
  document.getElementById('newPlot').value = '';
  document.getElementById('resultText').value = '';
  Toast.show('已清空所有输入');
});

// 复制结果
document.getElementById('copyResult').addEventListener('click', () => {
  const text = document.getElementById('resultText').value.trim();
  if (!text) {
    Toast.show('暂无内容可复制');
    return;
  }
  navigator.clipboard.writeText(text).then(() => {
    Toast.show('已复制全文（专属排版格式）');
  });
});

// 保存AI配置
document.getElementById('saveApiConfig').addEventListener('click', () => {
  const apiKey = document.getElementById('apiKeyInput').value.trim();
  const modelName = document.getElementById('modelNameInput').value.trim() || 'deepseek-v4-pro';
  
  if (!apiKey) {
    Toast.show('请填写API Key');
    return;
  }
  
  Storage.set(CONFIG.BOOK_KEYS.API_KEY, apiKey);
  Storage.set(CONFIG.BOOK_KEYS.MODEL_NAME, modelName);
  Toast.show('配置已保存！');
});

// 构建全文记忆
document.getElementById('buildMemory').addEventListener('click', () => {
  const text = document.getElementById('fullBookText').value.trim();
  if (!text) {
    Toast.show('请粘贴新书全文');
    return;
  }

  let slices = [];
  for (let i = 0; i < text.length && slices.length < CONFIG.MAX_MEMORY_SIZE; i += CONFIG.MEMORY_SLICE_SIZE) {
    slices.push(text.slice(i, i + CONFIG.MEMORY_SLICE_SIZE));
  }
  Storage.set(CONFIG.BOOK_KEYS.MEMORY, slices);
  updateMemoryStatus();
  Toast.show(`全文记忆构建完成，共${slices.length}段`);
});

// 更新记忆状态
function updateMemoryStatus() {
  const slices = Storage.get(CONFIG.BOOK_KEYS.MEMORY, []);
  const totalWords = slices.reduce((sum, slice) => sum + slice.length, 0);
  document.getElementById('memoryStatus').textContent = 
    `已存储记忆段数：${slices.length}\n总记忆字数：${totalWords}字\n支持最大200万字上下文关联，保证新书逻辑连贯`;
}

// 清空记忆库
document.getElementById('clearMemory').addEventListener('click', () => {
  if (confirm('确定清空所有全文记忆？')) {
    Storage.clear(CONFIG.BOOK_KEYS.MEMORY);
    document.getElementById('fullBookText').value = '';
    updateMemoryStatus();
    Toast.show('已清空全文记忆');
  }
});

// 保存至新书章节
document.getElementById('saveToBook').addEventListener('click', () => {
  const content = document.getElementById('resultText').value.trim();
  if (!content) {
    Toast.show('请先生成原创章节');
    return;
  }
  const title = prompt('请输入新书章节标题');
  if (!title) return;

  const chapters = Storage.get(CONFIG.BOOK_KEYS.NEW, []);
  chapters.push({
    id: Date.now(),
    title,
    content,
    createTime: new Date().toLocaleString()
  });
  Storage.set(CONFIG.BOOK_KEYS.NEW, chapters);
  renderNewChapters();
  Toast.show('章节保存成功');
});

// 渲染新书章节
function renderNewChapters() {
  const chapters = Storage.get(CONFIG.BOOK_KEYS.NEW, []);
  const container = document.getElementById('newBookChapters');
  if (chapters.length === 0) {
    container.innerHTML = '<p class="hint">暂无章节，快去创作吧</p>';
    return;
  }
  container.innerHTML = chapters.map(ch => `
    <div class="chapter-item">
      <span>${ch.title}</span>
      <span>${ch.createTime}</span>
    </div>
  `).join('');
}

// 导出新书全文
document.getElementById('exportNewBook').addEventListener('click', () => {
  const chapters = Storage.get(CONFIG.BOOK_KEYS.NEW, []);
  if (chapters.length === 0) {
    Toast.show('新书暂无章节');
    return;
  }
  let text = '新书全文（同文风原创，已自动分段）\n\n';
  chapters.forEach(ch => {
    text += `${ch.title}\n\n${ch.content}\n\n`;
  });
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '原创小说新书全文.txt';
  a.click();
  Toast.show('新书全文导出成功（含自动分段）');
});

// 添加原书章节
document.getElementById('addOriginalChapter').addEventListener('click', () => {
  const title = prompt('请输入原书章节标题');
  if (!title) return;
  const content = prompt('请输入原书章节内容');
  if (!content) return;

  const chapters = Storage.get(CONFIG.BOOK_KEYS.ORIGINAL, []);
  chapters.push({
    id: Date.now(),
    title,
    content,
    createTime: new Date().toLocaleString()
  });
  Storage.set(CONFIG.BOOK_KEYS.ORIGINAL, chapters);
  renderOriginalChapters();
  Toast.show('原书章节添加成功');
});

// 渲染原书章节
function renderOriginalChapters() {
  const chapters = Storage.get(CONFIG.BOOK_KEYS.ORIGINAL, []);
  const container = document.getElementById('originalBookChapters');
  if (chapters.length === 0) {
    container.innerHTML = '<p class="hint">暂无章节</p>';
    return;
  }
  container.innerHTML = chapters.map(ch => `
    <div class="chapter-item">
      <span>${ch.title}</span>
      <span>${ch.createTime}</span>
    </div>
  `).join('');
}

// 初始化
window.addEventListener('DOMContentLoaded', () => {
  updateMemoryStatus();
  renderNewChapters();
  renderOriginalChapters();
  
  // 加载已保存的API配置
  const savedApiKey = Storage.get(CONFIG.BOOK_KEYS.API_KEY);
  const savedModelName = Storage.get(CONFIG.BOOK_KEYS.MODEL_NAME, 'deepseek-v4-pro');
  if (savedApiKey) {
    document.getElementById('apiKeyInput').value = savedApiKey;
    document.getElementById('modelNameInput').value = savedModelName;
  }
});
</script>
</body>
</html>
