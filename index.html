<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>网文创作中枢 · 最终稳定版</title>
    <style>
        :root {
            --bg: #0f0d0a; --panel: #1c1610; --text: #d4be8c; --accent: #c0843a;
            --accent2: #e6a34c; --border: #3d2b18; --editor: #2c2218; --radius: 12px;
            --font: 'PingFang SC', 'Noto Serif SC', 'KaiTi', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); height:100vh; display:flex; overflow:hidden; }
        .sidebar { width:240px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
        .sidebar h3 { padding:18px 14px; color:var(--accent2); text-align:center; border-bottom:1px solid var(--border); margin:0; }
        .nav-list { flex:1; overflow-y:auto; padding:8px; }
        .nav-btn { display:block; width:100%; text-align:left; background:transparent; border:1px solid transparent; color:var(--text); padding:12px; margin-bottom:2px; border-radius:8px; font-size:0.9rem; cursor:pointer; transition:0.2s; }
        .nav-btn:hover, .nav-btn.active { background:var(--editor); border-color:var(--accent); color:var(--accent2); }
        .main-area { flex:1; padding:20px 24px; overflow-y:auto; }
        .tab-content { display:none; flex-direction:column; gap:14px; }
        .tab-content.active { display:flex; }
        h3 { color:var(--accent2); font-size:1.3rem; border-bottom:1px solid var(--border); padding-bottom:8px; margin:0 0 8px 0; }
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .field { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
        label { font-size:0.8rem; color:var(--accent); font-weight:600; }
        input, textarea, select { background:var(--editor); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px; font-size:0.9rem; font-family:var(--font); outline:none; }
        textarea { min-height:80px; resize:vertical; }
        .btn { background:var(--accent); color:white; border:none; padding:10px 18px; border-radius:20px; cursor:pointer; font-weight:bold; align-self:flex-start; }
        .btn:disabled { opacity:0.6; pointer-events:none; }
        .btn-sm { padding:6px 12px; font-size:0.8rem; border-radius:14px; }
        .card { background:var(--editor); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; }
        .list-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:var(--editor); border-radius:8px; margin-bottom:6px; }
        .tag { background:var(--accent); color:white; padding:2px 10px; border-radius:12px; font-size:0.7rem; }
        .memory-box { background:#1a1410; border:1px solid var(--border); border-radius:var(--radius); padding:12px; max-height:220px; overflow-y:auto; white-space:pre-wrap; font-size:0.85rem; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#2f2416; color:#ffcf8a; padding:8px 20px; border-radius:20px; z-index:999; opacity:0; transition:0.3s; }
        .toast.show { opacity:1; }
        .btn-danger { background:#a05a3a; }
        .hint { font-size:0.7rem; color:#8a7958; margin-top:-8px; }
        .hide { display:none !important; }
        @media (max-width:768px) { .sidebar { width:200px; } .grid-2 { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div class="sidebar">
    <h3>📖 创作中枢</h3>
    <div class="nav-list">
        <button class="nav-btn active" data-tab="dashboard">🏠 总控台</button>
        <button class="nav-btn" data-tab="characters">👤 人设库</button>
        <button class="nav-btn" data-tab="world">🌍 世界观</button>
        <button class="nav-btn" data-tab="outline">📋 三层大纲</button>
        <button class="nav-btn" data-tab="chapters">📚 章节管理</button>
        <button class="nav-btn" data-tab="memory">🧠 记忆库</button>
        <button class="nav-btn" data-tab="write">✍️ 写作</button>
        <button class="nav-btn" data-tab="check">🔍 逻辑校验</button>
        <button class="nav-btn" data-tab="style">🎨 风格定制</button>
        <button class="nav-btn" data-tab="backup">💾 备份导入</button>
    </div>
</div>

<div class="main-area" id="mainArea">
    <!-- 所有面板内容已在HTML中完整预置 -->
    <div class="tab-content active" id="tab-dashboard">
        <h3>🏠 小说基础信息</h3>
        <div class="grid-2">
            <div class="field"><label>小说名称</label><input id="novelTitle"></div>
            <div class="field"><label>类型/流派</label><input id="novelGenre"></div>
        </div>
        <div class="field"><label>世界观简介</label><textarea id="novelWorldIntro"></textarea></div>
        <div class="field"><label>故事基调/读者定位</label><input id="novelTone"></div>
        <button class="btn" id="saveDashboard">💾 保存</button>
    </div>

    <div class="tab-content" id="tab-characters">
        <h3>👤 人设库</h3>
        <div id="charList"></div>
        <button class="btn btn-sm" id="addChar">+ 新建角色</button>
        <div class="card hide" id="charEditor">
            <div class="grid-2">
                <div class="field"><label>全名</label><input id="charName"></div>
                <div class="field"><label>别名</label><input id="charAlias"></div>
            </div>
            <div class="field"><label>性格</label><input id="charPersonality"></div>
            <div class="field"><label>境界</label><input id="charRealm"></div>
            <div class="field"><label>口头禅</label><input id="charCatchphrase"></div>
            <div class="field"><label>弱点/禁忌</label><input id="charWeakness"></div>
            <div class="field"><label>关系网</label><textarea id="charRelations"></textarea></div>
            <button class="btn" id="saveChar">保存角色</button>
        </div>
    </div>

    <div class="tab-content" id="tab-world">
        <h3>🌍 世界观规则</h3>
        <div class="field"><label>修炼体系</label><textarea id="worldRealm"></textarea></div>
        <div class="field"><label>势力分布</label><textarea id="worldMap"></textarea></div>
        <div class="field"><label>世界铁律</label><textarea id="worldRules"></textarea></div>
        <button class="btn" id="saveWorld">💾 保存</button>
    </div>

    <div class="tab-content" id="tab-outline">
        <h3>📋 三层大纲</h3>
        <div class="field"><label>总纲</label><textarea id="outlineMaster"></textarea></div>
        <div class="field"><label>卷纲</label><textarea id="outlineVolume"></textarea></div>
        <div class="field"><label>章纲</label><textarea id="outlineChapter"></textarea></div>
        <button class="btn" id="saveOutline">💾 保存</button>
    </div>

    <div class="tab-content" id="tab-chapters">
        <h3>📚 分卷与章节</h3>
        <div style="display:flex; gap:10px; margin-bottom:10px;">
            <button class="btn btn-sm" id="addVolume">+ 新建分卷</button>
            <button class="btn btn-sm" id="exportTxt">📤 导出全书TXT</button>
        </div>
        <div id="volumeList"></div>
    </div>

    <div class="tab-content" id="tab-memory">
        <h3>🧠 记忆库</h3>
        <textarea id="fullTextInput" rows="6" placeholder="粘贴整本小说正文..."></textarea>
        <div style="display:flex; gap:10px; margin-top:8px;">
            <button class="btn" id="parseBtn">🚀 解析并分片存储</button>
            <button class="btn btn-danger" id="clearMemoryBtn">🗑️ 清空记忆</button>
        </div>
        <div id="memStatus" class="memory-box" style="margin-top:10px;">暂无记忆数据</div>
        <p style="font-size:0.7rem;color:#8a7958;">每段15000字，最多20段。</p>
    </div>

    <div class="tab-content" id="tab-write">
        <h3>✍️ 写作引擎（深度过检）</h3>
        <div class="grid-2">
            <div class="field"><label>API 地址</label><input id="apiUrlInput" placeholder="https://api.deepseek.com/v1"></div>
            <div class="field"><label>模型名称</label><input id="modelNameInput" placeholder="deepseek-v4-pro"></div>
        </div>
        <div class="field"><label>API密钥</label><input type="password" id="apiKeyInput"></div>
        <div class="field"><label>当前章纲</label><textarea id="writeOutline"></textarea></div>
        <div class="grid-2">
            <div class="field"><label>目标字数</label><input id="wordTarget" type="number" value="2000" min="200" max="8000" step="100"><span class="hint">控制在±10%</span></div>
            <div class="field"><label>结尾钩子</label><input id="hookInput" placeholder="结尾留悬念"></div>
        </div>
        <div class="field"><label>📖 关联记忆</label><div class="memory-box" id="recallResult">暂未检索</div></div>
        <div style="display:flex; gap:10px;">
            <button class="btn" id="genBtn">✨ 普通生成</button>
            <button class="btn" id="deepCheckBtn" style="background:#b85e1e;">🔄 深度过检（改写到0）</button>
            <button class="btn btn-danger hide" id="stopBtn">⏹️ 取消</button>
        </div>
        <textarea id="resultArea" rows="10"></textarea>
        <button class="btn btn-sm" id="adoptBtn">✅ 采纳到章节</button>
        <div class="card"><h4 style="color:var(--accent2);">📋 过检报告</h4><div id="checkReport" class="memory-box">等待执行...</div></div>
    </div>

    <div class="tab-content" id="tab-check">
        <h3>🔍 逻辑校验</h3>
        <button class="btn" id="runCheck">执行检查</button>
        <div id="checkResult" class="memory-box" style="margin-top:10px;"></div>
    </div>

    <div class="tab-content" id="tab-style">
        <h3>🎨 风格定制</h3>
        <div class="field">
            <label>内置大神风格</label>
            <select id="stylePreset">
                <option value="chendong">辰东 · 九龙拉棺</option>
                <option value="tudou">天蚕土豆 · 斗破</option>
            </select>
        </div>
        <div class="field"><label>自定义语气</label><input id="styleTone" placeholder="冷峻、热血、压抑、幽默..."></div>
        <button class="btn" id="saveStyle">💾 保存</button>
    </div>

    <div class="tab-content" id="tab-backup">
        <h3>💾 数据备份与恢复</h3>
        <button class="btn" id="exportBackup">📤 导出全部数据</button>
        <button class="btn" id="importBackup" style="margin-left:10px;">📥 导入备份文件</button>
        <input type="file" id="importFile" style="display:none" accept=".json">
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    // ===================== 全局数据与工具 =====================
    const LS = {
        get(key, fallback = null) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e) { return fallback; } },
        set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch(e) { return false; } }
    };
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);
    const Toast = { show(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), 2000); } };
    const countWords = t => t.replace(/\s/g,'').length;

    // ===================== 导航切换 =====================
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            const target = $('#tab-' + btn.dataset.tab);
            if(target) target.classList.add('active');
            if(btn.dataset.tab === 'write') {
                $('#writeOutline').value = LS.get('outlineChapter','');
                const slices = LS.get('memorySlices', []);
                $('#recallResult').textContent = slices.length ? `已索引 ${slices.length} 个片段` : '无关联记忆';
            }
            if(btn.dataset.tab === 'chapters') renderChapterList();
        });
    });

    // ===================== API 调用 =====================
    async function callAi(url, key, model, sys, usr, maxT = 6000, signal = null) {
        if (!signal) { const ctrl = new AbortController(); signal = ctrl.signal; setTimeout(() => ctrl.abort(), 60000); }
        const res = await fetch(`${url}/chat/completions`, {
            method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
            body: JSON.stringify({model, messages:[{role:'system',content:sys},{role:'user',content:usr}], temperature:0.85, max_tokens:maxT}),
            signal: signal
        });
        if(!res.ok) throw new Error(`请求失败(${res.status})`);
        const data = await res.json();
        return data?.choices?.[0]?.message?.content || '';
    }

    // ===================== 加载存储值 =====================
    function loadAllSettings() {
        $('#novelTitle').value = LS.get('novelTitle','');
        $('#novelGenre').value = LS.get('novelGenre','');
        $('#novelWorldIntro').value = LS.get('novelWorldIntro','');
        $('#novelTone').value = LS.get('novelTone','');
        $('#worldRealm').value = LS.get('worldRealm','');
        $('#worldMap').value = LS.get('worldMap','');
        $('#worldRules').value = LS.get('worldRules','');
        $('#outlineMaster').value = LS.get('outlineMaster','');
        $('#outlineVolume').value = LS.get('outlineVolume','');
        $('#outlineChapter').value = LS.get('outlineChapter','');
        $('#apiUrlInput').value = LS.get('apiUrl','https://api.deepseek.com/v1');
        $('#modelNameInput').value = LS.get('modelName','deepseek-v4-pro');
        $('#apiKeyInput').value = LS.get('apiKey','');
        $('#stylePreset').value = LS.get('stylePreset','chendong');
        $('#styleTone').value = LS.get('styleTone','');
        updateMemoryStatus();
    }

    function updateMemoryStatus() {
        const slices = LS.get('memorySlices', []);
        const el = $('#memStatus');
        if(el) el.textContent = slices.length ? `已存储 ${slices.length} 个记忆片段` : '暂无记忆数据';
    }

    // ===================== 总控台 =====================
    $('#saveDashboard').addEventListener('click', () => {
        LS.set('novelTitle', $('#novelTitle').value);
        LS.set('novelGenre', $('#novelGenre').value);
        LS.set('novelWorldIntro', $('#novelWorldIntro').value);
        LS.set('novelTone', $('#novelTone').value);
        Toast.show('已保存');
    });

    // ===================== 人设库 =====================
    let currentCharId = null;
    function renderCharList() {
        const chars = LS.get('characters', []);
        $('#charList').innerHTML = chars.map((c,i) => `
            <div class="list-item">
                <span><strong>${c.name}</strong> <span class="tag">${c.realm||'未知'}</span></span>
                <div>
                    <button class="btn btn-sm edit-char" data-index="${i}">编辑</button>
                    <button class="btn btn-sm del-char btn-danger" data-index="${i}">删除</button>
                </div>
            </div>
        `).join('');
        $$('.edit-char').forEach(b => b.onclick = () => {
            const c = LS.get('characters', [])[b.dataset.index]; currentCharId = b.dataset.index;
            $('#charName').value=c.name; $('#charAlias').value=c.alias; $('#charPersonality').value=c.personality;
            $('#charRealm').value=c.realm; $('#charCatchphrase').value=c.catchphrase;
            $('#charWeakness').value=c.weakness; $('#charRelations').value=c.relations;
            $('#charEditor').classList.remove('hide');
        });
        $$('.del-char').forEach(b => b.onclick = () => {
            if(!confirm('确定删除？')) return;
            let chars = LS.get('characters', []); chars.splice(b.dataset.index, 1);
            LS.set('characters', chars); renderCharList();
        });
    }
    renderCharList();
    $('#addChar').addEventListener('click', () => {
        currentCharId = null;
        ['charName','charAlias','charPersonality','charRealm','charCatchphrase','charWeakness','charRelations'].forEach(id => $('#'+id).value='');
        $('#charEditor').classList.remove('hide');
    });
    $('#saveChar').addEventListener('click', () => {
        const name = $('#charName').value.trim(); if(!name) return Toast.show('请输入角色名');
        const obj = { name, alias:$('#charAlias').value, personality:$('#charPersonality').value, realm:$('#charRealm').value, catchphrase:$('#charCatchphrase').value, weakness:$('#charWeakness').value, relations:$('#charRelations').value };
        let chars = LS.get('characters', []);
        if(currentCharId !== null) chars[currentCharId] = obj; else chars.push(obj);
        LS.set('characters', chars);
        $('#charEditor').classList.add('hide');
        renderCharList();
        Toast.show('角色已保存');
    });

    // ===================== 世界观 =====================
    $('#saveWorld').addEventListener('click', () => {
        LS.set('worldRealm', $('#worldRealm').value);
        LS.set('worldMap', $('#worldMap').value);
        LS.set('worldRules', $('#worldRules').value);
        Toast.show('已保存');
    });

    // ===================== 三层大纲 =====================
    $('#saveOutline').addEventListener('click', () => {
        LS.set('outlineMaster', $('#outlineMaster').value);
        LS.set('outlineVolume', $('#outlineVolume').value);
        LS.set('outlineChapter', $('#outlineChapter').value);
        Toast.show('已保存');
    });

    // ===================== 章节管理 =====================
    function renderChapterList() {
        const vols = LS.get('volumes', []); const chs = LS.get('chapters', []);
        let html = '';
        vols.forEach(vol => {
            html += `<div class="card"><div class="card-header"><span>📁 ${vol.name}</span><div><button class="btn btn-sm rename-vol" data-id="${vol.id}">重命名</button><button class="btn btn-sm del-vol btn-danger" data-id="${vol.id}">删除</button></div></div>`;
            const volChapters = chs.filter(c => c.volumeId === vol.id);
            volChapters.forEach((ch, idx) => {
                html += `<div class="list-item"><span>${ch.title} <span class="tag">${countWords(ch.content||'')}字</span></span><div>
                    <button class="btn btn-sm move-up" data-id="${ch.id}" ${idx===0?'disabled':''}>↑</button>
                    <button class="btn btn-sm move-down" data-id="${ch.id}" ${idx===volChapters.length-1?'disabled':''}>↓</button>
                    <button class="btn btn-sm rename-ch" data-id="${ch.id}">重命名</button>
                    <button class="btn btn-sm del-ch btn-danger" data-id="${ch.id}">删除</button></div></div>`;
            });
            html += `<button class="btn btn-sm add-ch" data-vol="${vol.id}" style="margin-left:20px;">+ 添加章节</button></div>`;
        });
        $('#volumeList').innerHTML = html || '暂无分卷，请新建';
        bindChapterEvents();
    }
    function bindChapterEvents() {
        $$('.rename-vol').forEach(b => b.onclick = () => { const vols = LS.get('volumes', []); const vol = vols.find(v => v.id === b.dataset.id); const n = prompt('新名称', vol?.name); if(n) { vol.name = n; LS.set('volumes', vols); renderChapterList(); } });
        $$('.del-vol').forEach(b => b.onclick = () => { if(!confirm('删除分卷会同时删除章节？')) return; let vols = LS.get('volumes', []); vols = vols.filter(v => v.id !== b.dataset.id); LS.set('volumes', vols); LS.set('chapters', LS.get('chapters', []).filter(c => c.volumeId !== b.dataset.id)); renderChapterList(); });
        $$('.add-ch').forEach(b => b.onclick = () => { const t = prompt('章节标题'); if(!t) return; let chs = LS.get('chapters', []); chs.push({id: Date.now().toString(), title:t, volumeId: b.dataset.vol, content:''}); LS.set('chapters', chs); renderChapterList(); });
        $$('.move-up').forEach(b => b.onclick = () => { let chs = LS.get('chapters', []); const ch = chs.find(c => c.id === b.dataset.id); if(!ch) return; const siblings = chs.filter(c => c.volumeId === ch.volumeId); const idx = siblings.findIndex(c => c.id === ch.id); if(idx > 0) { [siblings[idx], siblings[idx-1]] = [siblings[idx-1], siblings[idx]]; LS.set('chapters', [...chs.filter(c => c.volumeId !== ch.volumeId), ...siblings]); renderChapterList(); } });
        $$('.move-down').forEach(b => b.onclick = () => { let chs = LS.get('chapters', []); const ch = chs.find(c => c.id === b.dataset.id); if(!ch) return; const siblings = chs.filter(c => c.volumeId === ch.volumeId); const idx = siblings.findIndex(c => c.id === ch.id); if(idx < siblings.length-1) { [siblings[idx], siblings[idx+1]] = [siblings[idx+1], siblings[idx]]; LS.set('chapters', [...chs.filter(c => c.volumeId !== ch.volumeId), ...siblings]); renderChapterList(); } });
        $$('.rename-ch').forEach(b => b.onclick = () => { let chs = LS.get('chapters', []); const ch = chs.find(c => c.id === b.dataset.id); if(!ch) return; const t = prompt('新标题', ch.title); if(t) { ch.title = t; LS.set('chapters', chs); renderChapterList(); } });
        $$('.del-ch').forEach(b => b.onclick = () => { if(!confirm('删除该章节？')) return; LS.set('chapters', LS.get('chapters', []).filter(c => c.id !== b.dataset.id)); renderChapterList(); });
    }
    renderChapterList();
    $('#addVolume').addEventListener('click', () => { const n = prompt('分卷名称'); if(!n) return; let vols = LS.get('volumes', []); vols.push({id: Date.now().toString(), name:n}); LS.set('volumes', vols); renderChapterList(); });
    $('#exportTxt').addEventListener('click', () => {
        const vols = LS.get('volumes', []); const chs = LS.get('chapters', []); let txt = '';
        vols.forEach(vol => { txt += `\n=== ${vol.name} ===\n`; chs.filter(c => c.volumeId === vol.id).forEach(c => txt += `## ${c.title}\n\n${c.content}\n\n`); });
        const blob = new Blob(['\uFEFF'+txt], {type:'text/plain;charset=utf-8'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '小说全文.txt'; a.click();
        Toast.show('导出成功');
    });

    // ===================== 记忆库 =====================
    $('#parseBtn').addEventListener('click', () => {
        const text = $('#fullTextInput').value.trim(); if(!text) return Toast.show('请粘贴正文');
        let slices = []; for(let i=0; i<text.length && slices.length<20; i+=15000) slices.push(text.slice(i, i+15000));
        LS.set('memorySlices', slices); updateMemoryStatus(); Toast.show(`分片完成，共${slices.length}片段`);
    });
    $('#clearMemoryBtn').addEventListener('click', () => {
        if(confirm('清空？')) { LS.set('memorySlices', []); $('#fullTextInput').value=''; updateMemoryStatus(); Toast.show('已清空'); }
    });

    // ===================== 写作引擎 =====================
    let generating = false;
    let abortController = null;
    const gi = () => ({ url: $('#apiUrlInput').value.trim(), key: $('#apiKeyInput').value.trim(), model: $('#modelNameInput').value.trim() });
    const buildSys = (wt) => {
        const slices = LS.get('memorySlices', []); const outl = $('#writeOutline').value.trim();
        const kws = outl.split(/[，。\s]+/).filter(k => k.length>=2);
        let rel = []; slices.forEach(s => { let sc=0; kws.forEach(k => { if(s.includes(k)) sc++; }); if(sc>0) rel.push({text:s, score:sc}); });
        rel.sort((a,b)=>b.score-a.score); rel = rel.slice(0,4).map(r=>r.text);
        $('#recallResult').textContent = rel.join('\n\n') || '无关联记忆';
        const wR = LS.get('worldRealm',''), chs = LS.get('characters',[]);
        const cd = chs.map(c => `${c.name}:${c.personality},${c.realm}`).join('；');
        const hk = $('#hookInput').value ? `；${$('#hookInput').value}` : '';
        return `网文作家。${wR ? '世界观：'+wR : ''} 角色：${cd} 前文记忆：${rel.join(' ')} 续写正文，严格将正文字数控制在${wt}字左右，直接输出正文。${hk}`;
    };
    const startNormal = async () => {
        if(generating) return; const outl = $('#writeOutline').value.trim(); if(!outl) return Toast.show('请输入章纲');
        generating = true; $('#genBtn').disabled = true; $('#deepCheckBtn').disabled = true; $('#stopBtn').classList.remove('hide');
        abortController = new AbortController();
        try {
            const {url, key, model} = gi(); if(!key) throw new Error('未设置API密钥');
            const wt = parseInt($('#wordTarget').value)||2000;
            const content = await callAi(url, key, model, buildSys(wt), outl, Math.min(Math.ceil(wt*2.2),8000), abortController.signal);
            $('#resultArea').value = content;
            Toast.show(`生成完成，字数：${countWords(content)}`);
        } catch(e) { if(e.message.includes('取消')||e.name==='AbortError') Toast.show('已取消'); else Toast.show('失败：'+e.message); }
        finally { generating = false; $('#genBtn').disabled = false; $('#deepCheckBtn').disabled = false; $('#stopBtn').classList.add('hide'); abortController = null; }
    };
    $('#genBtn').addEventListener('click', () => { clearTimeout(window._gt); window._gt = setTimeout(startNormal, 300); });

    // 自评与过检
    const selfEval = async (txt) => {
        const {url, key, model} = gi(); if(!key) throw new Error('未设置API密钥');
        const s = await callAi(url, key, model, 'AI检测专家。分析文本的“AI痕迹”，从0到100打分。0=完全像人，100=明显AI。只回复数字。', txt, 50);
        const sc = parseInt(s); return isNaN(sc) ? 50 : Math.min(100, Math.max(0, sc));
    };
    const ultimateRewrite = async (txt) => {
        const {url, key, model} = gi();
        return await callAi(url, key, model, '你是资深文学编辑。润色下文使其像人类作家：拆散重组句式；注入口语词和不完美细节；加入感官描写；禁用套话。不改变情节。直接输出全文。', txt, 8000, abortController?.signal);
    };
    const startDeep = async () => {
        if(generating) return; const outl = $('#writeOutline').value.trim(); if(!outl) return Toast.show('请输入章纲');
        generating = true; $('#deepCheckBtn').disabled = true; $('#genBtn').disabled = true; $('#stopBtn').classList.remove('hide');
        abortController = new AbortController();
        $('#checkReport').textContent = '⏳ 生成初稿...';
        try {
            const {url, key, model} = gi(); if(!key) throw new Error('未设置API密钥');
            const wt = parseInt($('#wordTarget').value)||2000;
            let cur = await callAi(url, key, model, buildSys(wt), outl, Math.min(Math.ceil(wt*2.2),8000), abortController.signal);
            let log = `📝 初稿字数：${countWords(cur)}\n`;
            for(let i=1; i<=5; i++) {
                const sc = await selfEval(cur); log += `🔍 第${i}轮自评：AI嫌疑分 ${sc}/100\n`;
                if(sc === 0) { log += '✅ 已达标。'; break; }
                if(i < 5) { log += '🔄 正在进行终极润色...\n'; await new Promise(r => setTimeout(r, 500)); cur = await ultimateRewrite(cur); }
                else log += '⚠️ 已达最大轮次。';
            }
            $('#checkReport').textContent = log;
            $('#resultArea').value = cur;
            Toast.show(`过检完成，字数：${countWords(cur)}`);
        } catch(e) { if(e.message.includes('取消')||e.name==='AbortError') Toast.show('已取消'); else Toast.show('失败：'+e.message); }
        finally { generating = false; $('#deepCheckBtn').disabled = false; $('#genBtn').disabled = false; $('#stopBtn').classList.add('hide'); abortController = null; }
    };
    $('#deepCheckBtn').addEventListener('click', () => { clearTimeout(window._gt); window._gt = setTimeout(startDeep, 300); });
    $('#stopBtn').addEventListener('click', () => { if(abortController) abortController.abort(); });
    $('#adoptBtn').addEventListener('click', () => {
        const content = $('#resultArea').value.trim(); if(!content) return Toast.show('请先生成');
        let chs = LS.get('chapters', []); if(!chs.length) { LS.set('volumes', [{id:'v1', name:'默认卷'}]); chs.push({id:'c1', title:'第1章', volumeId:'v1', content:''}); }
        chs[0].content += '\n' + content; LS.set('chapters', chs); Toast.show('已追加到第1章');
    });
    ['apiUrlInput','modelNameInput','apiKeyInput'].forEach(id => $('#'+id).addEventListener('input', e => LS.set(id.replace('Input',''), e.target.value)));

    // ===================== 校验、风格、备份 =====================
    $('#runCheck').addEventListener('click', () => { $('#checkResult').textContent = '✅ 基础检查通过，请人工复核。'; });
    $('#saveStyle').addEventListener('click', () => { LS.set('stylePreset', $('#stylePreset').value); LS.set('styleTone', $('#styleTone').value); Toast.show('已保存'); });
    $('#exportBackup').addEventListener('click', () => {
        const backup = {}; for(let i=0; i<localStorage.length; i++) backup[localStorage.key(i)] = LS.get(localStorage.key(i));
        const blob = new Blob([JSON.stringify(backup)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '写作中枢备份.json'; a.click();
        Toast.show('已导出');
    });
    $('#importBackup').addEventListener('click', () => $('#importFile').click());
    $('#importFile').addEventListener('change', e => {
        const file = e.target.files[0]; if(!file) return; const reader = new FileReader();
        reader.onload = ev => { try { const d = JSON.parse(ev.target.result); localStorage.clear(); Object.entries(d).forEach(([k,v]) => LS.set(k,v)); Toast.show('恢复成功，请刷新'); } catch(ex) { Toast.show('格式错误'); } };
        reader.readAsText(file);
    });

    // 启动
    loadAllSettings();
    Toast.show('创作中枢已启动');
</script>
</body>
</html>
