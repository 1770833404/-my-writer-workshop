<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI小说生成器 · 无跨域版（300万字记忆）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #12141d;
            color: #e5e7eb;
            padding: 15px;
            font-family: system-ui, "微软雅黑", sans-serif;
        }
        .wrap {
            max-width: 1300px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #60a5fa;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .card {
            background: #1f2937;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            height: 130px;
            background: #111827;
            border: 1px solid #374151;
            color: #f3f4f6;
            padding: 12px;
            border-radius: 6px;
            resize: none;
            margin: 8px 0;
            font-size: 15px;
            line-height: 1.6;
        }
        .btn {
            padding: 9px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            background: #2563eb;
            color: #fff;
            font-size: 14px;
        }
        .btn:hover {
            background: #1d4ed8;
        }
        .btn.danger {
            background: #dc2626;
        }
        .btn.danger:hover {
            background: #b91c1c;
        }
        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 10px 0;
            align-items: center;
        }
        select, input {
            padding: 8px;
            background: #111827;
            color: #fff;
            border: 1px solid #374151;
            border-radius: 5px;
            font-size: 14px;
        }
        #res {
            min-height: 320px;
            white-space: pre-wrap;
            line-height: 1.8;
            padding: 15px;
            background: #111827;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 15px;
        }
        .tip {
            color: #9ca3af;
            font-size: 14px;
            margin: 8px 0;
        }
        .progress {
            color: #60a5fa;
            margin-top: 10px;
        }
        .error {
            color: #ef4444;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>AI小说生成器 · 无跨域版（300万字记忆）</h1>

    <div class="card">
        <div class="tip">📌 已修复跨域问题，支持DeepSeek直接调用，手机/电脑都能用</div>
        <div class="row">
            <input type="text" id="apiKey" placeholder="输入你的DeepSeek API Key" style="flex: 2;" value="sk-8823c667a7f44014bcd192c">
            <input type="text" id="apiUrl" placeholder="API地址" style="flex: 3;" value="https://api.deepseek.com/v1/chat/completions">
            <select id="modelSel">
                <option value="deepseek-chat" selected>deepseek-chat</option>
                <option value="deepseek-coder">deepseek-coder</option>
            </select>
        </div>
        <textarea id="userInput" placeholder="输入当前剧情、续写指令..." style="height:150px;">知情？”林雪晴声音平静得刺骨：“云墨，仙凡有别。这不是退婚，是放你一条生路。”云墨惨淡一笑，没有争辩。入夜，他孤身离了祠堂，在冷月下砸向院中枯死古槐，指节鲜血淋漓。胸口的黑色戒指，就在这一刻骤然发烫。</textarea>
        <div class="row">
            <select id="styleSel">
                <option value="玄幻爽文" selected>玄幻爽文（节奏快、爽点足）</option>
                <option value="仙侠古风">仙侠古风（典雅、意境足）</option>
                <option value="cold">冷笔白描（无情绪词、纯叙事）</option>
                <option value="city">都市玄幻（现代+修行结合）</option>
            </select>
            <input type="number" id="wordNum" value="2000" placeholder="生成字数">
            <button class="btn" onclick="genNovel()">生成章节</button>
            <button class="btn" onclick="saveMemory()">保存记忆</button>
            <button class="btn danger" onclick="clearMemory()">清空记忆</button>
        </div>
        <div class="progress" id="progress"></div>
    </div>

    <div class="card">
        <h3>生成内容</h3>
        <div id="res"></div>
    </div>
</div>

<script>
const MAX_MEMORY_WORDS = 3000000;
let novelMemory = localStorage.getItem('novel300wMem') || '';

const stylePrompts = {
    '玄幻爽文': '你是资深玄幻爽文作家，节奏要快，冲突要足，主角要有逆袭爽点，不要拖沓，结尾留好下一章钩子。',
    '仙侠古风': '你是仙侠古风作家，文字要典雅，有仙风道骨的意境，用词凝练，符合古风语境，不要现代词汇。',
    'cold': '你是用冷笔白描写作的作家，禁用所有情绪形容词，只用陈述句客观叙事，不做任何心理描写，只写动作、场景、对话。',
    'city': '你是都市玄幻作家，要结合现代都市生活和修行元素，场景真实，设定不违和，冲突要自然。'
};

// 跨域兼容版请求
async function genNovel() {
    const input = document.getElementById('userInput').value.trim();
    const style = document.getElementById('styleSel').value;
    const wordNum = parseInt(document.getElementById('wordNum').value) || 2000;
    const apiKey = document.getElementById('apiKey').value.trim();
    const apiUrl = document.getElementById('apiUrl').value.trim();
    const model = document.getElementById('modelSel').value;
    const resDom = document.getElementById('res');
    const progressDom = document.getElementById('progress');

    if (!input || !apiKey || !apiUrl) {
        resDom.innerText = '⚠️ 请填写完整的API Key、地址和续写指令！';
        return;
    }

    resDom.innerText = '';
    progressDom.innerText = '正在生成中...';

    const prompt = buildFullPrompt(input, style, wordNum);

    try {
        // 用CORS代理绕过跨域限制
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`;
        
        const response = await fetch(proxyUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
                model: model,
                messages: [{ role: 'user', content: prompt }],
                max_tokens: Math.ceil(wordNum * 2),
                temperature: 0.7
            })
        });

        if (!response.ok) {
            throw new Error(`请求失败：${response.status}`);
        }

        const data = await response.json();
        const novelContent = data.choices[0].message.content;

        novelMemory += `\n\n--- 新章节 ---\n${novelContent}`;
        if (novelMemory.length > MAX_MEMORY_WORDS) {
            novelMemory = novelMemory.slice(-MAX_MEMORY_WORDS);
        }
        localStorage.setItem('novel300wMem', novelMemory);

        resDom.innerText = novelContent;
        progressDom.innerText = `✅ 生成完成，当前记忆字数：${novelMemory.length}`;

    } catch (error) {
        progressDom.innerText = '❌ 生成失败';
        resDom.className = 'error';
        resDom.innerText = `错误原因：${error.message}\n如果持续报错，请检查API Key是否有效，或尝试用电脑浏览器打开。`;
    }
}

function buildFullPrompt(userInput, style, wordNum) {
    const styleRule = stylePrompts[style];
    const memory = novelMemory.length > 50000 
        ? novelMemory.slice(0, 15000) + '\n...（中间剧情省略）...\n' + novelMemory.slice(-30000)
        : novelMemory;

    return `你正在续写一部长篇小说，必须严格遵守以下规则：
1. 严格承接前文剧情，人设、世界观、伏笔保持一致，不OOC；
2. 禁用重复句子、模板化内容，剧情连贯；
3. 字数控制在${wordNum}字左右，结尾留好下一章钩子；
4. 风格要求：${styleRule}

已有的剧情记忆：
${memory}

当前续写指令：
${userInput}

请直接输出小说内容，不要额外解释。`;
}

function saveMemory() {
    localStorage.setItem('novel300wMem', novelMemory);
    alert('✅ 记忆已保存！');
}

function clearMemory() {
    if (confirm('确定清空全部记忆？不可恢复！')) {
        novelMemory = '';
        localStorage.removeItem('novel300wMem');
        document.getElementById('res').innerText = '';
        document.getElementById('progress').innerText = '';
        alert('✅ 记忆已清空！');
    }
}
</script>
</body>
</html>
