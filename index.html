<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>网文创作中枢 · 全功能深度过检版</title>
    <style>
        :root {
            --bg: #0f0d0a; --panel: #1c1610; --text: #d4be8c; --accent: #c0843a;
            --accent2: #e6a34c; --border: #3d2b18; --editor: #2c2218; --radius: 12px;
            --font: 'PingFang SC', 'Noto Serif SC', 'KaiTi', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); height:100vh; display:flex; overflow:hidden; }
        .sidebar { width:240px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
        .sidebar h3 { padding:18px 14px; color:var(--accent2); text-align:center; border-bottom:1px solid var(--border); margin:0; }
        .tab-list { flex:1; overflow-y:auto; padding:8px; }
        .tab-btn { display:block; width:100%; text-align:left; background:transparent; border:1px solid transparent; color:var(--text); padding:12px; margin-bottom:2px; border-radius:8px; font-size:0.9rem; cursor:pointer; transition:0.2s; }
        .tab-btn:hover, .tab-btn.active { background:var(--editor); border-color:var(--accent); color:var(--accent2); }
        .main-area { flex:1; padding:20px 24px; overflow-y:auto; display:flex; flex-direction:column; gap:16px; }
        .panel { display:none; flex-direction:column; gap:14px; }
        .panel.active { display:flex; }
        h3 { color:var(--accent2); font-size:1.3rem; border-bottom:1px solid var(--border); padding-bottom:8px; margin:0; }
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .field { display:flex; flex-direction:column; gap:4px; }
        label { font-size:0.8rem; color:var(--accent); font-weight:600; }
        input, textarea, select { background:var(--editor); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px; font-size:0.9rem; font-family:var(--font); outline:none; }
        textarea { min-height:80px; resize:vertical; }
        .btn { background:var(--accent); color:white; border:none; padding:10px 18px; border-radius:20px; cursor:pointer; font-weight:bold; align-self:flex-start; }
        .btn:disabled { opacity:0.6; pointer-events:none; }
        .btn-sm { padding:6px 12px; font-size:0.8rem; border-radius:14px; }
        .card { background:var(--editor); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; }
        .list-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:var(--editor); border-radius:8px; margin-bottom:6px; }
        .tag { background:var(--accent); color:white; padding:2px 10px; border-radius:12px; font-size:0.7rem; }
        .memory-box { background:#1a1410; border:1px solid var(--border); border-radius:var(--radius); padding:12px; max-height:220px; overflow-y:auto; white-space:pre-wrap; font-size:0.85rem; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#2f2416; color:#ffcf8a; padding:8px 20px; border-radius:20px; z-index:999; opacity:0; transition:0.3s; }
        .toast.show { opacity:1; }
        .btn-danger { background:#a05a3a; }
        .hint { font-size:0.7rem; color:#8a7958; margin-top:-8px; }
        @media (max-width:768px) { .sidebar { width:200px; } .grid-2 { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div class="sidebar">
    <h3>📖 创作中枢</h3>
    <div class="tab-list" id="tabList"></div>
</div>
<div class="main-area" id="mainArea"></div>
<div class="toast" id="toast"></div>

<script>
    // ========== localStorage 封装 ==========
    const LS = {
        get(key, fallback = null) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e) { return fallback; } },
        set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch(e) { return false; } }
    };

    // ========== 工具函数 ==========
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);
    const Toast = { show(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), 2000); } };
    const countWords = t => t.replace(/\s/g,'').length;
    const tabs = [
        {id:'dashboard', label:'🏠 总控台'}, {id:'characters', label:'👤 人设库'}, {id:'world', label:'🌍 世界观'},
        {id:'outline', label:'📋 三层大纲'}, {id:'chapters', label:'📚 章节管理'}, {id:'memory', label:'🧠 记忆库'},
        {id:'write', label:'✍️ 写作'}, {id:'check', label:'🔍 逻辑校验'}, {id:'style', label:'🎨 风格定制'},
        {id:'backup', label:'💾 备份导入'}
    ];

    function renderSidebar() {
        const list = $('#tabList');
        list.innerHTML = tabs.map(t => `<button class="tab-btn" data-tab="${t.id}">${t.label}</button>`).join('');
        list.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', e => switchTab(e.target.dataset.tab)));
    }

    function switchTab(tabId) {
        $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
        const main = $('#mainArea');
        main.innerHTML = '';
        const panel = document.createElement('div'); panel.className='panel active'; panel.id='panel-'+tabId;
        main.appendChild(panel);
        renderPanel(tabId, panel);
    }

    function renderPanel(tabId, panel) {
        switch(tabId) {
            case 'dashboard': renderDashboard(panel); break;
            case 'characters': renderCharacters(panel); break;
            case 'world': renderWorld(panel); break;
            case 'outline': renderOutline(panel); break;
            case 'chapters': renderChapters(panel); break;
            case 'memory': renderMemory(panel); break;
            case 'write': renderWrite(panel); break;
            case 'check': renderCheck(panel); break;
            case 'style': renderStyle(panel); break;
            case 'backup': renderBackup(panel); break;
        }
    }

    // ========== 通用 API 调用 ==========
    async function callAi(apiUrl, apiKey, model, systemMsg, userMsg, maxTokens = 6000) {
        const controller = new AbortController();
        const res = await fetch(`${apiUrl}/chat/completions`, {
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiKey}`},
            signal: controller.signal,
            body: JSON.stringify({model, messages:[{role:'system',content:systemMsg},{role:'user',content:userMsg}], temperature:0.85, max_tokens:maxTokens})
        });
        if(!res.ok) throw new Error(`请求失败(${res.status})`);
        const data = await res.json();
        return data.choices?.[0]?.message?.content || '';
    }

    // ========== 1️⃣ 总控台 ==========
    function renderDashboard(panel) {
        panel.innerHTML = `
            <h3>🏠 小说基础信息</h3>
            <div class="grid-2">
                <div class="field"><label>小说名称</label><input id="novelTitle"></div>
                <div class="field"><label>类型/流派</label><input id="novelGenre"></div>
            </div>
            <div class="field"><label>世界观简介</label><textarea id="novelWorldIntro"></textarea></div>
            <div class="field"><label>故事基调/读者定位</label><input id="novelTone"></div>
            <button class="btn" id="saveDashboard">💾 保存</button>
        `;
        $('#novelTitle').value = LS.get('novelTitle','');
        $('#novelGenre').value = LS.get('novelGenre','');
        $('#novelWorldIntro').value = LS.get('novelWorldIntro','');
        $('#novelTone').value = LS.get('novelTone','');
        $('#saveDashboard').onclick = () => {
            LS.set('novelTitle', $('#novelTitle').value);
            LS.set('novelGenre', $('#novelGenre').value);
            LS.set('novelWorldIntro', $('#novelWorldIntro').value);
            LS.set('novelTone', $('#novelTone').value);
            Toast.show('已保存');
        };
    }

    // ========== 2️⃣ 人设库 ==========
    function renderCharacters(panel) {
        panel.innerHTML = `
            <h3>👤 人设库</h3>
            <div id="charList"></div>
            <button class="btn btn-sm" id="addChar">+ 新建角色</button>
            <div class="card hide" id="charEditor">
                <div class="grid-2">
                    <div class="field"><label>全名</label><input id="charName"></div>
                    <div class="field"><label>别名</label><input id="charAlias"></div>
                </div>
                <div class="field"><label>性格</label><input id="charPersonality"></div>
                <div class="field"><label>境界</label><input id="charRealm"></div>
                <div class="field"><label>口头禅</label><input id="charCatchphrase"></div>
                <div class="field"><label>弱点/禁忌</label><input id="charWeakness"></div>
                <div class="field"><label>关系网</label><textarea id="charRelations"></textarea></div>
                <button class="btn" id="saveChar">保存角色</button>
            </div>
        `;
        let currentId = null;
        const refresh = () => {
            const chars = LS.get('characters', []);
            $('#charList').innerHTML = chars.map((c,i) => `
                <div class="list-item">
                    <span><strong>${c.name}</strong> <span class="tag">${c.realm||'未知'}</span></span>
                    <div>
                        <button class="btn btn-sm edit-char" data-index="${i}">编辑</button>
                        <button class="btn btn-sm del-char btn-danger" data-index="${i}">删除</button>
                    </div>
                </div>
            `).join('');
            $$('.edit-char').forEach(b => b.onclick = () => {
                const chars = LS.get('characters', []); const c = chars[b.dataset.index]; currentId = b.dataset.index;
                $('#charName').value = c.name; $('#charAlias').value = c.alias; $('#charPersonality').value = c.personality;
                $('#charRealm').value = c.realm; $('#charCatchphrase').value = c.catchphrase;
                $('#charWeakness').value = c.weakness; $('#charRelations').value = c.relations;
                $('#charEditor').classList.remove('hide');
            });
            $$('.del-char').forEach(b => b.onclick = () => {
                if(!confirm('确定删除？')) return;
                let chars = LS.get('characters', []); chars.splice(b.dataset.index, 1);
                LS.set('characters', chars); refresh();
            });
        };
        refresh();
        $('#addChar').onclick = () => {
            currentId = null;
            ['charName','charAlias','charPersonality','charRealm','charCatchphrase','charWeakness','charRelations'].forEach(id => $('#'+id).value = '');
            $('#charEditor').classList.remove('hide');
        };
        $('#saveChar').onclick = () => {
            const name = $('#charName').value.trim(); if(!name) return Toast.show('请输入角色名');
            const obj = { name, alias:$('#charAlias').value, personality:$('#charPersonality').value, realm:$('#charRealm').value, catchphrase:$('#charCatchphrase').value, weakness:$('#charWeakness').value, relations:$('#charRelations').value };
            let chars = LS.get('characters', []);
            if(currentId !== null) chars[currentId] = obj; else chars.push(obj);
            LS.set('characters', chars); $('#charEditor').classList.add('hide'); refresh(); Toast.show('角色已保存');
        };
    }

    // ========== 3️⃣ 世界观 ==========
    function renderWorld(panel) {
        panel.innerHTML = `
            <h3>🌍 世界观规则</h3>
            <div class="field"><label>修炼体系</label><textarea id="worldRealm"></textarea></div>
            <div class="field"><label>势力分布</label><textarea id="worldMap"></textarea></div>
            <div class="field"><label>世界铁律</label><textarea id="worldRules"></textarea></div>
            <button class="btn" id="saveWorld">💾 保存</button>
        `;
        $('#worldRealm').value = LS.get('worldRealm',''); $('#worldMap').value = LS.get('worldMap',''); $('#worldRules').value = LS.get('worldRules','');
        $('#saveWorld').onclick = () => {
            LS.set('worldRealm', $('#worldRealm').value); LS.set('worldMap', $('#worldMap').value); LS.set('worldRules', $('#worldRules').value);
            Toast.show('已保存');
        };
    }

    // ========== 4️⃣ 三层大纲 ==========
    function renderOutline(panel) {
        panel.innerHTML = `
            <h3>📋 三层大纲</h3>
            <div class="field"><label>总纲</label><textarea id="outlineMaster"></textarea></div>
            <div class="field"><label>卷纲</label><textarea id="outlineVolume"></textarea></div>
            <div class="field"><label>章纲</label><textarea id="outlineChapter"></textarea></div>
            <button class="btn" id="saveOutline">💾 保存</button>
        `;
        $('#outlineMaster').value = LS.get('outlineMaster',''); $('#outlineVolume').value = LS.get('outlineVolume',''); $('#outlineChapter').value = LS.get('outlineChapter','');
        $('#saveOutline').onclick = () => {
            LS.set('outlineMaster', $('#outlineMaster').value); LS.set('outlineVolume', $('#outlineVolume').value); LS.set('outlineChapter', $('#outlineChapter').value);
            Toast.show('已保存');
        };
    }

    // ========== 5️⃣ 章节管理 ==========
    function renderChapters(panel) {
        panel.innerHTML = `
            <h3>📚 分卷与章节</h3>
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <button class="btn btn-sm" id="addVolume">+ 新建分卷</button>
                <button class="btn btn-sm" id="exportTxt">📤 导出全书TXT</button>
            </div>
            <div id="volumeList"></div>
        `;
        const refresh = () => {
            const vols = LS.get('volumes', []); const chs = LS.get('chapters', []);
            let html = '';
            vols.forEach(vol => {
                html += `<div class="card"><div class="card-header"><span>📁 ${vol.name}</span><div>
                    <button class="btn btn-sm rename-vol" data-id="${vol.id}">重命名</button>
                    <button class="btn btn-sm del-vol btn-danger" data-id="${vol.id}">删除</button>
                </div></div>`;
                const volChs = chs.filter(c => c.volumeId === vol.id);
                volChs.forEach((ch, idx) => {
                    html += `<div class="list-item"><span>${ch.title} <span class="tag">${countWords(ch.content||'')}字</span></span><div>
                        <button class="btn btn-sm move-up" data-id="${ch.id}" ${idx===0?'disabled':''}>↑</button>
                        <button class="btn btn-sm move-down" data-id="${ch.id}" ${idx===volChs.length-1?'disabled':''}>↓</button>
                        <button class="btn btn-sm rename-ch" data-id="${ch.id}">重命名</button>
                        <button class="btn btn-sm del-ch btn-danger" data-id="${ch.id}">删除</button>
                    </div></div>`;
                });
                html += `<button class="btn btn-sm add-ch" data-vol="${vol.id}" style="margin-left:20px;">+ 添加章节</button></div>`;
            });
            $('#volumeList').innerHTML = html || '暂无分卷，请新建';
            // 事件绑定
            $$('.rename-vol').forEach(b => b.onclick = () => {
                const vols = LS.get('volumes', []); const vol = vols.find(v => v.id === b.dataset.id);
                const newName = prompt('新名称', vol?.name); if(newName) { vol.name = newName; LS.set('volumes', vols); refresh(); }
            });
            $$('.del-vol').forEach(b => b.onclick = () => {
                if(!confirm('删除分卷会同时删除其中所有章节，确定？')) return;
                let vols = LS.get('volumes', []); vols = vols.filter(v => v.id !== b.dataset.id); LS.set('volumes', vols);
                let chs = LS.get('chapters', []); chs = chs.filter(c => c.volumeId !== b.dataset.id); LS.set('chapters', chs);
                refresh();
            });
            $$('.add-ch').forEach(b => b.onclick = () => {
                const title = prompt('章节标题'); if(!title) return;
                let chs = LS.get('chapters', []); chs.push({id: Date.now().toString(), title, volumeId: b.dataset.vol, content: ''});
                LS.set('chapters', chs); refresh();
            });
            $$('.move-up').forEach(b => b.onclick = () => {
                let chs = LS.get('chapters', []); const ch = chs.find(c => c.id === b.dataset.id); if(!ch) return;
                const siblings = chs.filter(c => c.volumeId === ch.volumeId); const idx = siblings.findIndex(c => c.id === ch.id);
                if(idx > 0) { [siblings[idx], siblings[idx-1]] = [siblings[idx-1], siblings[idx]]; const other = chs.filter(c => c.volumeId !== ch.volumeId); LS.set('chapters', [...other, ...siblings]); refresh(); }
            });
            $$('.move-down').forEach(b => b.onclick = () => {
                let chs = LS.get('chapters', []); const ch = chs.find(c => c.id === b.dataset.id); if(!ch) return;
                const siblings = chs.filter(c => c.volumeId === ch.volumeId); const idx = siblings.findIndex(c => c.id === ch.id);
                if(idx < siblings.length-1) { [siblings[idx], siblings[idx+1]] = [siblings[idx+1], siblings[idx]]; const other = chs.filter(c => c.volumeId !== ch.volumeId); LS.set('chapters', [...other, ...siblings]); refresh(); }
            });
            $$('.rename-ch').forEach(b => b.onclick = () => {
                let chs = LS.get('chapters', []); const ch = chs.find(c => c.id === b.dataset.id); if(!ch) return;
                const newTitle = prompt('新标题', ch.title); if(newTitle) { ch.title = newTitle; LS.set('chapters', chs); refresh(); }
            });
            $$('.del-ch').forEach(b => b.onclick = () => {
                if(!confirm('删除该章节？')) return;
                let chs = LS.get('chapters', []); chs = chs.filter(c => c.id !== b.dataset.id); LS.set('chapters', chs); refresh();
            });
        };
        refresh();
        $('#addVolume').onclick = () => { const name = prompt('分卷名称'); if(!name) return; let vols = LS.get('volumes', []); vols.push({id: Date.now().toString(), name}); LS.set('volumes', vols); refresh(); };
        $('#exportTxt').onclick = () => {
            const vols = LS.get('volumes', []); const chs = LS.get('chapters', []); let txt = '';
            vols.forEach(vol => { txt += `\n=== ${vol.name} ===\n`; chs.filter(c => c.volumeId === vol.id).forEach(c => txt += `## ${c.title}\n\n${c.content}\n\n`); });
            const blob = new Blob(['\uFEFF'+txt], {type:'text/plain;charset=utf-8'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '小说全文.txt'; a.click();
            Toast.show('导出成功');
        };
    }

    // ========== 6️⃣ 记忆库 ==========
    function renderMemory(panel) {
        panel.innerHTML = `
            <h3>🧠 记忆库（轻量分片）</h3>
            <textarea id="fullTextInput" rows="6" placeholder="粘贴整本小说正文..."></textarea>
            <div style="display:flex; gap:10px;">
                <button class="btn" id="parseBtn">🚀 解析并分片存储</button>
                <button class="btn btn-danger" id="clearMemoryBtn">🗑️ 清空记忆</button>
            </div>
            <div id="memStatus" class="memory-box">暂无记忆数据</div>
            <p style="font-size:0.7rem;color:#8a7958;">注：文本将按每段15000字分片，最多保存20个片段。</p>
        `;
        const updateStatus = () => { const slices = LS.get('memorySlices', []); $('#memStatus').textContent = slices.length ? `已存储 ${slices.length} 个记忆片段` : '暂无记忆数据'; };
        updateStatus();
        $('#parseBtn').onclick = () => {
            const text = $('#fullTextInput').value.trim(); if(!text) return Toast.show('请粘贴正文');
            const size = 15000, maxSlices = 20; let slices = [];
            for(let i=0; i<text.length && slices.length < maxSlices; i+=size) slices.push(text.slice(i, i+size));
            LS.set('memorySlices', slices); updateStatus(); Toast.show(`分片完成，共 ${slices.length} 个片段`);
        };
        $('#clearMemoryBtn').onclick = () => { if(!confirm('确定清空所有记忆片段？')) return; LS.set('memorySlices', []); $('#fullTextInput').value = ''; updateStatus(); Toast.show('记忆已清空'); };
    }

    // ========== 7️⃣ 写作（深度过检版） ==========
    function renderWrite(panel) {
        panel.innerHTML = `
            <h3>✍️ 写作引擎（朱雀改写到0）</h3>
            <div class="grid-2">
                <div class="field"><label>API 地址</label><input id="apiUrlInput" placeholder="https://api.deepseek.com/v1"></div>
                <div class="field"><label>模型名称</label><input id="modelNameInput" placeholder="deepseek-v4-pro"></div>
            </div>
            <div class="field"><label>API密钥</label><input type="password" id="apiKeyInput"></div>
            <div class="field"><label>当前章纲</label><textarea id="writeOutline"></textarea></div>
            <div class="grid-2">
                <div class="field"><label>目标字数</label><input id="wordTarget" type="number" value="2000" min="200" max="8000" step="100"><span class="hint">AI将严格控制在±10%范围内</span></div>
                <div class="field"><label>钩子/额外指令</label><input id="hookInput" placeholder="结尾留悬念"></div>
            </div>
            <div class="field"><label>📖 关联记忆（关键词匹配）</label><div class="memory-box" id="recallResult">暂未检索</div></div>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn" id="genBtn">✨ 普通生成</button>
                <button class="btn" id="deepCheckBtn" style="background:#b85e1e;">🔄 深度过检（改写到0）</button>
                <button class="btn btn-danger" id="stopBtn" style="display:none;">⏹️ 取消生成</button>
            </div>
            <textarea id="resultArea" rows="10"></textarea>
            <button class="btn btn-sm" id="adoptBtn">✅ 采纳到章节</button>
            <div class="card">
                <h4 style="color:var(--accent2);margin-bottom:8px;">🛡️ 朱雀过检报告</h4>
                <div id="checkReport" class="memory-box">点击“深度过检”后此处将显示多轮改写过程与最终评分</div>
            </div>
        `;
        $('#apiUrlInput').value = LS.get('apiUrl','https://api.deepseek.com/v1');
        $('#modelNameInput').value = LS.get('modelName','deepseek-v4-pro');
        $('#apiKeyInput').value = LS.get('apiKey','');
        ['apiUrlInput','modelNameInput','apiKeyInput'].forEach(id => { $('#'+id).oninput = e => LS.set(id.replace('Input',''), e.target.value); });

        let abortCtrl = null, generating = false;

        function getApiInfo() {
            return {
                url: $('#apiUrlInput').value.trim(),
                key: $('#apiKeyInput').value.trim(),
                model: $('#modelNameInput').value.trim()
            };
        }

        function buildWriteSys(wordTarget) {
            const slices = LS.get('memorySlices', []); const outline = $('#writeOutline').value.trim();
            const keywords = outline.split(/[，。\s]+/).filter(k => k.length>=2);
            let relevant = []; slices.forEach(s => { let score=0; keywords.forEach(k => { if(s.includes(k)) score++; }); if(score>0) relevant.push({text:s, score}); });
            relevant.sort((a,b)=>b.score-a.score); relevant = relevant.slice(0,4).map(r=>r.text);
            $('#recallResult').textContent = relevant.join('\n\n') || '无关联记忆';
            const worldRealm = LS.get('worldRealm',''); const chars = LS.get('characters',[]);
            let charDesc = chars.map(c => `${c.name}:${c.personality},${c.realm}`).join('；');
            const hook = $('#hookInput').value ? `；${$('#hookInput').value}` : '';
            return `网文作家。${worldRealm ? '世界观：'+worldRealm : ''} 角色：${charDesc} 前文记忆：${relevant.join(' ')} 续写正文，严格将正文字数控制在${wordTarget}字左右（误差不超过±10%），直接输出正文，不解释说明。${hook}`;
        }

        async function selfEvaluate(text) {
            const {url, key, model} = getApiInfo(); if(!key) throw new Error('未设置API密钥');
            const sys = `你是专业的AI文本检测专家。请分析以下文本的“AI生成痕迹”，从0到100打分：
0分：完全像人类写作，充满不规则句式、细腻感官描写、个性化用词。
100分：明显是AI生成，句式工整、用词华丽空洞、缺乏真实细节。
只需回复一个整数分数，不要解释。`;
            const scoreStr = await callAi(url, key, model, sys, text, 50);
            const score = parseInt(scoreStr);
            return isNaN(score) ? 50 : Math.min(100, Math.max(0, score));
        }

        async function rewriteText(text) {
            const {url, key, model} = getApiInfo();
            const sys = `你是专业小说编辑。请改写以下文本，使其完全像人类写作。
要求：
1. 打破规律性句式，长短句随机交错，插入不完整的口语短句。
2. 增加生活化细节、具体感官（温度、气味、触感），减少华丽形容词。
3. 对话更自然，可加入人物小动作、语气词。
4. 避免使用“恐怖如斯”“倒吸一口凉气”“眼中闪过”等AI水词。
5. 保持原情节不变，只优化表达。直接输出改写后的全文，不要解释。`;
            return await callAi(url, key, model, sys, text, 8000);
        }

        async function deepRewriteUntilZero(initialText) {
            let currentText = initialText;
            let reportLog = `📝 初稿字数：${countWords(currentText)}\n`;
            const maxIter = 5;
            for(let i=1; i<=maxIter; i++) {
                const score = await selfEvaluate(currentText);
                reportLog += `🔍 第${i}轮自评：AI嫌疑分 ${score}/100\n`;
                if(score === 0) {
                    reportLog += `✅ 已通过朱雀自检，无需继续改写。`;
                    $('#checkReport').textContent = reportLog;
                    return currentText;
                }
                if(i < maxIter) {
                    reportLog += `🔄 正在进行第${i}轮改写...\n`;
                    currentText = await rewriteText(currentText);
                } else {
                    reportLog += `⚠️ 已达最大改写次数，输出当前文本。`;
                }
            }
            $('#checkReport').textContent = reportLog;
            return currentText;
        }

        const startDeepCheck = async () => {
            if(generating) return;
            const outline = $('#writeOutline').value.trim(); if(!outline) return Toast.show('请输入章纲');
            generating = true;
            $('#deepCheckBtn').disabled = true; $('#genBtn').disabled = true; $('#stopBtn').style.display = 'inline-block';
            $('#checkReport').textContent = '⏳ 正在生成初稿...';
            try {
                const {url, key, model} = getApiInfo(); if(!key) throw new Error('未设置API密钥');
                const wordTarget = parseInt($('#wordTarget').value)||2000;
                const sys = buildWriteSys(wordTarget);
                const draft = await callAi(url, key, model, sys, outline, Math.min(Math.ceil(wordTarget*2.2),8000));
                const finalText = await deepRewriteUntilZero(draft);
                $('#resultArea').value = finalText;
                Toast.show(`过检完成，最终字数：${countWords(finalText)}`);
            } catch(e) {
                if(e.name !== 'AbortError') Toast.show('失败：'+e.message);
            } finally {
                generating=false; $('#deepCheckBtn').disabled=false; $('#genBtn').disabled=false; $('#stopBtn').style.display='none';
            }
        };

        const startNormalGen = async () => {
            if(generating) return;
            const outline = $('#writeOutline').value.trim(); if(!outline) return Toast.show('请输入章纲');
            generating = true; $('#genBtn').disabled = true; $('#deepCheckBtn').disabled = true; $('#stopBtn').style.display = 'inline-block';
            try {
                const {url, key, model} = getApiInfo(); if(!key) throw new Error('未设置API密钥');
                const wordTarget = parseInt($('#wordTarget').value)||2000;
                const sys = buildWriteSys(wordTarget);
                abortCtrl = new AbortController();
                const res = await fetch(`${url}/chat/completions`, {
                    method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
                    signal:abortCtrl.signal,
                    body:JSON.stringify({model, messages:[{role:'system',content:sys},{role:'user',content:outline}], temperature:0.85, max_tokens:Math.min(Math.ceil(wordTarget*2.2),8000)})
                });
                if(!res.ok) throw new Error(`请求失败(${res.status})`);
                const data = await res.json();
                $('#resultArea').value = data.choices?.[0]?.message?.content || '';
                Toast.show(`生成完成，字数：${countWords($('#resultArea').value||'')}`);
            } catch(e) { if(e.name !== 'AbortError') Toast.show(e.message); }
            finally { generating=false; $('#genBtn').disabled=false; $('#deepCheckBtn').disabled=false; $('#stopBtn').style.display='none'; }
        };

        $('#genBtn').onclick = () => { clearTimeout(window._genTimer); window._genTimer = setTimeout(startNormalGen, 300); };
        $('#deepCheckBtn').onclick = () => { clearTimeout(window._genTimer); window._genTimer = setTimeout(startDeepCheck, 300); };
        $('#stopBtn').onclick = () => { if(abortCtrl) abortCtrl.abort(); };
        $('#adoptBtn').onclick = () => {
            const content = $('#resultArea').value.trim(); if(!content) return Toast.show('请先生成');
            let chs = LS.get('chapters', []); if(!chs.length) { LS.set('volumes', [{id:'v1', name:'默认卷'}]); chs.push({id:'c1', title:'第1章', volumeId:'v1', content:''}); }
            chs[0].content += '\n' + content; LS.set('chapters', chs); Toast.show('已追加到第1章');
        };
    }

    // ========== 8️⃣ 逻辑校验 ==========
    function renderCheck(panel) {
        panel.innerHTML = `
            <h3>🔍 逻辑校验与AI检测规避提示</h3>
            <button class="btn" id="runCheck">执行检查</button>
            <div id="checkResult" class="memory-box"></div>
            <p style="font-size:0.7rem;color:#8a7958;margin-top:8px;">朱雀检测规避提示：避免规律句式、大段排比，多用具体描写代替概括性形容词，对话中加入人物小动作。</p>
        `;
        $('#runCheck').onclick = () => {
            const chars = LS.get('characters', []); const realm = LS.get('worldRealm',''); let issues = [];
            if(!realm) issues.push('未设置修炼体系');
            chars.forEach(c => { if(!c.realm) issues.push(`角色“${c.name}”未设置境界`); });
            issues.push('✅ 朱雀检测规避建议：确保句式长短交错，每200字至少包含一处具体感官描写（温度/气味/触感）。');
            $('#checkResult').textContent = issues.length ? issues.join('\n') : '✅ 基础检查通过，请人工复核';
        };
    }

    // ========== 9️⃣ 风格定制 ==========
    function renderStyle(panel) {
        panel.innerHTML = `
            <h3>🎨 风格定制</h3>
            <select id="stylePreset"><option value="chendong">辰东</option><option value="tudou">土豆</option></select>
            <input id="styleTone" placeholder="自定义语气">
            <button class="btn" id="saveStyle">保存</button>
        `;
        $('#stylePreset').value = LS.get('stylePreset','chendong'); $('#styleTone').value = LS.get('styleTone','');
        $('#saveStyle').onclick = () => { LS.set('stylePreset', $('#stylePreset').value); LS.set('styleTone', $('#styleTone').value); Toast.show('已保存'); };
    }

    // ========== 🔟 备份导入 ==========
    function renderBackup(panel) {
        panel.innerHTML = `
            <h3>💾 数据备份与恢复</h3>
            <button class="btn" id="exportBackup">📤 导出全部数据</button>
            <button class="btn" id="importBackup">📥 导入备份文件</button>
            <button class="btn btn-danger" id="resetAllBtn">⚠️ 重置全部数据</button>
            <input type="file" id="importFile" style="display:none" accept=".json">
        `;
        $('#exportBackup').onclick = () => {
            const backup = {}; for(let i=0; i<localStorage.length; i++) { const key = localStorage.key(i); backup[key] = LS.get(key); }
            const blob = new Blob([JSON.stringify(backup)], {type:'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '写作中枢备份.json'; a.click();
            Toast.show('备份已导出');
        };
        $('#importBackup').onclick = () => $('#importFile').click();
        $('#importFile').onchange = e => {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try { const data = JSON.parse(ev.target.result); localStorage.clear(); Object.entries(data).forEach(([k,v]) => LS.set(k, v)); Toast.show('数据恢复成功，请刷新界面'); }
                catch(ex) { Toast.show('备份文件格式错误'); }
            };
            reader.readAsText(file);
        };
        $('#resetAllBtn').onclick = () => {
            if(!confirm('⚠️ 此操作将永久删除所有本地数据，不可恢复！\n建议先导出备份。\n\n确定要重置吗？')) return;
            localStorage.clear(); Toast.show('数据已清空，即将刷新'); setTimeout(() => location.reload(), 1500);
        };
    }

    // 启动
    renderSidebar();
    switchTab('dashboard');
    Toast.show('全功能深度过检版已启动');
</script>
</body>
</html>
