<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>网文创作中枢 · 冷笔白描强化版</title>
  <style>
    :root {
      --bg: #0f0d0a; --panel: #1c1610; --text: #d4be8c; --accent: #c0843a;
      --accent2: #e6a34c; --border: #3d2b18; --editor: #2c2218; --radius: 12px;
      --font: 'PingFang SC', 'Noto Serif SC', 'KaiTi', sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); height:100vh; display:flex; overflow:hidden; }
    .sidebar { width:240px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
    .sidebar h3 { padding:18px 14px; color:var(--accent2); text-align:center; border-bottom:1px solid var(--border); margin:0; }
    .tab-list { flex:1; overflow-y:auto; padding:8px; }
    .tab-btn { display:block; width:100%; text-align:left; background:transparent; border:1px solid transparent; color:var(--text); padding:12px; margin-bottom:2px; border-radius:8px; font-size:0.9rem; cursor:pointer; transition:0.2s; }
    .tab-btn:hover, .tab-btn.active { background:var(--editor); border-color:var(--accent); color:var(--accent2); }
    .main-area { flex:1; padding:20px 24px; overflow-y:auto; display:flex; flex-direction:column; gap:16px; }
    .panel { display:none; flex-direction:column; gap:14px; }
    .panel.active { display:flex; }
    h3 { color:var(--accent2); font-size:1.3rem; border-bottom:1px solid var(--border); padding-bottom:8px; margin:0; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .field { display:flex; flex-direction:column; gap:4px; }
    label { font-size:0.8rem; color:var(--accent); font-weight:600; }
    input, textarea, select { background:var(--editor); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px; font-size:0.9rem; font-family:var(--font); outline:none; }
    textarea { min-height:80px; resize:vertical; }
    .btn { background:var(--accent); color:white; border:none; padding:10px 18px; border-radius:20px; cursor:pointer; font-weight:bold; align-self:flex-start; }
    .btn:disabled { opacity:0.6; pointer-events:none; }
    .btn-sm { padding:6px 12px; font-size:0.8rem; border-radius:14px; }
    .card { background:var(--editor); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; }
    .list-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:var(--editor); border-radius:8px; margin-bottom:6px; }
    .tag { background:var(--accent); color:white; padding:2px 10px; border-radius:12px; font-size:0.7rem; }
    .memory-box { background:#1a1410; border:1px solid var(--border); border-radius:var(--radius); padding:12px; max-height:220px; overflow-y:auto; white-space:pre-wrap; font-size:0.85rem; }
    .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#2f2416; color:#ffcf8a; padding:8px 20px; border-radius:20px; z-index:999; opacity:0; transition:0.3s; }
    .toast.show { opacity:1; }
    .btn-danger { background:#a05a3a; }
    .hint { font-size:0.7rem; color:#8a7958; margin-top:-8px; }
    .hide { display:none !important; }
    .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    @media (max-width:768px) { .sidebar { width:200px; } .grid-2 { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="sidebar">
  <h3>📖 创作中枢</h3>
  <div class="tab-list" id="tabList"></div>
</div>
<div class="main-area" id="mainArea"></div>
<div class="toast" id="toast"></div>

<script>
// ========== 全局配置与数据层 ==========
const CONFIG = {
  DB_NAME: 'NovelWriterFull',
  API_DEFAULT_URL: 'https://api.deepseek.com/v1',
  API_DEFAULT_MODEL: 'deepseek-v4-pro',
  MEMORY_SLICE_SIZE: 15000,
  MAX_SLICES: 20
};

const LS = {
  get(key, fallback = null) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch(e) { Toast.show('存储空间不足！'); return false; }
  }
};

// ========== 工具函数 ==========
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const Toast = {
  show(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._tid);
    t._tid = setTimeout(() => t.classList.remove('show'), 2000);
  }
};
const countWords = t => t.replace(/\s/g,'').length;

// ========== 导航与面板管理 ==========
const tabs = [
  {id:'dashboard', label:'🏠 总控台'}, {id:'characters', label:'👤 人设库'},
  {id:'world', label:'🌍 世界观'}, {id:'outline', label:'📋 三层大纲'},
  {id:'chapters', label:'📚 章节管理'}, {id:'memory', label:'🧠 记忆库'},
  {id:'write', label:'✍️ 写作'}, {id:'check', label:'🔍 逻辑校验'},
  {id:'style', label:'🎨 风格定制'}, {id:'backup', label:'💾 备份导入'}
];

function initNav() {
  const list = $('#tabList');
  list.innerHTML = tabs.map(t => `<button class="tab-btn" data-tab="${t.id}">${t.label}</button>`).join('');
  list.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', e => switchTab(e.target.dataset.tab)));
}

function switchTab(tabId) {
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  const main = $('#mainArea');
  main.innerHTML = '';
  const panel = document.createElement('div');
  panel.className = 'panel active';
  panel.id = 'panel-' + tabId;
  main.appendChild(panel);
  const renderers = {
    dashboard: renderDashboard, characters: renderCharacters, world: renderWorld,
    outline: renderOutline, chapters: renderChapters, memory: renderMemory,
    write: renderWrite, check: renderCheck, style: renderStyle, backup: renderBackup
  };
  if (renderers[tabId]) renderers[tabId](panel);
}

// ========== API 安全调用 ==========
async function callAi(url, key, model, sys, usr, maxT = 6000) {
  try {
    const res = await fetch(`${url}/chat/completions`, {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
      body: JSON.stringify({model, messages:[{role:'system',content:sys},{role:'user',content:usr}], temperature:0.85, max_tokens:maxT})
    });
    if(!res.ok) throw new Error(`API请求失败 (${res.status})`);
    const data = await res.json();
    return data?.choices?.[0]?.message?.content || '';
  } catch(e) {
    console.error('AI调用异常:', e);
    throw e;
  }
}

// ========== 面板实现 ==========
function renderDashboard(p) {
  p.innerHTML = `<h3>🏠 小说基础信息</h3>
    <div class="grid-2"><div class="field"><label>小说名称</label><input id="novelTitle"></div><div class="field"><label>类型/流派</label><input id="novelGenre"></div></div>
    <div class="field"><label>世界观简介</label><textarea id="novelWorldIntro"></textarea></div>
    <div class="field"><label>故事基调/读者定位</label><input id="novelTone"></div>
    <button class="btn" id="saveDashboard">💾 保存基础设定</button>`;
  $('#novelTitle').value = LS.get('novelTitle','');
  $('#novelGenre').value = LS.get('novelGenre','');
  $('#novelWorldIntro').value = LS.get('novelWorldIntro','');
  $('#novelTone').value = LS.get('novelTone','');
  $('#saveDashboard').onclick = () => {
    LS.set('novelTitle', $('#novelTitle').value);
    LS.set('novelGenre', $('#novelGenre').value);
    LS.set('novelWorldIntro', $('#novelWorldIntro').value);
    LS.set('novelTone', $('#novelTone').value);
    Toast.show('基础设定已保存');
  };
}

function renderCharacters(p) {
  p.innerHTML = `<h3>👤 人设库</h3><div id="charList"></div><button class="btn btn-sm" id="addChar">+ 新建角色</button>
    <div class="card hide" id="charEditor">
      <div class="grid-2"><div class="field"><label>全名</label><input id="charName"></div><div class="field"><label>别名</label><input id="charAlias"></div></div>
      <div class="field"><label>性格</label><input id="charPersonality"></div>
      <div class="field"><label>境界</label><input id="charRealm"></div>
      <div class="field"><label>口头禅</label><input id="charCatchphrase"></div>
      <div class="field"><label>弱点/禁忌</label><input id="charWeakness"></div>
      <div class="field"><label>关系网</label><textarea id="charRelations"></textarea></div>
      <button class="btn" id="saveChar">保存角色</button>
    </div>`;
  let cur = null;
  const refresh = () => {
    const chars = LS.get('characters', []);
    $('#charList').innerHTML = chars.map((c,i) => `
      <div class="list-item">
        <span><strong>${c.name}</strong> <span class="tag">${c.realm||'未知'}</span></span>
        <div>
          <button class="btn btn-sm edit-char" data-index="${i}">编辑</button>
          <button class="btn btn-sm del-char btn-danger" data-index="${i}">删除</button>
        </div>
      </div>
    `).join('');
    $$('.edit-char').forEach(b => b.onclick = () => {
      const c = LS.get('characters', [])[b.dataset.index]; cur = b.dataset.index;
      $('#charName').value=c.name; $('#charAlias').value=c.alias; $('#charPersonality').value=c.personality;
      $('#charRealm').value=c.realm; $('#charCatchphrase').value=c.catchphrase;
      $('#charWeakness').value=c.weakness; $('#charRelations').value=c.relations;
      $('#charEditor').classList.remove('hide');
    });
    $$('.del-char').forEach(b => b.onclick = () => {
      if(!confirm('确定删除？')) return;
      let chars = LS.get('characters', []); chars.splice(b.dataset.index, 1);
      LS.set('characters', chars); refresh();
    });
  };
  refresh();
  $('#addChar').onclick = () => {
    cur = null;
    ['charName','charAlias','charPersonality','charRealm','charCatchphrase','charWeakness','charRelations'].forEach(id => $('#'+id).value='');
    $('#charEditor').classList.remove('hide');
  };
  $('#saveChar').onclick = () => {
    const name = $('#charName').value.trim();
    if(!name) return Toast.show('请输入角色名');
    const obj = { name, alias:$('#charAlias').value, personality:$('#charPersonality').value, realm:$('#charRealm').value, catchphrase:$('#charCatchphrase').value, weakness:$('#charWeakness').value, relations:$('#charRelations').value };
    let chars = LS.get('characters', []);
    if(cur !== null) chars[cur] = obj; else chars.push(obj);
    LS.set('characters', chars);
    $('#charEditor').classList.add('hide');
    refresh();
    Toast.show('角色已保存');
  };
}

function renderWorld(p) {
  p.innerHTML = `<h3>🌍 世界观规则引擎</h3>
    <div class="field"><label>修炼体系 / 境界划分</label><textarea id="worldRealm"></textarea></div>
    <div class="field"><label>地域地图 / 势力分布</label><textarea id="worldMap"></textarea></div>
    <div class="field"><label>世界铁律 (不可打破的规则)</label><textarea id="worldRules"></textarea></div>
    <button class="btn" id="saveWorld">💾 保存世界观</button>`;
  $('#worldRealm').value = LS.get('worldRealm','');
  $('#worldMap').value = LS.get('worldMap','');
  $('#worldRules').value = LS.get('worldRules','');
  $('#saveWorld').onclick = () => {
    LS.set('worldRealm', $('#worldRealm').value);
    LS.set('worldMap', $('#worldMap').value);
    LS.set('worldRules', $('#worldRules').value);
    Toast.show('世界观已保存');
  };
}

function renderOutline(p) {
  p.innerHTML = `<h3>📋 三层大纲系统</h3>
    <div class="field"><label>总纲 (全书主线 + 结局)</label><textarea id="outlineMaster"></textarea></div>
    <div class="field"><label>卷纲 (当前卷剧情走向)</label><textarea id="outlineVolume"></textarea></div>
    <div class="field"><label>章纲 (当前章节精准剧情节点)</label><textarea id="outlineChapter"></textarea></div>
    <button class="btn" id="saveOutline">💾 保存大纲</button>`;
  $('#outlineMaster').value = LS.get('outlineMaster','');
  $('#outlineVolume').value = LS.get('outlineVolume','');
  $('#outlineChapter').value = LS.get('outlineChapter','');
  $('#saveOutline').onclick = () => {
    LS.set('outlineMaster', $('#outlineMaster').value);
    LS.set('outlineVolume', $('#outlineVolume').value);
    LS.set('outlineChapter', $('#outlineChapter').value);
    Toast.show('大纲已保存');
  };
}

function renderChapters(p) {
  p.innerHTML = `<h3>📚 分卷与章节管理</h3>
    <div style="display:flex; gap:10px; margin-bottom:10px;">
      <button class="btn btn-sm" id="addVolume">+ 新建分卷</button>
      <button class="btn btn-sm" id="exportTxt">📤 导出全书TXT</button>
    </div>
    <div id="volumeList"></div>`;
  const refresh = () => {
    const vols = LS.get('volumes', []);
    const chs = LS.get('chapters', []);
    let html = '';
    vols.forEach(vol => {
      html += `<div class="card">
        <div class="card-header">
          <span>📁 ${vol.name}</span>
          <div>
            <button class="btn btn-sm rename-vol" data-id="${vol.id}">重命名</button>
            <button class="btn btn-sm del-vol btn-danger" data-id="${vol.id}">删除</button>
          </div>
        </div>`;
      const volChapters = chs.filter(c => c.volumeId === vol.id);
      volChapters.forEach((ch, idx) => {
        html += `<div class="list-item">
          <span>${ch.title} <span class="tag">${countWords(ch.content||'')}字</span></span>
          <div>
            <button class="btn btn-sm move-up" data-id="${ch.id}" ${idx===0?'disabled':''}>↑</button>
            <button class="btn btn-sm move-down" data-id="${ch.id}" ${idx===volChapters.length-1?'disabled':''}>↓</button>
            <button class="btn btn-sm rename-ch" data-id="${ch.id}">重命名</button>
            <button class="btn btn-sm del-ch btn-danger" data-id="${ch.id}">删除</button>
          </div>
        </div>`;
      });
      html += `<button class="btn btn-sm add-ch" data-vol="${vol.id}" style="margin-left:20px;">+ 添加章节</button></div>`;
    });
    $('#volumeList').innerHTML = html || '暂无分卷，请新建';
    // 事件绑定
    $$('.rename-vol').forEach(b => b.onclick = () => {
      const vols = LS.get('volumes', []); const vol = vols.find(v => v.id === b.dataset.id);
      const newName = prompt('新名称', vol?.name); if(newName) { vol.name = newName; LS.set('volumes', vols); refresh(); }
    });
    $$('.del-vol').forEach(b => b.onclick = () => {
      if(!confirm('删除分卷会同时删除其下所有章节，确定？')) return;
      let vols = LS.get('volumes', []); vols = vols.filter(v => v.id !== b.dataset.id);
      LS.set('volumes', vols);
      let chs = LS.get('chapters', []); chs = chs.filter(c => c.volumeId !== b.dataset.id);
      LS.set('chapters', chs); refresh();
    });
    $$('.add-ch').forEach(b => b.onclick = () => {
      const title = prompt('章节标题'); if(!title) return;
      let chs = LS.get('chapters', []); chs.push({id: Date.now().toString(), title, volumeId: b.dataset.vol, content: ''});
      LS.set('chapters', chs); refresh();
    });
    $$('.move-up').forEach(b => b.onclick = () => {
      let chs = LS.get('chapters', []); const ch = chs.find(c => c.id === b.dataset.id); if(!ch) return;
      const siblings = chs.filter(c => c.volumeId === ch.volumeId); const idx = siblings.findIndex(c => c.id === ch.id);
      if(idx > 0) {
        [siblings[idx], siblings[idx-1]] = [siblings[idx-1], siblings[idx]];
        const other = chs.filter(c => c.volumeId !== ch.volumeId);
        LS.set('chapters', [...other, ...siblings]); refresh();
      }
    });
    $$('.move-down').forEach(b => b.onclick = () => {
      let chs = LS.get('chapters', []); const ch = chs.find(c => c.id === b.dataset.id); if(!ch) return;
      const siblings = chs.filter(c => c.volumeId === ch.volumeId); const idx = siblings.findIndex(c => c.id === ch.id);
      if(idx < siblings.length-1) {
        [siblings[idx], siblings[idx+1]] = [siblings[idx+1], siblings[idx]];
        const other = chs.filter(c => c.volumeId !== ch.volumeId);
        LS.set('chapters', [...other, ...siblings]); refresh();
      }
    });
    $$('.rename-ch').forEach(b => b.onclick = () => {
      let chs = LS.get('chapters', []); const ch = chs.find(c => c.id === b.dataset.id); if(!ch) return;
      const newTitle = prompt('新标题', ch.title); if(newTitle) { ch.title = newTitle; LS.set('chapters', chs); refresh(); }
    });
    $$('.del-ch').forEach(b => b.onclick = () => {
      if(!confirm('删除该章节？')) return;
      let chs = LS.get('chapters', []); chs = chs.filter(c => c.id !== b.dataset.id);
      LS.set('chapters', chs); refresh();
    });
  };
  refresh();
  $('#addVolume').onclick = () => {
    const name = prompt('分卷名称'); if(!name) return;
    let vols = LS.get('volumes', []); vols.push({id: Date.now().toString(), name});
    LS.set('volumes', vols); refresh();
  };
  $('#exportTxt').onclick = () => {
    const vols = LS.get('volumes', []); const chs = LS.get('chapters', []); let txt = '';
    vols.forEach(vol => {
      txt += `\n=== ${vol.name} ===\n`;
      chs.filter(c => c.volumeId === vol.id).forEach(c => txt += `## ${c.title}\n\n${c.content}\n\n`);
    });
    const blob = new Blob(['\uFEFF'+txt], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '小说全文.txt'; a.click();
    Toast.show('全书已导出');
  };
}

function renderMemory(p) {
  p.innerHTML = `<h3>🧠 全局记忆库（轻量分片）</h3>
    <textarea id="fullTextInput" rows="6" placeholder="粘贴整本小说正文..."></textarea>
    <div style="display:flex; gap:10px;">
      <button class="btn" id="parseBtn">🚀 解析并分片存储</button>
      <button class="btn btn-danger" id="clearMemoryBtn">🗑️ 清空记忆</button>
    </div>
    <div id="memStatus" class="memory-box">暂无记忆数据</div>
    <p style="font-size:0.7rem;color:#8a7958;">注：文本将按每段15000字分片，最多保存20个片段。</p>`;
  const update = () => {
    const slices = LS.get('memorySlices', []);
    $('#memStatus').textContent = slices.length ? `已存储 ${slices.length} 个记忆片段` : '暂无记忆数据';
  };
  update();
  $('#parseBtn').onclick = () => {
    const text = $('#fullTextInput').value.trim();
    if(!text) return Toast.show('请粘贴正文');
    let slices = [];
    for(let i=0; i<text.length && slices.length<20; i+=15000) slices.push(text.slice(i, i+15000));
    LS.set('memorySlices', slices);
    update();
    Toast.show(`分片完成，共 ${slices.length} 个片段`);
  };
  $('#clearMemoryBtn').onclick = () => {
    if(!confirm('确定清空所有记忆片段？')) return;
    LS.set('memorySlices', []);
    $('#fullTextInput').value = '';
    update();
    Toast.show('记忆已清空');
  };
}

function renderWrite(p) {
  p.innerHTML = `<h3>✍️ 写作引擎（冷笔白描强化版）</h3>
    <div class="grid-2"><div class="field"><label>📡 API 地址</label><input id="apiUrlInput" placeholder="${CONFIG.API_DEFAULT_URL}"></div><div class="field"><label>🧠 模型名称</label><input id="modelNameInput" placeholder="${CONFIG.API_DEFAULT_MODEL}"></div></div>
    <div class="field"><label>🔑 API密钥</label><input type="password" id="apiKeyInput"></div>
    <div class="field"><label>🛡️ Sapling检测密钥 (可选，外部检测用)</label><input type="password" id="saplingKeyInput" placeholder="留空则使用内置自评"></div>
    <div class="field"><label>📝 当前章纲</label><textarea id="writeOutline"></textarea></div>
    <div class="grid-2"><div class="field"><label>📖 目标字数</label><input id="wordTarget" type="number" value="2000" min="200" max="8000" step="100"><span class="hint">AI将严格控制在±10%范围内</span></div><div class="field"><label>⚡ 结尾钩子</label><input id="hookInput" placeholder="结尾留悬念"></div></div>
    <div class="field"><label>📖 关联记忆</label><div class="memory-box" id="recallResult">暂未检索</div></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn" id="genBtn">✨ 普通生成</button>
      <button class="btn" id="deepCheckBtn" style="background:#b85e1e;">🔄 深度过检（改写到0）</button>
      <button class="btn btn-danger" id="stopBtn" style="display:none;">⏹️ 取消生成</button>
    </div>
    <textarea id="resultArea" rows="10"></textarea>
    <button class="btn btn-sm" id="adoptBtn">✅ 采纳到章节</button>
    <div class="card"><h4 style="color:var(--accent2);margin-bottom:8px;">📋 过检报告</h4><div id="checkReport" class="memory-box">点击“深度过检”后此处将显示检测与改写过程</div></div>`;

  // 恢复存储值
  $('#apiUrlInput').value = LS.get('apiUrl', CONFIG.API_DEFAULT_URL);
  $('#modelNameInput').value = LS.get('modelName', CONFIG.API_DEFAULT_MODEL);
  $('#apiKeyInput').value = LS.get('apiKey', '');
  $('#saplingKeyInput').value = LS.get('saplingKey', '');
  ['apiUrlInput','modelNameInput','apiKeyInput','saplingKeyInput'].forEach(id => {
    $('#'+id).addEventListener('input', e => LS.set(id.replace('Input',''), e.target.value));
  });

  let generating = false;

  const getApiInfo = () => ({
    url: $('#apiUrlInput').value.trim(),
    key: $('#apiKeyInput').value.trim(),
    model: $('#modelNameInput').value.trim(),
    sapling: $('#saplingKeyInput').value.trim()
  });

  // 已替换为冷笔白描专用构建函数
  const buildWriteSys = (wt) => {
    const slices = LS.get('memorySlices', []); 
    const outline = $('#writeOutline').value.trim();
    const kws = outline.split(/[，。\s]+/).filter(k => k.length>=2);
    let rel = []; 
    slices.forEach(s => { 
      let sc=0; 
      kws.forEach(k => { if(s.includes(k)) sc++; }); 
      if(sc>0) rel.push({text:s, score:sc}); 
    });
    rel.sort((a,b)=>b.score-a.score); 
    rel = rel.slice(0,4).map(r=>r.text);
    $('#recallResult').textContent = rel.join('\n\n') || '无关联记忆';
    
    const wR = LS.get('worldRealm',''); 
    const chs = LS.get('characters',[]);
    const cd = chs.map(c => `${c.name}:${c.personality},${c.realm}`).join('；');
    const hk = $('#hookInput').value ? `；${$('#hookInput').value}` : '';

    // 内置你的全套冷笔白描规则
    const styleRule = `
严格遵循以下写作铁律，全程强制执行：
1. 剔除所有情绪形容词，绝不写悲伤、绝望、愤怒、凄凉等抒情词，只写动作、景象、状态，留白让读者自感情绪。
2. 全程只用陈述句，无感叹句、无疑问句，史书式平铺直叙，语气淡漠冷静。
3. 半文半白行文，淘汰现代口语，不用慢慢、突然、非常、心里感受类词汇，改用渐、微、忽、默然、寂然、无言、寂寥。
4. 只用具象实词，只铺景物、身形、动作、身份、结果，不做多余虚词铺垫。写人只用立、坐、垂首、侧目、不语、转身；写景只用风、雪、夜、江、碑、荒村、残山。
5. 克制化用词，绝不夸张炸裂，不写惊天动地、盖世无敌、肝肠寸断，大事淡写、生死轻描。
6. 行文固定顺序：先写景，再写身形，再神态动作，最后极简台词。
7. 不写人物心理活动、内心纠结，只外化动作与沉默，藏内心于表象。
8. 对话极简，一句不超七八字，能短则短，无长篇说教废话。
9. 结果前置、过程省略，留白写法点到为止，不把恩怨遗憾说透。
10. 冷笔写悲情，生死别离惨事皆用淡字叙述，以平静衬悲凉。
全程套用短句白描、宿命句式，句式多用：景物单句、人物动作状态、垂眸不语、宿命短句。
`;

  return `${styleRule}
世界观设定：${wR||'无'}
登场人物设定：${cd||'无'}
前文关联记忆：${rel.join('\n\n')||'无'}
按给定章纲续写正文，严格控制正文字数在${wt}字左右，误差不超±10%。
只输出纯正文，不解释、不说明、不加额外话术。${hk}`;
};

  // 外部检测或内置自评
  async function evaluateText(text) {
    const {sapling} = getApiInfo();
    if(sapling) {
      // 外部Sapling检测
      try {
        const res = await fetch('https://api.sapling.ai/api/v1/aidetect', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ key: sapling, text: text })
        });
        if(res.ok) {
          const data = await res.json();
          return { score: Math.round((data.score || 0.5) * 100), flagged: data.flagged_sentences || [] };
        }
      } catch(e) { console.error('外部检测失败，降级为内置自评', e); }
    }
    // 内置自评
    const {url, key, model} = getApiInfo();
    const sys = `你是专业的AI文本检测专家。请分析以下文本的“AI生成痕迹”，从0到100打分：0分：完全像人类写作。100分：明显AI生成。只需回复一个整数分数。`;
    try {
      const scoreStr = await callAi(url, key, model, sys, text, 50);
      const score = parseInt(scoreStr);
      return { score: isNaN(score) ? 50 : Math.min(100, Math.max(0, score)), flagged: [] };
    } catch(e) {
      return { score: 50, flagged: [] };
    }
  }

  // 针对性改写
  async function rewriteFlagged(text, flaggedSentences) {
    if(!flaggedSentences.length) return text;
    const {url, key, model} = getApiInfo();
    let rewritten = text;
    for(const fs of flaggedSentences) {
      const sys = `你是专业小说编辑。请改写下面这句话，使其更像人类写作。加入具体感官细节（温度/气味/触感），使用不规则句式，避免华丽辞藻。只输出改写后的句子：\n${fs.sentence}`;
      try {
        const newSent = await callAi(url, key, model, sys, '', 300);
        rewritten = rewritten.replace(fs.sentence, newSent.trim());
      } catch(e) {}
    }
    return rewritten;
  }

  // 深度过检主循环
  async function deepRewriteUntilZero(initialText) {
    let currentText = initialText;
    let log = `📝 初稿字数：${countWords(currentText)}\n`;
    const maxIter = 5;
    for(let i=1; i<=maxIter; i++) {
      const {score, flagged} = await evaluateText(currentText);
      log += `🔍 第${i}轮检测：AI嫌疑分 ${score}/100`;
      if(flagged.length) log += `，标记句子 ${flagged.length} 句`;
      log += '\n';
      if(score <= 5 || !flagged.length) {
        log += `✅ 已达标，无需继续改写。`;
        $('#checkReport').textContent = log;
        return currentText;
      }
      if(i < maxIter) {
        log += `🔄 正在进行第${i}轮针对性改写...\n`;
        currentText = await rewriteFlagged(currentText, flagged);
      } else {
        log += `⚠️ 已达最大改写次数（5次），输出当前文本。`;
      }
    }
    $('#checkReport').textContent = log;
    return currentText;
  }

  // 深度过检入口
  const startDeepCheck = async () => {
    if(generating) return;
    const outline = $('#writeOutline').value.trim();
    if(!outline) return Toast.show('请输入章纲');
    generating = true;
    $('#deepCheckBtn').disabled = true;
    $('#genBtn').disabled = true;
    $('#stopBtn').style.display = 'inline-block';
    $('#checkReport').textContent = '⏳ 正在生成初稿...';
    try {
      const {url, key, model} = getApiInfo();
      if(!key) throw new Error('未设置API密钥');
      const wt = parseInt($('#wordTarget').value)||2000;
      const draft = await callAi(url, key, model, buildWriteSys(wt), outline, Math.min(Math.ceil(wt*2.2), 8000));
      const final = await deepRewriteUntilZero(draft);
      $('#resultArea').value = final;
      Toast.show(`过检完成，最终字数：${countWords(final)}`);
    } catch(e) {
      if(e.name !== 'AbortError') Toast.show('失败：'+e.message);
    } finally {
      generating = false;
      $('#deepCheckBtn').disabled = false;
      $('#genBtn').disabled = false;
      $('#stopBtn').style.display = 'none';
    }
  };

  // 普通生成入口
  const startNormalGen = async () => {
    if(generating) return;
    const outline = $('#writeOutline').value.trim();
    if(!outline) return Toast.show('请输入章纲');
    generating = true;
    $('#genBtn').disabled = true;
    $('#deepCheckBtn').disabled = true;
    $('#stopBtn').style.display = 'inline-block';
    try {
      const {url, key, model} = getApiInfo();
      if(!key) throw new Error('未设置API密钥');
      const wt = parseInt($('#wordTarget').value)||2000;
      const abortCtrl = new AbortController();
      const res = await fetch(`${url}/chat/completions`, {
        method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},
        signal: abortCtrl.signal,
        body: JSON.stringify({model, messages:[{role:'system',content:buildWriteSys(wt)},{role:'user',content:outline}], temperature:0.85, max_tokens:Math.min(Math.ceil(wt*2.2),8000)})
      });
      if(!res.ok) throw new Error(`请求失败(${res.status})`);
      const data = await res.json();
      $('#resultArea').value = data?.choices?.[0]?.message?.content || '';
      Toast.show(`生成完成，字数：${countWords($('#resultArea').value||'')}`);
    } catch(e) {
      if(e.name !== 'AbortError') Toast.show('失败：'+e.message);
    } finally {
      generating = false;
      $('#genBtn').disabled = false;
      $('#deepCheckBtn').disabled = false;
      $('#stopBtn').style.display = 'none';
    }
  };

  // 绑定按钮
  $('#genBtn').onclick = () => { clearTimeout(window._genT); window._genT = setTimeout(startNormalGen, 300); };
  $('#deepCheckBtn').onclick = () => { clearTimeout(window._genT); window._genT = setTimeout(startDeepCheck, 300); };
  $('#stopBtn').onclick = () => { if(window._abortCtrl) window._abortCtrl.abort(); };
  $('#adoptBtn').onclick = () => {
    const content = $('#resultArea').value.trim();
    if(!content) return Toast.show('请先生成正文');
    let chs = LS.get('chapters', []);
    if(!chs.length) {
      LS.set('volumes', [{id:'v1', name:'默认卷'}]);
      chs.push({id:'c1', title:'第1章', volumeId:'v1', content:''});
    }
    chs[0].content += '\n' + content;
    LS.set('chapters', chs);
    Toast.show('已追加到第1章');
  };
}

function renderCheck(p) {
  p.innerHTML = `<h3>🔍 逻辑校验</h3><button class="btn" id="runCheck">执行检查</button><div id="checkResult" class="memory-box"></div>`;
  $('#runCheck').onclick = () => {
    const chars = LS.get('characters', []);
    const realm = LS.get('worldRealm','');
    let issues = [];
    if(!realm) issues.push('未设置修炼体系，可能导致战力混乱');
    chars.forEach(c => { if(!c.realm) issues.push(`角色“${c.name}”未设置境界`); });
    issues.push('✅ 基础检查通过，复杂逻辑需人工复核。');
    $('#checkResult').textContent = issues.join('\n');
  };
}

function renderStyle(p) {
  p.innerHTML = `<h3>🎨 风格定制</h3>
    <select id="stylePreset"><option value="chendong">辰东 · 九龙拉棺</option><option value="tudou">天蚕土豆 · 斗破</option></select>
    <input id="styleTone" placeholder="自定义语气（如：冷峻、热血）">
    <button class="btn" id="saveStyle">💾 保存风格</button>`;
  $('#stylePreset').value = LS.get('stylePreset','chendong');
  $('#styleTone').value = LS.get('styleTone','');
  $('#saveStyle').onclick = () => {
    LS.set('stylePreset', $('#stylePreset').value);
    LS.set('styleTone', $('#styleTone').value);
    Toast.show('风格已保存');
  };
}

function renderBackup(p) {
  p.innerHTML = `<h3>💾 数据备份与恢复</h3>
    <button class="btn" id="exportBackup">📤 导出全部数据备份</button>
    <button class="btn" id="importBackup">📥 导入备份文件</button>
    <button class="btn btn-danger" id="resetAllBtn">⚠️ 重置全部数据</button>
    <input type="file" id="importFile" style="display:none" accept=".json">`;
  $('#exportBackup').onclick = () => {
    const backup = {};
    for(let i=0; i<localStorage.length; i++) {
      const key = localStorage.key(i);
      backup[key] = LS.get(key);
    }
    const blob = new Blob([JSON.stringify(backup)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '写作中枢_全量备份.json';
    a.click();
    Toast.show('备份已导出');
  };
  $('#importBackup').onclick = () => $('#importFile').click();
  $('#importFile').onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        localStorage.clear();
        Object.entries(data).forEach(([k,v]) => LS.set(k, v));
        Toast.show('数据恢复成功，请刷新界面');
      } catch(ex) {
        Toast.show('备份文件格式错误');
      }
    };
    reader.readAsText(file);
  };
  $('#resetAllBtn').onclick = () => {
    if(!confirm('⚠️ 此操作将永久删除所有本地数据（人设、大纲、章节、记忆等），且不可恢复！\n建议先导出备份。\n\n确定要重置吗？')) return;
    localStorage.clear();
    Toast.show('所有数据已清空，即将刷新页面');
    setTimeout(() => location.reload(), 1500);
  };
}

// ========== 启动 ==========
initNav();
switchTab('dashboard');
Toast.show('创作中枢已启动（冷笔白描强化版）');
</script>
</body>
