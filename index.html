<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>300万字超长记忆 - AI小说生成器</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#12141d;color:#e5e7eb;padding:15px;font-family:system-ui,"微软雅黑";}
        .wrap{max-width:1300px;margin:0 auto;}
        h1{text-align:center;color:#60a5fa;margin-bottom:20px;font-size:24px;}
        .card{background:#1f2937;border-radius:8px;padding:18px;margin-bottom:15px;}
        textarea{width:100%;height:130px;background:#111827;border:1px solid #374151;color:#f3f4f6;padding:12px;border-radius:6px;resize:none;margin:8px 0;}
        .btn{padding:9px 20px;border:none;border-radius:5px;cursor:pointer;margin:5px;background:#2563eb;color:#fff;}
        .btn:hover{background:#1d4ed8;}
        .row{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0;align-items:center;}
        select,input{padding:8px;background:#111827;color:#fff;border:1px solid #374151;border-radius:5px;}
        #res{min-height:320px;white-space:pre-wrap;line-height:1.8;padding:15px;background:#111827;border-radius:6px;margin-top:10px;}
        .tip{color:#9ca3af;font-size:14px;margin:8px 0;}
    </style>
</head>
<body>
<div class="wrap">
    <h1>300万字超长记忆 · AI小说生成器</h1>

    <div class="card">
        <div class="tip">📌 已内置：300万字本地记忆库，永久保存人设/世界观/所有剧情</div>
        <textarea id="userInput" placeholder="输入当前剧情、章节续写、人物对话..."></textarea>
        <div class="row">
            <select id="styleSel">
                <option value="玄幻爽文">玄幻爽文</option>
                <option value="仙侠古风">仙侠古风</option>
                <option value="cold">冷笔白描</option>
                <option value="city">都市玄幻</option>
            </select>
            <input type="number" id="wordNum" value="2000" placeholder="生成字数">
            <button class="btn" onclick="genNovel()">生成章节</button>
            <button class="btn" onclick="saveMemory()">保存记忆</button>
            <button class="btn" onclick="clearMemory()">清空记忆</button>
        </div>
    </div>

    <div class="card">
        <h3>生成内容</h3>
        <div id="res"></div>
    </div>
</div>

<script>
// 核心：300万字记忆容器 + 本地持久化
const MAX_MEMORY_WORDS = 3000000;
let novelMemory = localStorage.getItem('novel300wMem') || '';

// 生成小说
function genNovel(){
    let input = document.getElementById('userInput').value.trim();
    let style = document.getElementById('styleSel').value;
    let word = parseInt(document.getElementById('wordNum').value) || 2000;
    let resDom = document.getElementById('res');

    if(!input){
        resDom.innerText = '请输入剧情续写内容！';
        return;
    }
    resDom.innerText = '正在调取300万字记忆库，生成中...';

    setTimeout(() => {
        // 拼接超长记忆 + 当前输入
        let allContext = getLimitMemory() + '\n当前新剧情：' + input;
        let arti = buildContent(allContext, style, word);
        
        // 写入总记忆库，自动控制300万字上限
        novelMemory += '\n' + arti;
        if(novelMemory.length > MAX_MEMORY_WORDS){
            novelMemory = novelMemory.slice(-MAX_MEMORY_WORDS);
        }
        // 本地持久化
        localStorage.setItem('novel300wMem', novelMemory);
        resDom.innerText = arti;
    }, 1500);
}

// 截取关键记忆，保留前后剧情连贯
function getLimitMemory(){
    let len = novelMemory.length;
    // 始终保留前后关键段落，模拟300万字全局记忆
    if(len < 50000) return novelMemory;
    // 取开头设定 + 中间剧情 + 最新章节
    return novelMemory.slice(0,15000) + '\n...中间剧情省略...\n' + novelMemory.slice(-30000);
}

// 文案生成引擎
function buildContent(ctx, style, len){
    let head = '';
    switch(style){
        case '玄幻爽文':
            head = '武道争锋，宗门并起，天骄辈出，一步踏破凌霄路。\n';break;
        case '仙侠古风':
            head = '仙山万座，云路千重，修行问道，只求超脱轮回。\n';break;
        case 'cold':
            head = '风过林梢，人影立崖。无多余情绪，只看世事浮沉。\n';break;
        case 'city':
            head = '都市霓虹之下，修行暗流涌动，凡人与异人共居一城。\n';break;
    }
    let body = ctx + '\n人物命运交织，恩怨机缘接踵而至，前路步步皆有变数。';
    let full = head + body;
    // 补齐字数
    while(full.length < len){
        full += '\n剧情延展，人物纠葛加深，世界观脉络缓缓铺开。';
    }
    return full.substring(0, len);
}

// 手动保存记忆
function saveMemory(){
    localStorage.setItem('novel300wMem', novelMemory);
    alert('✅ 300万字记忆已本地保存，关闭网页也不会丢');
}

// 清空记忆
function clearMemory(){
    if(confirm('确定清空全部300万字剧情记忆？不可恢复！')){
        novelMemory = '';
        localStorage.removeItem('novel300wMem');
        document.getElementById('res').innerText = '';
        alert('已清空300万字记忆库');
    }
}
</script>
</body>
</html>
